    // ============================================================
    // 18-21. УПРАВЛЕНИЕ ТЕМАМИ, ПЕРЕМЕЩЕНИЕ, УДАЛЕНИЕ, КОПИРОВАНИЕ
    // ============================================================

    async function moveTopic(topicId, dir) {
      const sorted = [...TOPICS].sort((a, b) => a.order - b.order);
      const idx = sorted.findIndex(t => t.id === topicId);
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= sorted.length) return;
      const tmp = sorted[idx].order;
      sorted[idx].order = sorted[swapIdx].order;
      sorted[swapIdx].order = tmp;
      await persistTopics();
      render();
    }

    async function renameTopicPrompt(topicId) {
      const topic = TOPICS.find(t => t.id === topicId);
      if (!topic) return;
      window.showPromptModal('Переименовать тему', topic.name, async (val) => {
        if (!val.trim()) return;
        topic.name = val.trim();
        await persistTopics();
        render();
      });
    }

    async function deleteTopicConfirm(topicId) {
      const hasContent = (TRAINERS || []).some(t => t.topicId === topicId) ||
                        (LESSONS || []).some(l => l.topicId === topicId) ||
                        (HOMEWORKS || []).some(h => h.topicId === topicId);
      window.showConfirmModal('Удалить тему?', hasContent ? 'В этой теме есть материалы — они тоже будут удалены.' : 'Тема будет удалена.', async () => {
        TOPICS = TOPICS.filter(t => t.id !== topicId);
        TRAINERS = TRAINERS.filter(t => t.topicId !== topicId);
        LESSONS = LESSONS.filter(l => l.topicId !== topicId);
        HOMEWORKS = HOMEWORKS.filter(h => h.topicId !== topicId);
        await persistTopics();
        await persistTrainers();
        await persistLessons();
        await persistHomeworks();
        render();
      });
    }

    async function moveItem(type, id, dir) {
      let items, persistFn;
      if (type === 'trainer') { items = TRAINERS; persistFn = persistTrainers; }
      else if (type === 'lesson') { items = LESSONS; persistFn = persistLessons; }
      else if (type === 'homework') { items = HOMEWORKS; persistFn = persistHomeworks; }
      else return;

      const item = items.find(t => t.id === id);
      if (!item) return;

      const allInTopic = [];
      for (const t of TRAINERS) { if (t.topicId === item.topicId) allInTopic.push({ ...t, _type: 'trainer' }); }
      for (const l of LESSONS) { if (l.topicId === item.topicId) allInTopic.push({ ...l, _type: 'lesson' }); }
      for (const h of HOMEWORKS) { if (h.topicId === item.topicId) allInTopic.push({ ...h, _type: 'homework' }); }
      allInTopic.sort((a, b) => a.order - b.order);

      const idx = allInTopic.findIndex(t => t.id === id && t._type === type);
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= allInTopic.length) return;

      const tmp = allInTopic[idx].order;
      allInTopic[idx].order = allInTopic[swapIdx].order;
      allInTopic[swapIdx].order = tmp;

      for (const el of allInTopic) {
        if (el._type === 'trainer') {
          const found = TRAINERS.find(t => t.id === el.id);
          if (found) found.order = el.order;
        } else if (el._type === 'lesson') {
          const found = LESSONS.find(l => l.id === el.id);
          if (found) found.order = el.order;
        } else if (el._type === 'homework') {
          const found = HOMEWORKS.find(h => h.id === el.id);
          if (found) found.order = el.order;
        }
      }

      await persistTrainers();
      await persistLessons();
      await persistHomeworks();
      render();
    }

    async function moveItemToTopic(type, id) {
      let item, items, persistFn;
      if (type === 'trainer') { item = TRAINERS.find(t => t.id === id); items = TRAINERS; persistFn = persistTrainers; }
      else if (type === 'lesson') { item = LESSONS.find(l => l.id === id); items = LESSONS; persistFn = persistLessons; }
      else if (type === 'homework') { item = HOMEWORKS.find(h => h.id === id); items = HOMEWORKS; persistFn = persistHomeworks; }
      else return;

      if (!item) return;

      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <h3>Переместить в тему</h3>
        <div class="field">
          <label>Тема назначения</label>
          <select id="targetTopic">
            ${TOPICS.filter(t => t.id !== item.topicId).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
          </select>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" id="cancelMove">Отмена</button>
          <button class="btn btn-accent" id="saveMove">Переместить</button>
        </div>
      `;
      bg.appendChild(modal);
      document.body.appendChild(bg);
      bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
      modal.querySelector('#cancelMove').onclick = () => bg.remove();

      modal.querySelector('#saveMove').onclick = async () => {
        const targetTopicId = document.getElementById('targetTopic').value;
        if (!targetTopicId) { bg.remove(); return; }

        const siblings = items.filter(t => t.topicId === item.topicId);
        const maxOrder = siblings.length ? Math.max(...siblings.map(t => t.order)) : -1;
        item.order = maxOrder + 1;
        item.topicId = targetTopicId;

        const newSiblings = items.filter(t => t.topicId === targetTopicId);
        const newMaxOrder = newSiblings.length ? Math.max(...newSiblings.map(t => t.order)) : -1;
        item.order = newMaxOrder + 1;

        await persistFn();
        bg.remove();
        render();
      };
    }

    async function deleteItemConfirm(type, id) {
      let items, persistFn, name;
      if (type === 'trainer') { items = TRAINERS; persistFn = persistTrainers; name = 'тренажёр'; }
      else if (type === 'lesson') { items = LESSONS; persistFn = persistLessons; name = 'урок'; }
      else if (type === 'homework') { items = HOMEWORKS; persistFn = persistHomeworks; name = 'домашку'; }
      else return;

      window.showConfirmModal(`Удалить ${name}?`, 'Это действие нельзя отменить.', async () => {
        const idx = items.findIndex(t => t.id === id);
        if (idx !== -1) {
          items.splice(idx, 1);
          await persistFn();
          render();
        }
      });
    }

    window.copyItem = function(type, id) {
      let item, items, persistFn;
      if (type === 'trainer') { item = TRAINERS.find(t => t.id === id); items = TRAINERS; persistFn = persistTrainers; }
      else if (type === 'lesson') { item = LESSONS.find(l => l.id === id); items = LESSONS; persistFn = persistLessons; }
      else if (type === 'homework') { item = HOMEWORKS.find(h => h.id === id); items = HOMEWORKS; persistFn = persistHomeworks; }
      else return;

      if (!item) return;

      const newItem = JSON.parse(JSON.stringify(item));
      newItem.id = type + '_' + Date.now() + '_copy';
      newItem.title = item.title + ' (копия)';
      newItem.isLocked = false;
      newItem.isDraft = false;
      newItem.scheduledRelease = null;
      newItem.assignedTo = [];

      const siblings = items.filter(t => t.topicId === item.topicId);
      const maxOrder = siblings.length ? Math.max(...siblings.map(t => t.order)) : -1;
      newItem.order = maxOrder + 1;

      items.push(newItem);
      persistFn().then(() => render());
    };

    // ============================================================
    // 22. RENDER TRAINER (С РЕЖИМОМ "КАРТЫ" — ОТВЕТ В СТРОКЕ)
    // ============================================================

    async function renderTrainer(container, trainerId) {
      const trainer = TRAINERS.find(t => t.id === trainerId);
      if (!trainer) { VIEW = { name: 'home' }; render(); return; }

      const isRealStudent = !CURRENT_USER.isTeacher;
      let progress = isRealStudent ? await getProgress(CURRENT_USER.key) : {};
      if (!progress[trainerId]) progress[trainerId] = {};
      const trainerProgress = progress[trainerId];

      const mode = trainer.mode || 'step';
      const taskType = trainer.taskType || 'text';

      const wrap = document.createElement('div');

      const backRow = document.createElement('div');
      backRow.className = 'back-row';
      backRow.innerHTML = `<button class="back-btn">← Назад к содержанию</button>`;
      backRow.querySelector('.back-btn').onclick = window.goHome;
      wrap.appendChild(backRow);

      const head = document.createElement('div');
      head.className = 'trainer-head';
      head.innerHTML = `
        <h2>${escapeHtml(trainer.title)}</h2>
        <div class="trainer-note">
          ${trainer.customNote ? `${escapeHtmlMultiline(trainer.customNote)}` : ''}
          ${!isRealStudent ? ' <br><b>Режим просмотра:</b> ответы не сохраняются.' : ''}
        </div>
      `;
      wrap.appendChild(head);

      const modeSelector = document.createElement('div');
      modeSelector.className = 'trainer-mode-selector';
      modeSelector.innerHTML = `
        <button class="btn btn-sm ${mode === 'step' ? 'active' : ''}" id="modeStep">Пошагово</button>
        <button class="btn btn-sm ${mode === 'list' ? 'active' : ''}" id="modeList">Список</button>
        <button class="btn btn-sm ${mode === 'cards' ? 'active' : ''}" id="modeCards">Карты</button>
      `;
      if (isManaging()) {
        modeSelector.querySelector('#modeStep').onclick = () => {
          trainer.mode = 'step';
          persistTrainers().then(() => { renderTrainer(container, trainerId); });
        };
        modeSelector.querySelector('#modeList').onclick = () => {
          trainer.mode = 'list';
          persistTrainers().then(() => { renderTrainer(container, trainerId); });
        };
        modeSelector.querySelector('#modeCards').onclick = () => {
          trainer.mode = 'cards';
          persistTrainers().then(() => { renderTrainer(container, trainerId); });
        };
      } else {
        modeSelector.style.display = 'none';
      }
      wrap.appendChild(modeSelector);

      const content = document.createElement('div');
      wrap.appendChild(content);

      const footer = document.createElement('div');
      footer.className = 'trainer-footer';
      wrap.appendChild(footer);

      container.appendChild(wrap);

      if (mode === 'step') {
        renderStepMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
      } else if (mode === 'list') {
        renderListMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
      } else if (mode === 'cards') {
        renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
      } else {
        renderStepMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
      }
    }

    // ============================================================
    // 23. ПОШАГОВЫЙ РЕЖИМ
    // ============================================================

    function renderStepMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType) {
      const reactions = trainer.reactions || [];
      const total = reactions.length;

      let currentIndex = trainerProgress.currentIndex || 0;
      let statuses = trainerProgress.statuses || Array(total).fill('unanswered');
      let answers = trainerProgress.answers || Array(total).fill('');
      let round = trainerProgress.round || 1;

      function saveState() {
        if (isRealStudent) {
          trainerProgress.currentIndex = currentIndex;
          trainerProgress.statuses = statuses;
          trainerProgress.answers = answers;
          trainerProgress.round = round;
          persistFullProgress(CURRENT_USER.key, progress);
        }
      }

      function getPendingIndices() {
        return statuses.map((s, i) => ({ s, i }))
          .filter(({ s }) => s === 'wrong' || s === 'skipped')
          .map(({ i }) => i);
      }

      function getMainProgress() {
        const done = statuses.filter(s => s === 'correct').length;
        return { done, total };
      }

      function getRoundProgress() {
        const pending = getPendingIndices();
        const done = pending.filter(i => statuses[i] === 'correct').length;
        return { done, total: pending.length };
      }

      function isAllCorrect() {
        return statuses.every(s => s === 'correct');
      }

      function getAvailableIndices() {
        if (round === 1) {
          return Array.from({ length: total }, (_, i) => i);
        } else {
          return getPendingIndices();
        }
      }

      function goToNextAvailable() {
        if (round === 1) {
          if (currentIndex < total - 1) {
            currentIndex = currentIndex + 1;
            saveState();
            renderStep();
            return;
          }
          const pending = getPendingIndices();
          if (pending.length > 0) {
            round = 2;
            currentIndex = pending[0];
          }
          saveState();
          renderStep();
          return;
        } else {
          const pending = getPendingIndices();
          if (pending.length === 0) {
            saveState();
            renderStep();
            return;
          }
          const nextIdx = pending.find(i => i > currentIndex);
          currentIndex = nextIdx !== undefined ? nextIdx : pending[0];
          saveState();
          renderStep();
        }
      }

      function renderStep() {
        content.innerHTML = '';

        const progDiv = document.createElement('div');
        progDiv.className = 'progress-rounds';

        const mainProg = getMainProgress();
        const roundProg = getRoundProgress();

        const mainRound = document.createElement('div');
        mainRound.className = 'progress-round';
        mainRound.innerHTML = `
          <div class="label">Основной раунд</div>
          <div class="bar"><div class="fill" style="width:${total ? Math.round(mainProg.done/total*100) : 0}%"></div></div>
          <div class="count">${mainProg.done}/${total}</div>
        `;
        progDiv.appendChild(mainRound);

        const pending = getPendingIndices();
        if (pending.length > 0) {
          const roundDiv = document.createElement('div');
          roundDiv.className = 'progress-round';
          roundDiv.innerHTML = `
            <div class="label">Доработка</div>
            <div class="bar"><div class="fill ${roundProg.done === roundProg.total && roundProg.total > 0 ? 'done' : ''}" style="width:${roundProg.total ? Math.round(roundProg.done/roundProg.total*100) : 0}%"></div></div>
            <div class="count">${roundProg.done}/${roundProg.total}</div>
          `;
          progDiv.appendChild(roundDiv);
        }

        const stats = document.createElement('div');
        stats.className = 'trainer-summary';
        const correct = statuses.filter(s => s === 'correct').length;
        const wrong = statuses.filter(s => s === 'wrong').length;
        const skipped = statuses.filter(s => s === 'skipped').length;
        stats.innerHTML = `
          Правильно: ${correct} · Неправильно: ${wrong} · Пропущено: ${skipped}
          ${pending.length > 0 ? `· Доработка: ${pending.length} осталось` : ''}
        `;
        progDiv.appendChild(stats);
        content.appendChild(progDiv);

        if (isAllCorrect()) {
          const finishDiv = document.createElement('div');
          finishDiv.className = 'rxn-step';
          finishDiv.innerHTML = `
            <div style="text-align:center;padding:20px 0;">
              <div style="width:48px;height:48px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;">✓</div>
              <h3 style="margin:0 0 8px;">Все реакции решены правильно</h3>
              <p style="color:var(--ink-soft);">Отличная работа</p>
              <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                <button class="btn btn-accent" id="finishTrainerBtn">Закончить тренажёр</button>
                <button class="btn btn-ghost" id="restartTrainerBtn">Пройти заново</button>
              </div>
            </div>
          `;
          content.appendChild(finishDiv);

          finishDiv.querySelector('#finishTrainerBtn').onclick = () => {
            showCompletionView(content, trainer, trainerProgress, isRealStudent, progress);
          };
          finishDiv.querySelector('#restartTrainerBtn').onclick = () => {
            window.showConfirmModal(
              'Начать заново?',
              'Весь прогресс по этому тренажёру будет сброшен.',
              async () => {
                trainerProgress.statuses = Array(total).fill('unanswered');
                trainerProgress.answers = Array(total).fill('');
                trainerProgress.currentIndex = 0;
                trainerProgress.round = 1;
                trainerProgress.__finished = false;
                statuses = trainerProgress.statuses;
                answers = trainerProgress.answers;
                currentIndex = 0;
                round = 1;
                saveState();
                renderStep();
              },
              'Начать заново',
              'btn-accent'
            );
          };

          footer.innerHTML = '';
          const finishBtn = document.createElement('button');
          finishBtn.className = 'btn btn-accent';
          finishBtn.textContent = 'Закончить тренажёр';
          finishBtn.onclick = () => {
            showCompletionView(content, trainer, trainerProgress, isRealStudent, progress);
          };
          footer.appendChild(finishBtn);
          return;
        }

        const avail = getAvailableIndices();
        if (avail.length === 0) {
          renderStep();
          return;
        }

        if (!avail.includes(currentIndex)) {
          currentIndex = avail[0];
          saveState();
        }

        const rxn = reactions[currentIndex];
        const entry = {
          status: statuses[currentIndex],
          answer: answers[currentIndex] || ''
        };

        const card = document.createElement('div');
        card.className = 'rxn-step';

        const eqHtml = renderEquation(rxn.lhs);
        const isCorrect = entry.status === 'correct';
        const isWrong = entry.status === 'wrong';

        let inputHtml = '';
        if (taskType === 'text') {
          inputHtml = `
            <div class="rxn-input-row">
              <input type="text" class="rxn-input ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}" 
                     placeholder="Введите ответ" value="${escapeHtml(entry.answer || '')}" 
                     id="stepInput" ${isCorrect ? 'disabled' : ''}>
            </div>
          `;
        } else if (taskType === 'radio') {
          const options = rxn.options || ['Вариант 1', 'Вариант 2', 'Вариант 3'];
          inputHtml = `
            <div class="options-group" id="stepOptions">
              ${options.map((opt, oi) => `
                <label>
                  <input type="radio" name="stepRadio" value="${escapeHtml(opt)}" ${entry.answer === opt && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}>
                  ${escapeHtml(opt)}
                </label>
              `).join('')}
            </div>
          `;
        } else if (taskType === 'checkbox') {
          const options = rxn.options || ['Вариант 1', 'Вариант 2', 'Вариант 3'];
          const selected = entry.answer ? entry.answer.split(',,') : [];
          inputHtml = `
            <div class="options-group" id="stepOptions">
              ${options.map((opt, oi) => `
                <label>
                  <input type="checkbox" name="stepCheckbox" value="${escapeHtml(opt)}" ${selected.includes(opt) && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}>
                  ${escapeHtml(opt)}
                </label>
              `).join('')}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="rxn-num">Реакция ${currentIndex+1} ${round === 2 ? '· Доработка' : ''}</div>
          <div class="rxn-eq eqx">${eqHtml}</div>
          ${inputHtml}
          <div class="rxn-actions">
            <button class="btn btn-sm btn-accent" id="stepCheck" ${isCorrect ? 'disabled' : ''}>Проверить</button>
            <button class="btn btn-sm btn-ghost" id="stepRetry">Повторить</button>
            <button class="btn btn-sm btn-ghost" id="stepSkip" ${round === 2 ? 'disabled' : ''}>Пропустить</button>
          </div>
          <div class="feedback-slot"></div>
          <div class="step-nav">
            <span class="nav-info">${avail.indexOf(currentIndex) + 1} / ${avail.length}</span>
          </div>
        `;

        const input = card.querySelector('#stepInput') || card.querySelector('#stepOptions');
        const checkBtn = card.querySelector('#stepCheck');
        const retryBtn = card.querySelector('#stepRetry');
        const skipBtn = card.querySelector('#stepSkip');
        const fbSlot = card.querySelector('.feedback-slot');

        const prevBtn = document.createElement('button');
        prevBtn.className = 'flank-btn';
        prevBtn.id = 'stepPrev';
        prevBtn.type = 'button';
        prevBtn.textContent = '◀';

        const nextBtn = document.createElement('button');
        nextBtn.className = 'flank-btn';
        nextBtn.id = 'stepNext';
        nextBtn.type = 'button';
        nextBtn.textContent = '▶';

        function getInputValue() {
          if (taskType === 'text') {
            return card.querySelector('#stepInput')?.value?.trim() || '';
          } else if (taskType === 'radio') {
            const checked = card.querySelector('input[name="stepRadio"]:checked');
            return checked ? checked.value : '';
          } else if (taskType === 'checkbox') {
            const checked = card.querySelectorAll('input[name="stepCheckbox"]:checked');
            return Array.from(checked).map(el => el.value).join(',');
          }
          return '';
        }

        function disableInputs(disabled) {
          if (taskType === 'text') {
            const inp = card.querySelector('#stepInput');
            if (inp) inp.disabled = disabled;
          } else {
            const inputs = card.querySelectorAll('input');
            inputs.forEach(inp => inp.disabled = disabled);
          }
        }

        function showFeedback(isCorrectVal) {
          fbSlot.innerHTML = '';
          const fb = document.createElement('div');
          fb.className = 'rxn-feedback ' + (isCorrectVal ? 'ok' : 'bad');
          fb.textContent = isCorrectVal ? 'Верно!' : 'Неверно. Попробуй ещё раз.';
          fbSlot.appendChild(fb);
          if (taskType === 'text') {
            const inp = card.querySelector('#stepInput');
            if (inp) {
              inp.className = 'rxn-input ' + (isCorrectVal ? 'correct' : 'wrong');
            }
          }
        }

        if (isCorrect) {
          showFeedback(true);
        }

        checkBtn.onclick = () => {
          if (isCorrect) return;
          const val = getInputValue();
          if (!val) { alert('Введите ответ'); return; }

          const isCorrectAnswer = checkAnswer(rxn, val, taskType);

          if (isCorrectAnswer) {
            statuses[currentIndex] = 'correct';
            answers[currentIndex] = val;
            disableInputs(true);
            checkBtn.disabled = true;
            showFeedback(true);
          } else {
            statuses[currentIndex] = 'wrong';
            answers[currentIndex] = val;
            showFeedback(false);
          }
          saveState();
          updateNav();
        };

        retryBtn.onclick = () => {
          statuses[currentIndex] = 'unanswered';
          disableInputs(false);
          checkBtn.disabled = false;
          fbSlot.innerHTML = '';
          if (taskType === 'text') {
            const inp = card.querySelector('#stepInput');
            if (inp) inp.className = 'rxn-input';
          }
          saveState();
          updateNav();
        };

        skipBtn.onclick = () => {
          if (round === 2) return;
          statuses[currentIndex] = 'skipped';
          answers[currentIndex] = getInputValue() || '';
          saveState();
          goToNextAvailable();
        };

        function updateNav() {
          const availNow = getAvailableIndices();
          const currIdx = availNow.indexOf(currentIndex);
          const navInfo = card.querySelector('.nav-info');
          if (navInfo) {
            navInfo.textContent = currIdx === -1
              ? `${availNow.length} / ${availNow.length || total}`
              : `${currIdx + 1} / ${availNow.length}`;
          }
          if (prevBtn) prevBtn.disabled = currIdx <= 0;
          if (nextBtn) nextBtn.disabled = false;
        }

        prevBtn.onclick = () => {
          const availNow = getAvailableIndices();
          const currIdx = availNow.indexOf(currentIndex);
          if (currIdx > 0) {
            currentIndex = availNow[currIdx - 1];
            saveState();
            renderStep();
          }
        };

        nextBtn.onclick = () => {
          goToNextAvailable();
        };

        const navRow = card.querySelector('.step-nav');
        const navInfoEl = navRow.querySelector('.nav-info');
        navRow.insertBefore(prevBtn, navInfoEl);
        navRow.appendChild(nextBtn);
        content.appendChild(card);
        updateNav();

        footer.innerHTML = '';
        const totalBtn = document.createElement('button');
        totalBtn.className = 'btn btn-ghost btn-sm';
        totalBtn.textContent = 'Показать все реакции';
        totalBtn.onclick = () => {
          const list = document.createElement('div');
          list.style.cssText = 'margin-top:16px;max-height:400px;overflow-y:auto;';
          reactions.forEach((r, i) => {
            const row = document.createElement('div');
            row.style.cssText = 'padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;';
            const statusMap = {
              'correct': '<span style="color:var(--ok);font-weight:700;">Верно</span>',
              'wrong': '<span style="color:var(--bad);font-weight:700;">Неверно</span>',
              'skipped': '<span style="color:var(--ink-soft);">Пропущено</span>',
              'unanswered': '<span style="color:var(--ink-soft);">Без ответа</span>'
            };
            row.innerHTML = `
              <span>${i+1}. ${escapeHtml(r.lhs)}</span>
              <span style="font-size:12px;">${statusMap[statuses[i]] || statusMap['unanswered']} ${answers[i] ? escapeHtml(answers[i]) : ''}</span>
            `;
            list.appendChild(row);
          });
          const modalBg = document.createElement('div');
          modalBg.className = 'modal-bg';
          const modal = document.createElement('div');
          modal.className = 'modal';
          modal.innerHTML = `
            <h3>Все реакции</h3>
            <div style="max-height:400px;overflow-y:auto;"></div>
            <div class="actions"><button class="btn btn-ghost" onclick="this.closest('.modal-bg').remove()">Закрыть</button></div>
          `;
          modal.querySelector('div').appendChild(list);
          modalBg.appendChild(modal);
          document.body.appendChild(modalBg);
          modalBg.onclick = (e) => { if (e.target === modalBg) modalBg.remove(); };
        };
        footer.appendChild(totalBtn);
      }

      if (trainerProgress.__finished) {
        showCompletionView(content, trainer, trainerProgress, isRealStudent, progress);
      } else {
        renderStep();
      }
    }

    // ============================================================
    // 24. РЕЖИМ СПИСКА
    // ============================================================

    function renderListMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType) {
      const reactions = trainer.reactions || [];
      const total = reactions.length;

      let statuses = trainerProgress.statuses || Array(total).fill('unanswered');
      let answers = trainerProgress.answers || Array(total).fill('');

      function saveState() {
        if (isRealStudent) {
          trainerProgress.statuses = statuses;
          trainerProgress.answers = answers;
          persistFullProgress(CURRENT_USER.key, progress);
        }
      }

      const list = document.createElement('div');
      list.className = 'rxn-list';
      content.appendChild(list);

      function renderList() {
        list.innerHTML = '';
        let correctCount = 0;
        reactions.forEach((rxn, idx) => {
          const entry = {
            status: statuses[idx] || 'unanswered',
            answer: answers[idx] || ''
          };
          const isCorrect = entry.status === 'correct';
          const isWrong = entry.status === 'wrong';

          const card = document.createElement('div');
          card.className = 'rxn-card' + (isCorrect ? ' state-correct' : isWrong ? ' state-wrong' : '');
          const eqHtml = renderEquation(rxn.lhs);

          let inputHtml = '';
          if (taskType === 'text') {
            inputHtml = `
              <div class="rxn-input-row">
                <input type="text" class="rxn-input ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}" 
                       placeholder="Введите ответ" value="${escapeHtml(entry.answer || '')}" 
                       data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>
                <button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button>
                <button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button>
              </div>
            `;
          } else if (taskType === 'radio') {
            const options = rxn.options || ['Вариант 1', 'Вариант 2', 'Вариант 3'];
            inputHtml = `
              <div class="options-group" data-idx="${idx}">
                ${options.map((opt, oi) => `
                  <label>
                    <input type="radio" name="radio_${idx}" value="${escapeHtml(opt)}" ${entry.answer === opt && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}>
                    ${escapeHtml(opt)}
                  </label>
                `).join('')}
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button>
                <button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button>
              </div>
            `;
          } else if (taskType === 'checkbox') {
            const options = rxn.options || ['Вариант 1', 'Вариант 2', 'Вариант 3'];
            const selected = entry.answer ? entry.answer.split(',') : [];
            inputHtml = `
              <div class="options-group" data-idx="${idx}">
                ${options.map((opt, oi) => `
                  <label>
                    <input type="checkbox" name="check_${idx}" value="${escapeHtml(opt)}" ${selected.includes(opt) && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}>
                    ${escapeHtml(opt)}
                  </label>
                `).join('')}
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button>
                <button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="rxn-num">Реакция ${idx+1}</div>
            <div class="rxn-eq eqx">${eqHtml}</div>
            ${inputHtml}
            <div class="feedback-slot"></div>
          `;

          const fbSlot = card.querySelector('.feedback-slot');
          if (entry.status === 'correct') {
            const fb = document.createElement('div');
            fb.className = 'rxn-feedback ok';
            fb.textContent = 'Верно!';
            fbSlot.appendChild(fb);
            correctCount++;
          } else if (entry.status === 'wrong') {
            const fb = document.createElement('div');
            fb.className = 'rxn-feedback bad';
            fb.textContent = 'Неверно. Попробуй ещё раз.';
            fbSlot.appendChild(fb);
          }

          const checkBtn = card.querySelector('.check-btn');
          if (checkBtn) {
            checkBtn.onclick = () => {
              let val = '';
              if (taskType === 'text') {
                const input = card.querySelector('.rxn-input');
                val = input.value.trim();
                if (!val) { alert('Введите ответ'); return; }
                const isCorrectAnswer = checkAnswer(rxn, val, taskType);
                if (isCorrectAnswer) {
                  statuses[idx] = 'correct';
                  answers[idx] = val;
                  input.className = 'rxn-input correct';
                  input.disabled = true;
                  checkBtn.disabled = true;
                  fbSlot.innerHTML = '';
                  const fb = document.createElement('div');
                  fb.className = 'rxn-feedback ok';
                  fb.textContent = 'Верно!';
                  fbSlot.appendChild(fb);
                  card.className = 'rxn-card state-correct';
                } else {
                  statuses[idx] = 'wrong';
                  answers[idx] = val;
                  input.className = 'rxn-input wrong';
                  fbSlot.innerHTML = '';
                  const fb = document.createElement('div');
                  fb.className = 'rxn-feedback bad';
                  fb.textContent = 'Неверно. Попробуй ещё раз.';
                  fbSlot.appendChild(fb);
                  card.className = 'rxn-card state-wrong';
                }
              } else if (taskType === 'radio') {
                const checked = card.querySelector(`input[name="radio_${idx}"]:checked`);
                if (!checked) { alert('Выберите вариант'); return; }
                val = checked.value;
                const isCorrectAnswer = checkAnswer(rxn, val, taskType);
                if (isCorrectAnswer) {
                  statuses[idx] = 'correct';
                  answers[idx] = val;
                  card.querySelectorAll(`input[name="radio_${idx}"]`).forEach(inp => inp.disabled = true);
                  checkBtn.disabled = true;
                  fbSlot.innerHTML = '';
                  const fb = document.createElement('div');
                  fb.className = 'rxn-feedback ok';
                  fb.textContent = 'Верно!';
                  fbSlot.appendChild(fb);
                  card.className = 'rxn-card state-correct';
                } else {
                  statuses[idx] = 'wrong';
                  answers[idx] = val;
                  fbSlot.innerHTML = '';
                  const fb = document.createElement('div');
                  fb.className = 'rxn-feedback bad';
                  fb.textContent = 'Неверно. Попробуй ещё раз.';
                  fbSlot.appendChild(fb);
                  card.className = 'rxn-card state-wrong';
                }
              } else if (taskType === 'checkbox') {
                const checked = card.querySelectorAll(`input[name="check_${idx}"]:checked`);
                if (checked.length === 0) { alert('Выберите хотя бы один вариант'); return; }
                val = Array.from(checked).map(el => el.value).join(',');
                const isCorrectAnswer = checkAnswer(rxn, val, taskType);
                if (isCorrectAnswer) {
                  statuses[idx] = 'correct';
                  answers[idx] = val;
                  card.querySelectorAll(`input[name="check_${idx}"]`).forEach(inp => inp.disabled = true);
                  checkBtn.disabled = true;
                  fbSlot.innerHTML = '';
                  const fb = document.createElement('div');
                  fb.className = 'rxn-feedback ok';
                  fb.textContent = 'Верно!';
                  fbSlot.appendChild(fb);
                  card.className = 'rxn-card state-correct';
                } else {
                  statuses[idx] = 'wrong';
                  answers[idx] = val;
                  fbSlot.innerHTML = '';
                  const fb = document.createElement('div');
                  fb.className = 'rxn-feedback bad';
                  fb.textContent = 'Неверно. Попробуй ещё раз.';
                  fbSlot.appendChild(fb);
                  card.className = 'rxn-card state-wrong';
                }
              }
              saveState();
              updateStats();
            };
          }

          const retryBtn = card.querySelector('.retry-btn');
          if (retryBtn) {
            retryBtn.onclick = () => {
              statuses[idx] = 'unanswered';
              if (taskType === 'text') {
                const input = card.querySelector('.rxn-input');
                input.className = 'rxn-input';
                input.disabled = false;
                checkBtn.disabled = false;
              } else {
                card.querySelectorAll('input').forEach(inp => inp.disabled = false);
                checkBtn.disabled = false;
              }
              fbSlot.innerHTML = '';
              card.className = 'rxn-card';
              saveState();
              updateStats();
            };
          }

          list.appendChild(card);
        });
      }

      function updateStats() {
        const correct = statuses.filter(s => s === 'correct').length;
        const wrong = statuses.filter(s => s === 'wrong').length;
        const unanswered = statuses.filter(s => s === 'unanswered' || !s).length;

        const stats = document.createElement('div');
        stats.className = 'trainer-summary';
        stats.innerHTML = `
          Правильно: ${correct} · Неправильно: ${wrong} · Осталось: ${unanswered}
        `;

        const oldStats = footer.querySelector('.trainer-summary');
        if (oldStats) oldStats.remove();
        footer.prepend(stats);
      }

      if (trainerProgress.__finished) {
        showCompletionView(content, trainer, trainerProgress, isRealStudent, progress);
        return;
      }

      renderList();
      updateStats();

      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-accent';
      finishBtn.textContent = 'Закончить тренажёр';
      finishBtn.onclick = () => {
        const correct = statuses.filter(s => s === 'correct').length;
        if (correct === total) {
          showCompletionView(content, trainer, trainerProgress, isRealStudent, progress);
        } else {
          alert(`Вы ответили правильно на ${correct} из ${total} реакций. Доработайте остальные!`);
        }
      };
      footer.appendChild(finishBtn);

      const resetBtn = document.createElement('button');
      resetBtn.className = 'btn btn-ghost btn-sm';
      resetBtn.textContent = 'Сбросить все ответы';
      resetBtn.onclick = () => {
        window.showConfirmModal(
          'Начать заново?',
          'Весь прогресс по этому тренажёру будет сброшен.',
          async () => {
            statuses = Array(total).fill('unanswered');
            answers = Array(total).fill('');
            trainerProgress.statuses = statuses;
            trainerProgress.answers = answers;
            trainerProgress.__finished = false;
            saveState();
            renderList();
            updateStats();
          },
          'Начать заново',
          'btn-accent'
        );
      };
      footer.appendChild(resetBtn);
    }

    // ============================================================
    // 25. РЕЖИМ "КАРТЫ" — ОТВЕТ В СТРОКЕ РЕАКЦИИ
    // ============================================================

    function renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType) {
      const reactions = trainer.reactions || [];
      const total = reactions.length;

      if (total === 0) {
        content.innerHTML = `<div class="empty-note">В этом тренажёре нет реакций.</div>`;
        return;
      }

      let currentIndex = 0;
      let showAnswer = false;

      function renderCard() {
        content.innerHTML = '';

        const rxn = reactions[currentIndex];
        const lhs = rxn.lhs || '';
        
        // Формируем полный ответ
        let fullAnswer = '';
        let isInvalid = false;
        if (rxn.valid && rxn.correctSets && rxn.correctSets.length > 0) {
          const displaySets = (rxn.correctSetsDisplay && rxn.correctSetsDisplay.length > 0) 
            ? rxn.correctSetsDisplay 
            : rxn.correctSets;
          if (taskType === 'checkbox') {
            fullAnswer = (displaySets[0] || []).join(', ');
          } else {
            fullAnswer = (displaySets[0] || []).join(' + ');
            if (displaySets.length > 1) {
              fullAnswer = displaySets.map(set => set.join(' + ')).join(' / ');
            }
          }
        } else if (!rxn.valid) {
          fullAnswer = '0 (не идёт)';
          isInvalid = true;
        } else {
          fullAnswer = 'Нет правильного ответа';
        }

        // Показываем реакцию так, как её написал учитель — без
        // автоматической подстановки стрелочки (учитель ставит её сам
        // в тексте задания, если хочет).
        const fullReaction = lhs + ' ' + fullAnswer;
        const displayLhs = renderEquation(lhs);
        const displayFull = renderEquation(fullReaction);

        const card = document.createElement('div');
        card.className = 'flash-card';

        card.innerHTML = `
          <div class="card-number">${currentIndex + 1} / ${total}</div>
          <div class="card-question eqx">
            ${showAnswer ? displayFull : displayLhs}
          </div>
          <div class="card-actions">
            <button class="btn btn-accent" id="showAnswerBtn">${showAnswer ? 'Скрыть ответ' : 'Показать ответ'}</button>
          </div>
          <div class="card-nav">
            <button class="nav-btn" id="prevCardBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
            <span class="nav-info">${currentIndex + 1} / ${total}</span>
            <button class="nav-btn" id="nextCardBtn" ${currentIndex === total - 1 ? 'disabled' : ''}>Вперёд ▶</button>
          </div>
          ${showAnswer && rxn.explanation ? `<div style="margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center;padding:8px 16px;border-top:1px solid var(--line);">${escapeHtml(rxn.explanation)}</div>` : ''}
          ${showAnswer && rxn.fullEquation ? `<div style="margin-top:4px;font-size:14px;font-weight:600;text-align:center;color:var(--ok);">${renderEquation(rxn.fullEquation)}</div>` : ''}
        `;

        content.appendChild(card);

        card.querySelector('#showAnswerBtn').onclick = () => {
          showAnswer = !showAnswer;
          renderCard();
        };

        card.querySelector('#prevCardBtn').onclick = () => {
          if (currentIndex > 0) {
            currentIndex--;
            showAnswer = false;
            renderCard();
          }
        };

        card.querySelector('#nextCardBtn').onclick = () => {
          if (currentIndex < total - 1) {
            currentIndex++;
            showAnswer = false;
            renderCard();
          }
        };

        document.addEventListener('keydown', function handler(e) {
          if (e.key === 'ArrowLeft' && currentIndex > 0) {
            currentIndex--;
            showAnswer = false;
            renderCard();
          } else if (e.key === 'ArrowRight' && currentIndex < total - 1) {
            currentIndex++;
            showAnswer = false;
            renderCard();
          } else if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            showAnswer = !showAnswer;
            renderCard();
          }
          document.removeEventListener('keydown', handler);
        });

        footer.innerHTML = '';
        const backToHome = document.createElement('button');
        backToHome.className = 'btn btn-ghost btn-sm';
        backToHome.textContent = '← К содержанию';
        backToHome.onclick = window.goHome;
        footer.appendChild(backToHome);
      }

      renderCard();
    }

    // ============================================================
    // 26. ЗАВЕРШЕНИЕ ТРЕНАЖЁРА
    // ============================================================

    function showCompletionView(container, trainer, trainerProgress, isRealStudent, progress) {
      const reactions = trainer.reactions || [];
      const total = reactions.length;
      const statuses = trainerProgress.statuses || Array(total).fill('unanswered');
      const answers = trainerProgress.answers || Array(total).fill('');

      if (isRealStudent) {
        trainerProgress.__finished = true;
        persistFullProgress(CURRENT_USER.key, progress);
        window.__cachedProgress = progress;
      }

      container.innerHTML = '';

      const title = document.createElement('h3');
      title.textContent = 'Результаты тренажёра';
      title.style.cssText = 'margin:0 0 20px;font-size:20px;';
      container.appendChild(title);

      const stats = document.createElement('div');
      stats.style.cssText = 'margin-bottom:20px;padding:16px;background:var(--bg);border-radius:12px;text-align:center;font-size:15px;font-weight:600;';
      stats.textContent = `Тренажёр пройден на 100%`;
      container.appendChild(stats);

      const list = document.createElement('div');
      list.style.cssText = 'display:flex;flex-direction:column;gap:12px;margin-bottom:20px;';

      reactions.forEach((rxn, idx) => {
        const status = statuses[idx] || 'unanswered';
        const answer = answers[idx] || '';
        const isCorrect = status === 'correct';

        const card = document.createElement('div');
        card.style.cssText = `
          padding:16px 20px; border-radius:12px; border:1px solid var(--line);
          background: ${isCorrect ? 'var(--ok-bg)' : status === 'wrong' ? 'var(--bad-bg)' : 'var(--bg)'};
        `;

        const eqHtml = renderEquation(rxn.lhs);
        const fullEqHtml = rxn.fullEquation ? renderEquation(rxn.fullEquation) : '';

        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:600;font-size:15px;">${eqHtml}</div>
              <div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">
                ${isCorrect ? 'Верно' : status === 'wrong' ? 'Неверно' : status === 'skipped' ? 'Пропущено' : 'Без ответа'}
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:13px;color:var(--ok);font-weight:600;">Правильный ответ: ${escapeHtml(rxn.valid ? ((rxn.correctSetsDisplay && rxn.correctSetsDisplay[0]) || rxn.correctSets[0] || []).join(trainer.taskType === 'checkbox' ? ', ' : ' + ') : 'Реакция не идёт')}</div>
              ${answer ? `<div style="font-size:12px;color:var(--ink-soft);">Ваш ответ: ${escapeHtml(answer)}</div>` : ''}
            </div>
          </div>
          ${rxn.explanation ? `<div style="margin-top:8px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;">${escapeHtml(rxn.explanation)}</div>` : ''}
          ${fullEqHtml ? `<div style="margin-top:4px;font-size:14px;font-weight:600;">${fullEqHtml}</div>` : ''}
        `;
        list.appendChild(card);
      });

      container.appendChild(list);

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;';

      const backBtn = document.createElement('button');
      backBtn.className = 'btn btn-ghost';
      backBtn.textContent = '← Назад к содержанию';
      backBtn.onclick = window.goHome;

      const restartBtn = document.createElement('button');
      restartBtn.className = 'btn btn-primary';
      restartBtn.textContent = 'Пройти заново';
      restartBtn.onclick = () => {
        window.showConfirmModal(
          'Начать заново?',
          'Весь прогресс по этому тренажёру будет сброшен.',
          async () => {
            const total = (trainer.reactions || []).length;
            trainerProgress.statuses = Array(total).fill('unanswered');
            trainerProgress.answers = Array(total).fill('');
            trainerProgress.currentIndex = 0;
            trainerProgress.round = 1;
            trainerProgress.__finished = false;
            if (isRealStudent) {
              await persistFullProgress(CURRENT_USER.key, progress);
              window.__cachedProgress = progress;
            }
            VIEW = { name: 'trainer', trainerId: trainer.id };
            render();
          },
          'Начать заново',
          'btn-accent'
        );
      };

      btnRow.appendChild(backBtn);
      btnRow.appendChild(restartBtn);
      container.appendChild(btnRow);
    }

    // ============================================================
    // 27. ДОМАШКИ (С РЕЖИМОМ "КАРТЫ" — ОТВЕТ В СТРОКЕ)
    // ============================================================

    async function renderHomework(container, homeworkId) {
      const homework = HOMEWORKS.find(h => h.id === homeworkId);
      if (!homework) { VIEW = { name: 'home' }; render(); return; }

      const isRealStudent = !CURRENT_USER.isTeacher;
      let progress = isRealStudent ? await getProgress(CURRENT_USER.key) : {};
      if (!progress[homeworkId]) progress[homeworkId] = {};
      const hwProgress = progress[homeworkId];

      const wrap = document.createElement('div');

      const backRow = document.createElement('div');
      backRow.className = 'back-row';
      backRow.innerHTML = `<button class="back-btn">← Назад к содержанию</button>`;
      backRow.querySelector('.back-btn').onclick = window.goHome;
      wrap.appendChild(backRow);

      const head = document.createElement('div');
      head.className = 'trainer-head';
      const hwNoteParts = [];
      if (homework.customNote) hwNoteParts.push(escapeHtmlMultiline(homework.customNote));
      if (!isRealStudent) hwNoteParts.push('<b>Режим просмотра:</b> ответы не сохраняются.');
      head.innerHTML = `
        <h2>${escapeHtml(homework.title)}</h2>
        ${hwNoteParts.length ? `<div class="trainer-note">${hwNoteParts.join('<br>')}</div>` : ''}
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button class="btn btn-sm btn-ghost" id="hwModeList">📋 Список</button>
          <button class="btn btn-sm btn-ghost" id="hwModeCards">🃏 Карты</button>
        </div>
      `;
      wrap.appendChild(head);

      const content = document.createElement('div');
      wrap.appendChild(content);

      const footer = document.createElement('div');
      footer.className = 'trainer-footer';
      wrap.appendChild(footer);

      container.appendChild(wrap);

      const tasks = homework.tasks || [];
      let statuses = hwProgress.statuses || Array(tasks.length).fill('unanswered');
      let answers = hwProgress.answers || Array(tasks.length).fill('');
      let hwMode = hwProgress.mode || 'list';

      function saveState() {
        if (isRealStudent) {
          hwProgress.statuses = statuses;
          hwProgress.answers = answers;
          hwProgress.mode = hwMode;
          persistFullProgress(CURRENT_USER.key, progress);
        }
      }

      function renderList() {
        content.innerHTML = '';
        if (tasks.length === 0) {
          content.innerHTML = `<div class="empty-note">В этой домашке пока нет заданий.</div>`;
          return;
        }

        let correctCount = 0;
        const list = document.createElement('div');
        list.className = 'rxn-list';

        tasks.forEach((task, idx) => {
          const status = statuses[idx] || 'unanswered';
          const answer = answers[idx] || '';
          const isCorrect = status === 'correct';

          const card = document.createElement('div');
          card.className = 'rxn-card' + (isCorrect ? ' state-correct' : status === 'wrong' ? ' state-wrong' : '');

          card.innerHTML = `
            <div class="rxn-num">Задание ${idx+1}</div>
            <div class="rxn-eq eqx">${escapeHtml(task.question)}</div>
            <div class="rxn-input-row">
              <input type="text" class="rxn-input ${isCorrect ? 'correct' : status === 'wrong' ? 'wrong' : ''}" 
                     placeholder="Введите ответ" value="${escapeHtml(answer)}" 
                     data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>
              <button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button>
              <button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button>
            </div>
            <div class="feedback-slot"></div>
          `;

          const fbSlot = card.querySelector('.feedback-slot');
          if (status === 'correct') {
            const fb = document.createElement('div');
            fb.className = 'rxn-feedback ok';
            fb.textContent = 'Верно!';
            fbSlot.appendChild(fb);
            correctCount++;
          } else if (status === 'wrong') {
            const fb = document.createElement('div');
            fb.className = 'rxn-feedback bad';
            fb.textContent = 'Неверно. Попробуй ещё раз.';
            fbSlot.appendChild(fb);
          }

          card.querySelector('.check-btn').onclick = () => {
            const input = card.querySelector('.rxn-input');
            const val = input.value.trim();
            if (!val) { alert('Введите ответ'); return; }
            const isCorrectAnswer = val.toLowerCase() === task.answer.toLowerCase().trim();
            if (isCorrectAnswer) {
              statuses[idx] = 'correct';
              answers[idx] = val;
              input.className = 'rxn-input correct';
              input.disabled = true;
              card.querySelector('.check-btn').disabled = true;
              fbSlot.innerHTML = '';
              const fb = document.createElement('div');
              fb.className = 'rxn-feedback ok';
              fb.textContent = 'Верно!';
              fbSlot.appendChild(fb);
              card.className = 'rxn-card state-correct';
            } else {
              statuses[idx] = 'wrong';
              answers[idx] = val;
              input.className = 'rxn-input wrong';
              fbSlot.innerHTML = '';
              const fb = document.createElement('div');
              fb.className = 'rxn-feedback bad';
              fb.textContent = 'Неверно. Попробуй ещё раз.';
              fbSlot.appendChild(fb);
              card.className = 'rxn-card state-wrong';
            }
            saveState();
            updateStats();
          };

          card.querySelector('.retry-btn').onclick = () => {
            statuses[idx] = 'unanswered';
            const input = card.querySelector('.rxn-input');
            input.className = 'rxn-input';
            input.disabled = false;
            card.querySelector('.check-btn').disabled = false;
            fbSlot.innerHTML = '';
            card.className = 'rxn-card';
            saveState();
            updateStats();
          };

          list.appendChild(card);
        });

        content.appendChild(list);
        updateStats();
      }

      function renderCards() {
        content.innerHTML = '';
        if (tasks.length === 0) {
          content.innerHTML = `<div class="empty-note">В этой домашке пока нет заданий.</div>`;
          return;
        }

        let currentIndex = hwProgress.cardsIndex || 0;
        let showAnswer = false;

        function renderCard() {
          content.innerHTML = '';

          const task = tasks[currentIndex];
          const question = task.question || '';
          const answer = task.answer || 'Нет ответа';
          // Без автоматической стрелочки — как учитель написал вопрос,
          // так и показываем, без подстановки.
          const fullReaction = question + ' ' + answer;

          const card = document.createElement('div');
          card.className = 'flash-card';

          card.innerHTML = `
            <div class="card-number">${currentIndex + 1} / ${tasks.length}</div>
            <div class="card-question eqx">
              ${showAnswer ? renderEquation(fullReaction) : renderEquation(question)}
            </div>
            ${showAnswer && task.explanation ? `<div style="margin-top:8px;font-size:13px;color:var(--ink-soft);text-align:center;padding:8px 16px;border-top:1px solid var(--line);">${escapeHtml(task.explanation)}</div>` : ''}
            <div class="card-actions">
              <button class="btn btn-accent" id="showAnswerBtn">${showAnswer ? 'Скрыть ответ' : 'Показать ответ'}</button>
            </div>
            <div class="card-nav">
              <button class="nav-btn" id="prevCardBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
              <span class="nav-info">${currentIndex + 1} / ${tasks.length}</span>
              <button class="nav-btn" id="nextCardBtn" ${currentIndex === tasks.length - 1 ? 'disabled' : ''}>Вперёд ▶</button>
            </div>
          `;

          content.appendChild(card);

          card.querySelector('#showAnswerBtn').onclick = () => {
            showAnswer = !showAnswer;
            renderCard();
          };

          card.querySelector('#prevCardBtn').onclick = () => {
            if (currentIndex > 0) {
              currentIndex--;
              showAnswer = false;
              hwProgress.cardsIndex = currentIndex;
              saveState();
              renderCard();
            }
          };

          card.querySelector('#nextCardBtn').onclick = () => {
            if (currentIndex < tasks.length - 1) {
              currentIndex++;
              showAnswer = false;
              hwProgress.cardsIndex = currentIndex;
              saveState();
              renderCard();
            }
          };

          document.addEventListener('keydown', function handler(e) {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
              currentIndex--;
              showAnswer = false;
              hwProgress.cardsIndex = currentIndex;
              saveState();
              renderCard();
            } else if (e.key === 'ArrowRight' && currentIndex < tasks.length - 1) {
              currentIndex++;
              showAnswer = false;
              hwProgress.cardsIndex = currentIndex;
              saveState();
              renderCard();
            } else if (e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              showAnswer = !showAnswer;
              renderCard();
            }
            document.removeEventListener('keydown', handler);
          });

          footer.innerHTML = '';
          const backToHome = document.createElement('button');
          backToHome.className = 'btn btn-ghost btn-sm';
          backToHome.textContent = '← К содержанию';
          backToHome.onclick = window.goHome;
          footer.appendChild(backToHome);
        }

        renderCard();
        updateStats();
      }

      function updateStats() {
        const correct = statuses.filter(s => s === 'correct').length;
        const wrong = statuses.filter(s => s === 'wrong').length;
        const unanswered = statuses.filter(s => s === 'unanswered' || !s).length;

        const stats = document.createElement('div');
        stats.className = 'trainer-summary';
        stats.innerHTML = `
          Правильно: ${correct} · Неправильно: ${wrong} · Осталось: ${unanswered}
        `;

        const oldStats = footer.querySelector('.trainer-summary');
        if (oldStats) oldStats.remove();
        footer.prepend(stats);
      }

      // Переключение режимов
      document.getElementById('hwModeList').onclick = () => {
        hwMode = 'list';
        hwProgress.mode = 'list';
        saveState();
        renderList();
        updateButtons();
      };

      document.getElementById('hwModeCards').onclick = () => {
        hwMode = 'cards';
        hwProgress.mode = 'cards';
        hwProgress.cardsIndex = 0;
        saveState();
        renderCards();
        updateButtons();
      };

      function updateButtons() {
        const listBtn = document.getElementById('hwModeList');
        const cardsBtn = document.getElementById('hwModeCards');
        if (hwMode === 'list') {
          listBtn.className = 'btn btn-sm btn-accent';
          cardsBtn.className = 'btn btn-sm btn-ghost';
        } else {
          listBtn.className = 'btn btn-sm btn-ghost';
          cardsBtn.className = 'btn btn-sm btn-accent';
        }
      }

      // Инициализация
      if (hwMode === 'cards') {
        renderCards();
      } else {
        renderList();
      }
      updateButtons();

      // Кнопка "Закончить домашку" — только для списка
      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-accent';
      finishBtn.textContent = 'Закончить домашку';
      finishBtn.onclick = () => {
        const correct = statuses.filter(s => s === 'correct').length;
        if (correct === tasks.length) {
          hwProgress.__finished = true;
          if (isRealStudent) {
            persistFullProgress(CURRENT_USER.key, progress);
            window.__cachedProgress = progress;
          }
          alert('Домашка пройдена на 100%');
          window.goHome();
        } else {
          alert(`Вы ответили правильно на ${correct} из ${tasks.length} заданий. Доработайте остальные!`);
        }
      };
      footer.appendChild(finishBtn);
    }

    function renderLessonModal(lessonId) {
      const lesson = LESSONS.find(l => l.id === lessonId);
      if (!lesson) return;

      if (lesson.assignedTo && lesson.assignedTo.length > 0 && !CURRENT_USER.isTeacher && !TEACH_MODE) {
        if (!lesson.assignedTo.includes(CURRENT_USER.key)) {
          alert('Этот урок доступен только выбранным ученикам.');
          return;
        }
      }

      const isRealStudent = !CURRENT_USER.isTeacher;
      let progress = {};
      let lessonFinished = false;

      if (isRealStudent) {
        progress = window.__cachedProgress || {};
        lessonFinished = !!progress['lesson:' + lesson.id];
      }

      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.id = 'lessonModalBg';
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.style.maxWidth = '560px';

      const links = lesson.links || [];
      const files = lesson.files || [];
      let linksHtml = '';

      if (lesson.videoUrl) {
        let videoHtml = '';
        const url = lesson.videoUrl;
        if (url.includes('youtube.com/embed') || url.includes('youtu.be')) {
          const embedUrl = url.includes('youtube.com/embed') ? url : 
            `https://www.youtube.com/embed/${url.split('youtu.be/')[1]?.split('?')[0] || ''}`;
          videoHtml = `
            <div class="video-container">
              <iframe src="${embedUrl}" allowfullscreen></iframe>
            </div>
          `;
        } else if (url.includes('rutube.ru')) {
          videoHtml = `
            <div class="video-container">
              <iframe src="${url}" allowfullscreen></iframe>
            </div>
          `;
        } else if (url.includes('vk.com')) {
          videoHtml = `
            <div class="video-container">
              <iframe src="${url}" allowfullscreen></iframe>
            </div>
          `;
        } else {
          videoHtml = `<a href="${escapeAttr(url)}" target="_blank" class="lesson-link">Смотреть видео</a>`;
        }
        linksHtml += videoHtml;
      }

      if (links.length > 0) {
        linksHtml += `<div class="lesson-video-list">` + links.map(l => 
          `<a class="lesson-link" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label || 'Смотреть видео')}</a>`
        ).join('') + `</div>`;
      }

      if (files.length > 0) {
        linksHtml += `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">` + 
          files.map(f => 
            `<a href="${escapeAttr(f.url)}" target="_blank" class="lesson-link">${escapeHtml(f.label || 'Скачать файл')}</a>`
          ).join('') + 
        `</div>`;
      }

      if (!linksHtml) {
        linksHtml = `<div class="empty-note">Материалы пока не добавлены.</div>`;
      }

      let finishButtonHtml = '';
      if (isRealStudent && !TEACH_MODE) {
        if (lessonFinished) {
          finishButtonHtml = `<button class="btn btn-success" disabled style="opacity:0.7;">✅ Урок завершён</button>`;
        } else {
          finishButtonHtml = `<button class="btn btn-accent" id="finishLessonBtn">📖 Закончить урок</button>`;
        }
      }

      modal.innerHTML = `
        <h3>${escapeHtml(lesson.title)}</h3>
        ${lesson.description ? `<p style="color:var(--ink-soft);font-size:14px;margin-bottom:16px;">${escapeHtml(lesson.description)}</p>` : ''}
        <div class="lesson-body">${linksHtml}</div>
        <div class="actions" style="justify-content:space-between;flex-wrap:wrap;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-ghost" id="closeLessonBtn">Закрыть</button>
            ${finishButtonHtml}
          </div>
        </div>
      `;
      bg.appendChild(modal);
      document.body.appendChild(bg);

      bg.onclick = (e) => { if (e.target === bg) closeLessonModal(); };
      modal.querySelector('#closeLessonBtn').onclick = closeLessonModal;

      const finishBtn = modal.querySelector('#finishLessonBtn');
      if (finishBtn) {
        finishBtn.onclick = async () => {
          if (confirm('Отметить урок как завершённый?')) {
            const progress = await getProgress(CURRENT_USER.key);
            progress['lesson:' + lesson.id] = true;
            await persistFullProgress(CURRENT_USER.key, progress);
            window.__cachedProgress = progress;
            bg.remove();
            render();
          }
        };
      }
    }

    function closeLessonModal() {
      const bg = document.getElementById('lessonModalBg');
      if (bg) bg.remove();
      VIEW = { name: 'home' };
      render();
    }

    async function renderStats(container) {
      container.innerHTML = '';

      const reg = await loadRegistry();
      const sortedKeys = Object.keys(reg).sort((a, b) => (reg[a].createdAt || 0) - (reg[b].createdAt || 0));

      const wrap = document.createElement('div');
      wrap.innerHTML = `<h1 class="page-title">Статистика учеников</h1><p class="page-sub">Имя, пароль и прогресс по платформе</p>`;

      const tabs = document.createElement('div');
      tabs.className = 'maintabs';
      tabs.innerHTML = `
        <div class="maintab" id="tabContent">Содержание</div>
        <div class="maintab active" id="tabStats">Статистика</div>
        <div class="maintab" id="tabTeach">Обучаю</div>
      `;
      tabs.querySelector('#tabContent').onclick = () => { VIEW = { name: 'home' }; render(); };
      tabs.querySelector('#tabTeach').onclick = () => { window.enterTeachMode(); };
      wrap.appendChild(tabs);

      const addBox = document.createElement('div');
      addBox.className = 'add-student-box';
      addBox.innerHTML = `
        <h3>Добавить ученика</h3>
        <div class="add-student-row">
          <input type="text" id="newStudentName" placeholder="Имя ученика" style="flex:1;">
          <input type="text" id="newStudentPassword" placeholder="Пароль" style="flex:1;">
          <button class="btn btn-accent" id="addStudentBtn">Добавить</button>
        </div>
        <div id="addStudentMsg" class="add-err"></div>
      `;
      wrap.appendChild(addBox);

      const tableWrap = document.createElement('div');
      tableWrap.style.cssText = 'overflow-x:auto;';

      const table = document.createElement('table');
      table.className = 'stats-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th>Ученик</th>
            <th>Пароль</th>
            <th style="min-width:150px;">Прогресс</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      `;
      tableWrap.appendChild(table);
      wrap.appendChild(tableWrap);

      container.appendChild(wrap);

      const tbody = table.querySelector('#statsBody');
      tbody.innerHTML = '';

      if (sortedKeys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-note">Учеников пока нет. Добавьте первого!</td></tr>`;
      } else {
        for (const key of sortedKeys) {
          const student = reg[key];
          const progress = await getProgress(key);

          let correctCount = 0;
          let totalCount = 0;

          for (const trainer of (TRAINERS || [])) {
            const trainerData = progress[trainer.id] || {};
            const statuses = trainerData.statuses || [];
            const reactions = trainer.reactions || [];
            totalCount += reactions.length;
            correctCount += statuses.filter(s => s === 'correct').length;
          }

          for (const homework of (HOMEWORKS || [])) {
            const hwData = progress[homework.id] || {};
            const statuses = hwData.statuses || [];
            const tasks = homework.tasks || [];
            totalCount += tasks.length;
            correctCount += statuses.filter(s => s === 'correct').length;
          }

          for (const lesson of (LESSONS || [])) {
            totalCount++;
            if (progress['lesson:' + lesson.id] === true) {
              correctCount++;
            }
          }

          const percent = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td><span class="student-name">${escapeHtml(student.name)}</span></td>
            <td><span style="font-family:monospace;font-size:13px;">${escapeHtml(student.password)}</span></td>
            <td>
              <div style="display:flex;align-items:center;gap:12px;">
                <div class="stats-progress-bar">
                  <div class="fill" style="width:${percent}%;${percent === 100 ? 'background:var(--ok);' : ''}"></div>
                </div>
                <span style="font-weight:600;font-size:14px;min-width:44px;">${percent}%</span>
                <span style="font-size:11px;color:var(--ink-soft);">${correctCount}/${totalCount}</span>
              </div>
            </td>
            <td>
              <div class="stats-actions">
                <button class="btn btn-sm btn-ghost change-pass-btn" data-key="${key}">Сменить пароль</button>
                <button class="btn btn-sm btn-danger delete-student-btn" data-key="${key}">Удалить</button>
              </div>
            </td>
          `;
          row.querySelector('.change-pass-btn').onclick = (e) => {
            e.stopPropagation();
            showChangePasswordModal(key);
          };
          row.querySelector('.delete-student-btn').onclick = (e) => {
            e.stopPropagation();
            showDeleteStudentConfirm(key);
          };
          tbody.appendChild(row);
        }
      }

      addBox.querySelector('#addStudentBtn').onclick = async () => {
        const nameInput = addBox.querySelector('#newStudentName');
        const passInput = addBox.querySelector('#newStudentPassword');
        const msgDiv = addBox.querySelector('#addStudentMsg');

        const name = nameInput.value.trim();
        const password = passInput.value.trim();

        if (!name || !password) {
          msgDiv.textContent = 'Введите имя и пароль.';
          msgDiv.style.color = 'var(--bad)';
          return;
        }

        const reg = await loadRegistry();
        const key = name.toLowerCase();
        if (reg[key]) {
          msgDiv.textContent = 'Ученик с таким именем уже существует.';
          msgDiv.style.color = 'var(--bad)';
          return;
        }

        reg[key] = { name, password, createdAt: Date.now(), platform: currentPlatform };
        await saveRegistry(reg);
        nameInput.value = '';
        passInput.value = '';
        msgDiv.textContent = 'Ученик добавлен!';
        msgDiv.style.color = 'var(--ok)';
        renderStats(container);
      };
    }

    async function showChangePasswordModal(studentKey) {
      const reg = await loadRegistry();
      const student = reg[studentKey];
      if (!student) return;

      window.showPromptModal(`Смена пароля для ${student.name}`, '', async (newPass) => {
        if (!newPass.trim()) return;
        student.password = newPass.trim();
        await saveRegistry(reg);
        if (VIEW.name === 'stats') renderStats(document.getElementById('mainContainer'));
      });
    }

    async function showDeleteStudentConfirm(studentKey) {
      const reg = await loadRegistry();
      const student = reg[studentKey];
      if (!student) return;

      window.showConfirmModal(`Удалить ученика ${student.name}?`, 'Все данные прогресса будут удалены без возможности восстановления.', async () => {
        delete reg[studentKey];
        await saveRegistry(reg);
        await remove(ref(db, getPlatformPath(currentPlatform, `progress/${studentKey}`)));
        if (VIEW.name === 'stats') renderStats(document.getElementById('mainContainer'));
        else { VIEW = { name: 'stats' }; render(); }
      });
    }

    async function renderStudentDetail(container, studentKey) {
      const reg = await loadRegistry();
      const student = reg[studentKey];
      if (!student) {
        VIEW = { name: 'stats' };
        render();
        return;
      }

      const progress = await getProgress(studentKey);

      const wrap = document.createElement('div');

      const backRow = document.createElement('div');
      backRow.className = 'back-row';
      backRow.innerHTML = `<button class="back-btn">← Назад к статистике</button>`;
      backRow.querySelector('.back-btn').onclick = () => { VIEW = { name: 'stats' }; render(); };
      wrap.appendChild(backRow);

      const title = document.createElement('h1');
      title.className = 'page-title';
      title.textContent = `${student.name}`;
      wrap.appendChild(title);

      const detailDiv = document.createElement('div');
      detailDiv.className = 'student-detail';

      const allItems = [];

      for (const trainer of (TRAINERS || [])) {
        if (!(trainer.reactions || []).length) continue;
        const trainerData = progress[trainer.id] || {};
        allItems.push({
          type: 'Тренажёр',
          title: trainer.title,
          finished: trainerData.__finished === true
        });
      }

      for (const homework of (HOMEWORKS || [])) {
        if (!(homework.tasks || []).length) continue;
        const hwData = progress[homework.id] || {};
        allItems.push({
          type: 'Домашка',
          title: homework.title,
          finished: hwData.__finished === true
        });
      }

      for (const lesson of (LESSONS || [])) {
        allItems.push({
          type: 'Урок',
          title: lesson.title,
          finished: !!progress['lesson:' + lesson.id]
        });
      }

      if (allItems.length === 0) {
        detailDiv.innerHTML = `<div class="empty-note">Материалов пока нет.</div>`;
      } else {
        for (const item of allItems) {
          const row = document.createElement('div');
          row.className = 'topic-row';
          row.innerHTML = `
            <div>
              <div class="topic-name">${escapeHtml(item.title)}</div>
              <div style="font-size:12px;color:var(--ink-soft);">${item.type}</div>
            </div>
            <div class="topic-stats" style="font-weight:600;color:${item.finished ? 'var(--ok)' : 'var(--ink-soft)'};">
              ${item.finished ? '✅ Выполнено' : 'Не выполнено'}
            </div>
          `;
          detailDiv.appendChild(row);
        }
      }

      wrap.appendChild(detailDiv);
      container.appendChild(wrap);
    }

            <div class="builder-line"><div class="ln-label">1</div><input type="text" placeholder="Название" data-field="label" data-row="${i}"></div>
            <div class="builder-line"><div class="ln-label">2</div><input type="text" placeholder="Ссылка" data-field="url" data-row="${i}"></div>

        const cont = fieldsBox.querySelector('#lessonFileRowsContainer');
        cont.innerHTML = lessonFileRows.map((_, i) => `
          <div class="rxn-row-builder" data-row="${i}">
            <div class="rrb-head"><span>Файл ${i+1}</span>${lessonFileRows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
            <div class="builder-line"><div class="ln-label">1</div><input type="text" placeholder="Название" data-field="label" data-row="${i}"></div>

      typeSel.onchange = renderFields;
