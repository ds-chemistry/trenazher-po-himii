function syncHomeworkRowsFromDOM() {
  const cont = fieldsBox.querySelector('#homeworkRowsContainer'); if (!cont) return;
  [...cont.querySelectorAll('.rxn-row-builder')].forEach((rowEl, i) => {
    if (!homeworkRows[i]) return;
    homeworkRows[i].question = rowEl.querySelector('[data-field="question"]').value;
    homeworkRows[i].answer = rowEl.querySelector('[data-field="answer"]').value;
    homeworkRows[i].explain = rowEl.querySelector('[data-field="explain"]').value;
    homeworkRows[i].options = rowEl.querySelector('[data-field="options"]')?.value || '';
    homeworkRows[i].html = rowEl.querySelector('[data-field="html"]')?.value || '';
    homeworkRows[i].rowFontSize = rowEl.querySelector('[data-field="rowfont"]')?.value || '';
  });
}
function refreshHwRowImagePreview(cont, i, removeClass) {
  const rowEl = cont.querySelector(`.rxn-row-builder[data-row="${i}"]`); if (!rowEl) return;
  const imgRow = rowEl.querySelector('.img-row'); if (!imgRow) return;
  let pb = imgRow.querySelector('.task-image-preview-list');
  if (!pb) { pb = document.createElement('div'); pb.className = 'task-image-preview-list'; imgRow.querySelector('div').insertBefore(pb, imgRow.querySelector('div').firstChild); }
  pb.innerHTML = buildImagePreviewHtml(homeworkRows[i].images, i, removeClass);
  pb.querySelectorAll('.' + removeClass).forEach(btn => {
    btn.onclick = () => { syncHomeworkRowsFromDOM(); const ri = parseInt(btn.dataset.row); const imgIdx = parseInt(btn.dataset.imgidx); homeworkRows[ri].images.splice(imgIdx, 1); refreshHwRowImagePreview(cont, ri, removeClass); };
  });
}
function renderHomeworkRows() {
  const cont = fieldsBox.querySelector('#homeworkRowsContainer');
  cont.innerHTML = homeworkRows.map((row, i) => `
    <div class="rxn-row-builder" data-row="${i}">
      <div class="rrb-head"><span>Задание ${i+1}</span>${homeworkRows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
      <div class="builder-line"><div class="ln-label">1</div><textarea placeholder="Вопрос (Enter — перенос строки)" data-field="question" data-row="${i}" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);resize:vertical;min-height:50px;">${escapeHtml(row.question||'')}</textarea><button type="button" class="btn btn-sm btn-ghost bold-btn" data-target="question" data-row="${i}" style="padding:4px 8px;font-size:11px;font-weight:700;">Ж</button></div>
      <div class="builder-line"><div class="ln-label">2</div><textarea placeholder="Правильный ответ (Enter — перенос строки)" data-field="answer" data-row="${i}" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);resize:vertical;min-height:50px;">${escapeHtml(row.answer||'')}</textarea><button type="button" class="btn btn-sm btn-ghost bold-btn" data-target="answer" data-row="${i}" style="padding:4px 8px;font-size:11px;font-weight:700;">Ж</button></div>
      <div class="builder-line"><div class="ln-label">3</div><input type="text" placeholder="Пояснение" data-field="explain" data-row="${i}" value="${escapeAttr(row.explain||'')}"></div>
      <div class="builder-line"><div class="ln-label">4</div><input type="text" placeholder="Варианты (через запятую)" data-field="options" data-row="${i}" value="${escapeAttr(row.options||'')}"></div>
      <div class="builder-line"><div class="ln-label">HTML</div><textarea placeholder="HTML-код для отображения" data-field="html" data-row="${i}" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-family:monospace;font-size:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:40px;">${escapeHtml(row.html||'')}</textarea></div>
      <div class="builder-line"><div class="ln-label">Aa</div><input type="number" min="8" max="96" step="1" placeholder="Размер шрифта этого задания (пусто = общий)" data-field="rowfont" data-row="${i}" value="${escapeAttr(row.rowFontSize||'')}" style="max-width:320px;"></div>
      <div class="builder-line img-row" data-row="${i}">
        <div class="ln-label">5</div>
        <div style="flex:1;">
          <div class="task-image-preview-list">${buildImagePreviewHtml(row.images, i, 'hw-image-remove')}</div>
          <input type="file" accept="image/*" multiple class="hw-image-input" data-row="${i}">
        </div>
      </div>
    </div>
  `).join('');
  cont.querySelectorAll('[data-remove]').forEach(btn => { btn.onclick = () => { syncHomeworkRowsFromDOM(); homeworkRows.splice(parseInt(btn.dataset.remove), 1); renderHomeworkRows(); }; });
  cont.querySelectorAll('.hw-image-input').forEach(inp => {
    inp.onchange = async (e) => {
      const files = Array.from(e.target.files); if (!files.length) return;
      const i = parseInt(inp.dataset.row); syncHomeworkRowsFromDOM();
      if (!homeworkRows[i].images) homeworkRows[i].images = [];
      for (const file of files) { try { homeworkRows[i].images.push(await compressTaskImageToDataUrl(file)); } catch (err) { alert('Не удалось загрузить "' + file.name + '": ' + err.message); } }
      refreshHwRowImagePreview(cont, i, 'hw-image-remove'); inp.value = '';
    };
  });
  cont.querySelectorAll('.hw-image-remove').forEach(btn => {
    btn.onclick = () => { syncHomeworkRowsFromDOM(); const i = parseInt(btn.dataset.row); const imgIdx = parseInt(btn.dataset.imgidx); homeworkRows[i].images.splice(imgIdx, 1); refreshHwRowImagePreview(cont, i, 'hw-image-remove'); };
  });
  cont.querySelectorAll('.bold-btn').forEach(btn => {
    btn.onclick = () => {
      const rowEl = btn.closest('.rxn-row-builder');
      const textarea = rowEl.querySelector(`[data-field="${btn.dataset.target}"]`); if (!textarea) return;
      const start = textarea.selectionStart; const end = textarea.selectionEnd; const text = textarea.value;
      const selected = text.substring(start, end); const replacement = `<b>${selected}</b>`;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus(); textarea.setSelectionRange(start + 3, start + 3 + selected.length);
    };
  });
}
  typeSel.onchange = renderFields;
  renderFields();

  box.querySelector('#builderSave').onclick = async () => {
    const type = typeSel.value;
    const msg = box.querySelector('#builderMsg');
    msg.textContent = ''; msg.style.color = 'var(--ok)';

    if (type === 'topic') {
      const name = document.getElementById('fTopicName').value.trim();
      if (!name) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название темы.'; return; }
      const id = 'topic_' + Date.now();
      const maxOrder = TOPICS.length ? Math.max(...TOPICS.map(t => t.order)) : -1;
      TOPICS.push({ id, name, order: maxOrder + 1 });
      await persistTopics();
      msg.textContent = 'Тема добавлена!';
      refreshTopicOptions();
      render();
    } else if (type === 'theory') {
      const title = document.getElementById('fTheoryTitle').value.trim();
      const status = document.getElementById('fTheoryStatus').value;
      const releaseDate = document.getElementById('fTheoryRelease').value;
      const desc = document.getElementById('fTheoryDesc').value;
      const htmlContent = document.getElementById('fTheoryHtml').value;
      const linkUrl = document.getElementById('fTheoryLink').value.trim();
      const topicId = topicSel.value;
      const assignedTo = Array.from(document.getElementById('fAssignToTheory').selectedOptions).map(o => o.value).filter(v => v !== '');
      const fontSize = normalizeFontSize(document.getElementById('fTheoryFontSize')?.value, DEFAULT_THEORY_FONT_SIZE);
      if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название.'; return; }
      if (!theoryFile && !desc.trim() && !linkUrl && !htmlContent.trim()) { msg.style.color = 'var(--bad)'; msg.textContent = 'Прикрепите файл, введите текст, HTML-код или ссылку.'; return; }
      const id = 'theory_' + Date.now();
      const siblingsMax = THEORIES.filter(t => t.topicId === topicId).reduce((m, t) => Math.max(m, t.order), -1);
      THEORIES.push({ id, topicId, title, order: siblingsMax + 1, description: desc, htmlContent, file: theoryFile, linkUrl: linkUrl || null, fontSize, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: status === 'draft', isLocked: status === 'locked', scheduledRelease: releaseDate ? getSamaraTimestamp(releaseDate) : null });
      await persistTheories();
      msg.textContent = 'Теория добавлена!';
      render();
    } else if (type === 'trainer') {
      const title = document.getElementById('fTrainerTitle').value.trim();
      const mode = document.getElementById('fTrainerMode').value;
      const taskType = document.getElementById('fTaskType').value;
      const allowModeChoice = document.getElementById('fAllowModeChoice').checked;
      const randomOrder = document.getElementById('fRandomOrder').checked;
      const status = document.getElementById('fTrainerStatus').value;
      const releaseDate = document.getElementById('fTrainerRelease').value;
      const customNote = document.getElementById('fTrainerNote').value.trim();
      const keepNote = document.getElementById('fTrainerKeepNote').checked;
      const noteImageInput = document.getElementById('fTrainerNoteImage');
      const topicId = topicSel.value;
      const assignedTo = Array.from(document.getElementById('fAssignTo').selectedOptions).map(o => o.value).filter(v => v !== '');
      const fontSize = normalizeFontSize(document.getElementById('fTrainerFontSize')?.value, DEFAULT_TASK_FONT_SIZE);
      if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название.'; return; }
      const cont2 = fieldsBox.querySelector('#rxnRowsContainer');
      const rows = [...cont2.querySelectorAll('.rxn-row-builder')];
      const reactions = [];
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const lhs = row.querySelector('[data-field="lhs"]').value;
        const answer = row.querySelector('[data-field="answer"]').value;
        const explain = row.querySelector('[data-field="explain"]').value;
        const full = row.querySelector('[data-field="full"]').value;
        const optionsStr = row.querySelector('[data-field="options"]')?.value.trim() || '';
        const htmlContent = row.querySelector('[data-field="html"]')?.value || '';
        const rowFontRaw = row.querySelector('[data-field="rowfont"]')?.value || '';
        const rowFontSize = rowFontRaw ? normalizeFontSize(rowFontRaw, null) : null;
        const images = (reactionRows[i] && reactionRows[i].images) || [];
        if (!lhs.trim() || !answer.trim()) continue;
        const { correctSets, correctSetsDisplay, valid } = buildCorrectSets(answer, taskType);
        const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
        reactions.push({ lhs, valid, correctSets, correctSetsDisplay, explanation: explain || '', fullEquation: full || (!valid ? 'Реакция не идёт' : ''), options, images, htmlContent, fontSize: rowFontSize });
      }
      if (reactions.length === 0) { msg.style.color = 'var(--bad)'; msg.textContent = 'Добавьте хотя бы одну реакцию.'; return; }
      let noteImage = null;
      if (noteImageInput.files && noteImageInput.files[0]) {
        try { noteImage = await compressTaskImageToDataUrl(noteImageInput.files[0]); }
        catch (err) { alert('Не удалось загрузить картинку примечания: ' + err.message); return; }
      }
      const id = 'trainer_' + Date.now();
      const siblingsMax = TRAINERS.filter(t => t.topicId === topicId).reduce((m, t) => Math.max(m, t.order), -1);
      const randomOrderMap = randomOrder ? shuffleArray(reactions.map((_, i) => i)) : null;
      TRAINERS.push({ id, topicId, title, order: siblingsMax + 1, mode, taskType, allowModeChoice, randomOrder, customNote, keepNote, noteImage, reactions, randomOrderMap, fontSize, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: status === 'draft', isLocked: status === 'locked', scheduledRelease: releaseDate ? getSamaraTimestamp(releaseDate) : null });
      await persistTrainers();
      msg.textContent = 'Тренажёр добавлен!';
      render();
    } else if (type === 'lesson') {
      const title = document.getElementById('fLessonTitle').value.trim();
      const description = document.getElementById('fLessonDesc').value;
      const videoUrl = document.getElementById('fLessonVideo').value.trim();
      const status = document.getElementById('fLessonStatus').value;
      const releaseDate = document.getElementById('fLessonRelease').value;
      const topicId = topicSel.value;
      const assignedTo = Array.from(document.getElementById('fAssignToLesson').selectedOptions).map(o => o.value).filter(v => v !== '');
      if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название.'; return; }
      const links = [...fieldsBox.querySelectorAll('#lessonLinkRowsContainer .rxn-row-builder')].map(row => ({ label: row.querySelector('[data-field="label"]').value.trim() || 'Видео', url: row.querySelector('[data-field="url"]').value.trim() })).filter(l => l.url);
      const files = [...fieldsBox.querySelectorAll('#lessonFileRowsContainer .rxn-row-builder')].map(row => ({ label: row.querySelector('[data-field="label"]').value.trim() || 'Файл', url: row.querySelector('[data-field="url"]').value.trim() })).filter(f => f.url);
      const attached = (typeof fieldsBox._getAttachedLessonFile === 'function') ? fieldsBox._getAttachedLessonFile() : null;
      if (attached) files.push({ label: attached.name, name: attached.name, type: attached.type, size: attached.size, dataUrl: attached.dataUrl });
      const id = 'lesson_' + Date.now();
      const siblingsMax = LESSONS.filter(l => l.topicId === topicId).reduce((m, l) => Math.max(m, l.order), -1);
      LESSONS.push({ id, topicId, title, order: siblingsMax + 1, description, videoUrl, links, files, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: status === 'draft', isLocked: status === 'locked', scheduledRelease: releaseDate ? getSamaraTimestamp(releaseDate) : null });
      await persistLessons();
      msg.textContent = 'Урок добавлен!';
      render();
    } else if (type === 'homework') {
      const title = document.getElementById('fHomeworkTitle').value.trim();
      const mode = document.getElementById('fHomeworkMode').value;
      const taskType = document.getElementById('fHomeworkTaskType').value;
      const allowModeChoice = document.getElementById('fHomeworkAllowModeChoice').checked;
      const randomOrder = document.getElementById('fHomeworkRandomOrder').checked;
      const status = document.getElementById('fHomeworkStatus').value;
      const releaseDate = document.getElementById('fHomeworkRelease').value;
      const customNote = document.getElementById('fHomeworkNote').value.trim();
      const keepNote = document.getElementById('fHomeworkKeepNote').checked;
      const noteImageInput = document.getElementById('fHomeworkNoteImage');
      const topicId = topicSel.value;
      const assignedTo = Array.from(document.getElementById('fAssignToHomework').selectedOptions).map(o => o.value).filter(v => v !== '');
      const fontSize = normalizeFontSize(document.getElementById('fHomeworkFontSize')?.value, DEFAULT_TASK_FONT_SIZE);
      if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название.'; return; }
      const cont2 = fieldsBox.querySelector('#homeworkRowsContainer');
      const rows = [...cont2.querySelectorAll('.rxn-row-builder')];
      const tasks = [];
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const question = row.querySelector('[data-field="question"]').value;
        const answer = row.querySelector('[data-field="answer"]').value;
        const explain = row.querySelector('[data-field="explain"]').value;
        const optionsStr = row.querySelector('[data-field="options"]')?.value.trim() || '';
        const htmlContent = row.querySelector('[data-field="html"]')?.value || '';
        const rowFontRaw = row.querySelector('[data-field="rowfont"]')?.value || '';
        const rowFontSize = rowFontRaw ? normalizeFontSize(rowFontRaw, null) : null;
        const images = (homeworkRows[i] && homeworkRows[i].images) || [];
        if (!question.trim() || !answer.trim()) continue;
        const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
        tasks.push({ question, answer, explanation: explain || '', options, images, htmlContent, fontSize: rowFontSize });
      }
      if (tasks.length === 0) { msg.style.color = 'var(--bad)'; msg.textContent = 'Добавьте хотя бы одно задание.'; return; }
      let noteImage = null;
      if (noteImageInput.files && noteImageInput.files[0]) {
        try { noteImage = await compressTaskImageToDataUrl(noteImageInput.files[0]); }
        catch (err) { alert('Не удалось загрузить картинку примечания: ' + err.message); return; }
      }
      const id = 'homework_' + Date.now();
      const siblingsMax = HOMEWORKS.filter(h => h.topicId === topicId).reduce((m, h) => Math.max(m, h.order), -1);
      const randomOrderMap = randomOrder ? shuffleArray(tasks.map((_, i) => i)) : null;
      HOMEWORKS.push({ id, topicId, title, order: siblingsMax + 1, mode, taskType, allowModeChoice, randomOrder, customNote, keepNote, noteImage, tasks, randomOrderMap, fontSize, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: status === 'draft', isLocked: status === 'locked', scheduledRelease: releaseDate ? getSamaraTimestamp(releaseDate) : null });
      await persistHomeworks();
      msg.textContent = 'Домашка добавлена!';
      render();
    }
  };

  return box;
}

function buildAIBuilder() {
  const box = document.createElement('div');
  box.className = 'ai-builder-box';
  box.innerHTML = `
    <h3>Быстрое создание с ИИ</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Одно задание = один блок. Блоки разделяйте символом <b>#</b> на отдельной строке. Внутри одного задания можно писать в столбик через Enter, а поля разделять символом <b>|</b>: задание | ответ | пояснение | полное уравнение | варианты | HTML-код.</p>
    <div class="field-row">
      <select id="aiType"><option value="trainer">Тренажёр</option><option value="homework">Домашка</option><option value="lesson">Урок</option></select>
      <select id="aiTopic"></select>
    </div>
    <div class="field-row" id="aiTrainerOptionsRow">
      <select id="aiMode"><option value="step">Пошагово</option><option value="list">Список</option><option value="cards">Карты</option></select>
      <select id="aiTaskType"><option value="text">Ввод текста</option><option value="radio">Один вариант</option><option value="checkbox">Несколько вариантов</option></select>
      <label style="font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="aiAllowModeChoice"> Свободный режим</label>
      <label style="font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="aiRandomOrder"> Рандом</label>
    </div>
    ${fontStepperHtml('aiFontSize', DEFAULT_TASK_FONT_SIZE, DEFAULT_TASK_FONT_SIZE, 'Размер шрифта задания')}
    <div class="field-row"><input type="text" id="aiTitle" placeholder="Название материала" style="flex:1;"></div>
    <div class="field-row"><textarea id="aiInput" placeholder="Пример (задания разделены строкой с #):&#10;&#10;Среди предложенных формул выберите... | 3 1 7&#10;#&#10;Определите атомы... | 24&#10;---HTML---&#10;<table>...</table>"></textarea></div>
    <div class="field-row" id="aiSyntaxHint">
      <span style="font-size:12px;color:var(--ink-soft);">Поля через <b>|</b>: задание | ответ | пояснение | полное уравнение | варианты | HTML-код. HTML-код пишется прямо в шестое поле после палочки.</span>
    </div>
    <div class="field-row" id="aiImagesBlock" style="align-items:flex-start;">
      <label style="font-size:12px;color:var(--ink-soft);width:100%;">Фото для заданий (по порядку). Сколько блоков — столько и фото. Можно выбрать сразу все.</label>
      <input type="file" id="aiImagesInput" accept="image/*" multiple style="width:100%;">
      <div id="aiImagesPreview" class="task-image-preview-list" style="margin-top:8px;"></div>
      <small class="help" style="margin-top:4px;">Фото разойдутся по заданиям: 1-е фото → 1-е задание, 2-е → 2-е и т.д. Если фото меньше — остальные задания будут без фото.</small>
    </div>
    <div class="field-row">
      <label style="font-size:12px;color:var(--ink-soft);width:100%;">Доступно для учеников</label>
      <select id="aiAssignTo" multiple style="height:80px;width:100%;"><option value="">Все ученики</option></select>
    </div>
    <button class="btn btn-accent btn-sm" id="aiGenerateBtn">Создать</button>
    <div id="aiMsg" style="margin-top:8px;font-size:12.5px;color:var(--ok);"></div>
  `;
  bindFontSteppers(box);
  const typeSel = box.querySelector('#aiType');
  const topicSel = box.querySelector('#aiTopic');
  const modeSel = box.querySelector('#aiMode');
  const taskTypeSel = box.querySelector('#aiTaskType');
  const trainerOptionsRow = box.querySelector('#aiTrainerOptionsRow');
  const imagesBlock = box.querySelector('#aiImagesBlock');
  const assignSel = box.querySelector('#aiAssignTo');
  const allowModeChoiceChk = box.querySelector('#aiAllowModeChoice');
  const randomOrderChk = box.querySelector('#aiRandomOrder');

  let aiImages = [];

  function refreshTopicOptions() {
    const sorted = [...TOPICS].sort((a, b) => a.order - b.order);
    topicSel.innerHTML = sorted.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
  }
  refreshTopicOptions();
  assignSel.innerHTML = '<option value="">Все ученики</option>' + [...allStudents].sort().map(s => `<option value="${s}">${escapeHtml(s)}</option>`).join('');

  function updateFieldsVisibility() {
    const t = typeSel.value;
    trainerOptionsRow.style.display = (t === 'trainer' || t === 'homework') ? 'flex' : 'none';
    imagesBlock.style.display = (t === 'trainer' || t === 'homework') ? 'flex' : 'none';
  }
  typeSel.addEventListener('change', updateFieldsVisibility);
  updateFieldsVisibility();

  const aiImagesInput = box.querySelector('#aiImagesInput');
  const aiImagesPreview = box.querySelector('#aiImagesPreview');
  function renderAiImagesPreview() {
    aiImagesPreview.innerHTML = aiImages.map((src, idx) => `
      <div class="task-image-preview-item">
        <img src="${src}" alt="" title="Задание ${idx+1}">
        <button type="button" class="icon-btn danger ai-img-remove" data-idx="${idx}" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;">✕</button>
      </div>`).join('');
    aiImagesPreview.querySelectorAll('.ai-img-remove').forEach(btn => {
      btn.onclick = () => { aiImages.splice(parseInt(btn.dataset.idx), 1); renderAiImagesPreview(); };
    });
  }
  aiImagesInput.onchange = async (e) => {
    const files = Array.from(e.target.files); if (!files.length) return;
    for (const f of files) {
      try { aiImages.push(await compressTaskImageToDataUrl(f)); }
      catch (err) { alert('Не удалось загрузить "' + f.name + '": ' + err.message); }
    }
    aiImagesInput.value = '';
    renderAiImagesPreview();
  };

  box.querySelector('#aiGenerateBtn').onclick = async () => {
    const type = typeSel.value;
    const topicId = topicSel.value;
    const title = box.querySelector('#aiTitle').value.trim();
    const rawText = box.querySelector('#aiInput').value;
    const msgDiv = box.querySelector('#aiMsg');
    const mode = modeSel.value;
    const taskType = taskTypeSel.value;
    const allowModeChoice = allowModeChoiceChk.checked;
    const randomOrder = randomOrderChk.checked;
    const assignedTo = Array.from(assignSel.selectedOptions).map(o => o.value).filter(v => v);
    const fontSize = normalizeFontSize(box.querySelector('#aiFontSize')?.value, DEFAULT_TASK_FONT_SIZE);
    msgDiv.textContent = ''; msgDiv.style.color = 'var(--bad)';
    if (!title) { msgDiv.textContent = 'Введите название.'; return; }
    if (!rawText) { msgDiv.textContent = 'Вставьте материалы.'; return; }

    const blocks = rawText.split(/\n\s*#\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
    const imagesForBlock = (i) => aiImages[i] ? [aiImages[i]] : [];

    if (type === 'trainer') {
      const reactions = [];
      for (let bi = 0; bi < blocks.length; bi++) {
        const block = blocks[bi];
        const parts = block.split('|').map(p => p.trim());
        if (parts.length < 2) continue;
        const lhs = parts[0] || '';
        const answer = parts[1] || '';
        const explain = parts[2] || '';
        const full = parts[3] || '';
        const optionsStr = parts[4] || '';
        const htmlContent = parts[5] || '';
        if (!lhs.trim() || !answer.trim()) continue;
        const { correctSets, correctSetsDisplay, valid } = buildCorrectSets(answer, taskType);
        const isInvalid = !valid;
        const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
        reactions.push({ lhs, valid: !isInvalid, correctSets, correctSetsDisplay, explanation: explain || '', fullEquation: full || (isInvalid ? 'Реакция не идёт' : ''), options, htmlContent: htmlContent || '', images: imagesForBlock(bi) });
      }
      if (reactions.length === 0) { msgDiv.textContent = 'Не удалось распознать реакции.'; return; }
      const id = 'trainer_' + Date.now();
      const siblingsMax = TRAINERS.filter(t => t.topicId === topicId).reduce((m, t) => Math.max(m, t.order), -1);
      const randomOrderMap = randomOrder ? shuffleArray(reactions.map((_, i) => i)) : null;
      TRAINERS.push({ id, topicId, title, order: siblingsMax + 1, mode, taskType, allowModeChoice, randomOrder, reactions, randomOrderMap, fontSize, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: false, isLocked: false, scheduledRelease: null });
      await persistTrainers();
      msgDiv.textContent = `Тренажёр создан с ${reactions.length} реакциями!`; msgDiv.style.color = 'var(--ok)';
      aiImages = []; renderAiImagesPreview();
    } else if (type === 'homework') {
      const tasks = [];
      for (let bi = 0; bi < blocks.length; bi++) {
        const block = blocks[bi];
        const parts = block.split('|').map(p => p.trim());
        if (parts.length < 2) continue;
        const question = parts[0] || '';
        const answer = parts[1] || '';
        const explain = parts[2] || '';
        const optionsStr = parts[4] || '';
        const htmlContent = parts[5] || '';
        if (!question.trim() || !answer.trim()) continue;
        const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
        tasks.push({ question, answer, explanation: explain || '', options, htmlContent: htmlContent || '', images: imagesForBlock(bi) });
      }
      if (tasks.length === 0) { msgDiv.textContent = 'Не удалось распознать задания.'; return; }
      const id = 'homework_' + Date.now();
      const siblingsMax = HOMEWORKS.filter(h => h.topicId === topicId).reduce((m, h) => Math.max(m, h.order), -1);
      const randomOrderMap = randomOrder ? shuffleArray(tasks.map((_, i) => i)) : null;
      HOMEWORKS.push({ id, topicId, title, order: siblingsMax + 1, mode, taskType, allowModeChoice, randomOrder, tasks, randomOrderMap, fontSize, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: false, isLocked: false, scheduledRelease: null });
      await persistHomeworks();
      msgDiv.textContent = `Домашка создана с ${tasks.length} заданиями!`; msgDiv.style.color = 'var(--ok)';
      aiImages = []; renderAiImagesPreview();
    } else if (type === 'lesson') {
      const lines = rawText.split('\n').filter(l => l.trim().length > 0);
      let description = '', videoUrl = '';
      const links = [], files = [];
      for (const line of lines) {
        const lower = line.toLowerCase();
        if (lower.includes('описание:')) description = line.split(':').slice(1).join(':').trim();
        else if (lower.includes('видео:')) videoUrl = line.split(':').slice(1).join(':').trim();
        else if (lower.includes('файл:') || lower.includes('конспект:')) { const parts = line.split(':'); files.push({ label: parts[0].trim() || 'Файл', url: parts.slice(1).join(':').trim() }); }
        else if (line.includes('http')) links.push({ label: 'Видео', url: line.trim() });
      }
      const id = 'lesson_' + Date.now();
      const siblingsMax = LESSONS.filter(l => l.topicId === topicId).reduce((m, l) => Math.max(m, l.order), -1);
      LESSONS.push({ id, topicId, title, order: siblingsMax + 1, description, videoUrl, links, files, assignedTo: assignedTo.length > 0 ? assignedTo : null, isDraft: false, isLocked: false, scheduledRelease: null });
      await persistLessons();
      msgDiv.textContent = 'Урок создан!'; msgDiv.style.color = 'var(--ok)';
    }
    box.querySelector('#aiInput').value = '';
    box.querySelector('#aiTitle').value = '';
    render();
  };
  return box;
}

// 23. ГЕНЕРАЦИЯ «КОДА С ПАЛОЧКАМИ» И БЛОК В РЕДАКТОРАХ
// ============================================================

function buildTrainerSrcText(trainer) {
  const reactions = trainer.reactions || [];
  return reactions.map(r => {
    let answerStr = '';
    if (r.valid && r.correctSetsDisplay && r.correctSetsDisplay.length > 0) {
      if (trainer.taskType === 'checkbox') answerStr = (r.correctSetsDisplay[0] || []).join(', ');
      else answerStr = r.correctSetsDisplay.map(s => s.join(' + ')).join(' / ');
    } else if (!r.valid) answerStr = '0';
    const parts = [
      (r.lhs || '').replace(/\n/g, '\n'),
      answerStr,
      r.explanation || '',
      r.fullEquation || '',
      (r.options || []).join(', '),
      r.htmlContent || ''
    ];
    return parts.join(' | ');
  }).join('\n#\n');
}

function buildHomeworkSrcText(homework) {
  const tasks = homework.tasks || [];
  return tasks.map(t => {
    const parts = [
      t.question || '',
      t.answer || '',
      t.explanation || '',
      '',
      (t.options || []).join(', '),
      t.htmlContent || ''
    ];
    return parts.join(' | ');
  }).join('\n#\n');
}

function buildLessonSrcText(lesson) {
  const lines = [];
  if (lesson.description) lines.push('Описание: ' + lesson.description.replace(/\n/g, ' '));
  if (lesson.videoUrl) lines.push('Видео: ' + lesson.videoUrl);
  (lesson.links || []).forEach(l => { if (l.url) lines.push((l.label || 'Видео') + ': ' + l.url); });
  (lesson.files || []).forEach(f => { if (f.url) lines.push((f.label || 'Файл') + ': ' + f.url); });
  return lines.join('\n');
}

function buildTheorySrcText(theory) {
  const lines = [];
  if (theory.description) lines.push(theory.description);
  if (theory.linkUrl) lines.push('Ссылка: ' + theory.linkUrl);
  return lines.join('\n\n');
}

function renderSrcCodeBlock(container, kind, item) {
  let srcText = '';
  let hint = '';
  if (kind === 'trainer') { srcText = buildTrainerSrcText(item); hint = 'Формат: задание | ответ | пояснение | полное уравнение | варианты | HTML. Блоки разделены строкой «#».'; }
  else if (kind === 'homework') { srcText = buildHomeworkSrcText(item); hint = 'Формат: вопрос | ответ | пояснение | (пусто) | варианты | HTML. Блоки разделены строкой «#».'; }
  else if (kind === 'lesson') { srcText = buildLessonSrcText(item); hint = 'Формат: «Описание: ...», «Видео: ...», «Название: ссылка» — каждая с новой строки.'; }
  else if (kind === 'theory') { srcText = buildTheorySrcText(item); hint = 'Текст теории и ссылка. Можно вставить обратно в ИИ-конструктор.'; }

  if (!srcText.trim()) srcText = '(пока нет данных — добавьте задания и сохраните)';

  const block = document.createElement('div');
  block.className = 'src-code-block';
  block.innerHTML = `
    <div class="src-code-toggle" id="srcToggle">
      <span class="arrow">▶</span>
      <span>Исходный код (для ИИ-конструктора)</span>
    </div>
    <div class="src-code-body">
      <div class="export-hint">${escapeHtml(hint)} Это ровно тот текст, который вы бы вставили в «Быстрое создание с ИИ». Скопируйте его и используйте где угодно — или вставьте в другую платформу через «⤓ Импорт кода».</div>
      <textarea class="src-code-textarea" id="srcCodeText" readonly>${escapeHtml(srcText)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button type="button" class="btn btn-accent btn-sm" id="copySrcBtn">Скопировать</button>
        <button type="button" class="btn btn-ghost btn-sm" id="exportJsonBtn">Экспорт JSON (полный материал)</button>
      </div>
    </div>
  `;
  container.appendChild(block);

  const toggle = block.querySelector('#srcToggle');
  toggle.onclick = () => { block.classList.toggle('open'); };
  block.querySelector('#copySrcBtn').onclick = async () => {
    const ta = block.querySelector('#srcCodeText');
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(ta.value);
      else document.execCommand('copy');
      const btn = block.querySelector('#copySrcBtn');
      btn.textContent = '✓ Скопировано';
      setTimeout(() => { btn.textContent = 'Скопировать'; }, 1500);
    } catch (e) {
      alert('Не удалось скопировать автоматически. Выделите текст и нажмите Ctrl+C.');
    }
  };
  block.querySelector('#exportJsonBtn').onclick = () => {
    window.showExportModal(kind, item.id);
  };
}

function getCorrectAnswerText(kind, item, idx) {
  if (kind === 'trainer') {
    const r = (item.reactions || [])[idx];
    if (!r) return '';
    if (!r.valid) return '0 (реакция не идёт)';
    const ds = (r.correctSetsDisplay && r.correctSetsDisplay.length > 0) ? r.correctSetsDisplay : (r.correctSets || []);
    if (item.taskType === 'checkbox') return (ds[0] || []).join(', ');
    return ds.map(s => s.join(' + ')).join(' / ');
  }
  if (kind === 'homework') {
    const t = (item.tasks || [])[idx];
    if (!t) return '';
    const sets = buildCorrectSets(t.answer || '', item.taskType || 'text');
    if (sets.correctSetsDisplay && sets.correctSetsDisplay[0]) {
      return sets.correctSetsDisplay[0].join(item.taskType === 'checkbox' ? ', ' : ' + ');
    }
    return t.answer || '';
  }
  return '';
}

function buildPrintHtml(kind, item, printMode) {
  const isTrainer = kind === 'trainer';
  const isHomework = kind === 'homework';
  const isTheory = kind === 'theory';
  const isLesson = kind === 'lesson';
  const taskType = item.taskType || 'text';
  const withAnswers = printMode === 'answers' || printMode === 'full';
  const withExplanation = printMode === 'full';

  if (isTheory) {
    let bodyHtml = '';
    if (item.file && item.file.dataUrl && item.file.type && item.file.type.startsWith('image/')) {
      bodyHtml += `<div style="margin:10px 0;"><img src="${item.file.dataUrl}" alt="" style="max-width:100%;border-radius:8px;"></div>`;
    }
    if (item.description) {
      const fs = theoryFontSize(item);
      bodyHtml += `<div style="font-size:${fs}px;line-height:1.65;white-space:pre-wrap;margin:10px 0;">${escapeHtml(item.description)}</div>`;
    }
    if (item.htmlContent) {
      bodyHtml += `<div style="margin:12px 0;">${item.htmlContent}</div>`;
    }
    if (item.linkUrl) {
      bodyHtml += `<div style="margin-top:10px;font-size:13px;">🔗 <a href="${escapeAttr(item.linkUrl)}" style="color:#0a58ca;">${escapeHtml(item.linkUrl)}</a></div>`;
    }
    if (item.file && item.file.dataUrl && !(item.file.type && item.file.type.startsWith('image/'))) {
      const sizeKb = Math.round((item.file.size || 0) / 1024);
      bodyHtml += `<div style="margin-top:10px;font-size:13px;">📎 Файл: ${escapeHtml(item.file.name || 'файл')} (${sizeKb} КБ)</div>`;
    }
    if (!bodyHtml.trim()) bodyHtml = '<div style="color:#777;">Материал не заполнен.</div>';

    return `
      <div class="print-doc" id="printDoc">
        <h1>${escapeHtml(item.title || '')}</h1>
        <div class="print-sub">Теория</div>
        ${bodyHtml}
      </div>
    `;
  }

  if (isLesson) {
    let bodyHtml = '';
    if (item.description) {
      bodyHtml += `<div style="font-size:14.5px;line-height:1.65;white-space:pre-wrap;margin:10px 0;">${escapeHtml(item.description)}</div>`;
    }
    const links = item.links || [];
    const files = item.files || [];
    if (item.videoUrl) {
      bodyHtml += `<div style="margin-top:10px;font-size:14px;">🎬 Основное видео: <a href="${escapeAttr(item.videoUrl)}" style="color:#0a58ca;">${escapeHtml(item.videoUrl)}</a></div>`;
    }
    if (links.length > 0) {
      bodyHtml += `<div style="margin-top:10px;"><b>Видео:</b><ul style="margin:6px 0 0 18px;padding:0;">` +
        links.map(l => `<li style="font-size:14px;">${escapeHtml(l.label || 'Видео')}: <a href="${escapeAttr(l.url)}" style="color:#0a58ca;">${escapeHtml(l.url)}</a></li>`).join('') + `</ul></div>`;
    }
    if (files.length > 0) {
      bodyHtml += `<div style="margin-top:10px;"><b>Файлы:</b><ul style="margin:6px 0 0 18px;padding:0;">` +
        files.map(f => `<li style="font-size:14px;">${escapeHtml(f.label || f.name || 'Файл')}${f.url ? `: <a href="${escapeAttr(f.url)}" style="color:#0a58ca;">${escapeHtml(f.url)}</a>` : ''}</li>`).join('') + `</ul></div>`;
    }
    if (!bodyHtml.trim()) bodyHtml = '<div style="color:#777;">Материалы не добавлены.</div>';

    return `
      <div class="print-doc" id="printDoc">
        <h1>${escapeHtml(item.title || '')}</h1>
        <div class="print-sub">Урок</div>
        ${bodyHtml}
      </div>
    `;
  }

  let tasks = [];
  if (isTrainer) {
    const reactions = item.reactions || [];
    let source = reactions;
    if (item.randomOrderMap && item.randomOrderMap.length === reactions.length) {
      source = item.randomOrderMap.map(i => reactions[i]).filter(Boolean);
    }
    tasks = source.map((r, i) => ({
      question: r.lhs || '',
      images: getTaskImages(r),
      htmlContent: r.htmlContent || '',
      options: r.options || [],
      answer: getCorrectAnswerText('trainer', { ...item, reactions: source }, i),
      explanation: r.explanation || '',
      fullEquation: r.fullEquation || ''
    }));
  } else {
    const src = item.tasks || [];
    let source = src;
    if (item.randomOrderMap && item.randomOrderMap.length === src.length) {
      source = item.randomOrderMap.map(i => src[i]).filter(Boolean);
    }
    tasks = source.map((t, i) => ({
      question: t.question || '',
      images: getTaskImages(t),
      htmlContent: t.htmlContent || '',
      options: t.options || [],
      answer: getCorrectAnswerText('homework', { ...item, tasks: source }, i),
      explanation: t.explanation || '',
      fullEquation: ''
    }));
  }

  const typeLabel = isTrainer ? 'Тренажёр' : 'Домашка';
  const modeLabel = printMode === 'full' ? ' — с ответами и пояснениями'
    : printMode === 'answers' ? ' — с ответами'
    : ' — без ответов';

  let tasksHtml = '';
  tasks.forEach((t, idx) => {
    let optHtml = '';
    if ((taskType === 'radio' || taskType === 'checkbox') && t.options.length > 0) {
      optHtml = '<div class="pt-options">' + t.options.map((o, oi) => `${String.fromCharCode(1040 + oi)}) ${escapeHtml(o)}`).join('&nbsp;&nbsp;&nbsp;') + '</div>';
    }
    let imgsHtml = '';
    if (t.images && t.images.length > 0) {
      imgsHtml = t.images.map(src => `<div><img src="${src}" alt="" style="max-width:100%;max-height:300px;border-radius:6px;margin:6px 0;"></div>`).join('');
    }
    let htmlBlock = '';
    if (t.htmlContent) htmlBlock = `<div style="margin:6px 0;">${t.htmlContent}</div>`;

    let answersBlock = '';
    if (withAnswers) {
      answersBlock += `<div class="pt-answer">Ответ: ${renderEquation(t.answer || '—')}</div>`;
    }
    if (withExplanation) {
      if (t.fullEquation) {
        answersBlock += `<div class="pt-full-eq" style="margin-top:6px;font-size:13.5px;color:#1a1a1a;"><b>Полное уравнение:</b> ${renderEquation(t.fullEquation)}</div>`;
      }
      if (t.explanation) {
        answersBlock += `<div class="pt-explanation" style="margin-top:6px;font-size:13px;color:#444;"><b>Пояснение:</b> ${escapeHtml(t.explanation)}</div>`;
      }
    }

    tasksHtml += `
      <div class="print-task">
        <div class="pt-num">Задание ${idx + 1}</div>
        <div class="pt-body">${renderEquation(t.question)}</div>
        ${imgsHtml}
        ${htmlBlock}
        ${optHtml}
        ${answersBlock}
      </div>
    `;
  });

  return `
    <div class="print-doc" id="printDoc">
      <h1>${escapeHtml(item.title || '')}</h1>
      <div class="print-sub">${typeLabel}${modeLabel} · ${tasks.length} заданий</div>
      ${item.customNote ? `<div style="margin-bottom:14px;font-size:13px;color:#444;border-left:3px solid #ccc;padding-left:10px;">${escapeHtmlMultiline(item.customNote)}</div>` : ''}
      ${tasksHtml || '<div style="color:#777;">Заданий нет.</div>'}
    </div>
  `;
}

window.openPrintModal = function(kind, id) {
  const coll = KIND_META[kind] ? KIND_META[kind].coll() : null;
  if (!coll) return;
  const item = coll.find(x => x.id === id);
  if (!item) { alert('Материал не найден.'); return; }

  const isTheory = kind === 'theory';
  const isLesson = kind === 'lesson';

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <h3>Печать / PDF: ${escapeHtml(item.title)}</h3>
    <p class="warn">${isTheory || isLesson
      ? 'Откроется окно с материалом, затем системное окно печати. Там выберите «Сохранить как PDF».'
      : 'Выберите вариант печати. Откроется системное окно печати — там можно сохранить в PDF.'}</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
      ${(isTheory || isLesson)
        ? `<button class="btn btn-accent" id="printFullBtn">🖨 Открыть и сохранить в PDF</button>`
        : `<button class="btn btn-accent" id="printFullBtn">🖨 С ответами и пояснениями (ответ + пояснение + уравнение)</button>
           <button class="btn btn-ghost" id="printAnswersBtn">🖨 Только с ответами</button>
           <button class="btn btn-ghost" id="printNoneBtn">🖨 Без ответов</button>`}
    </div>
    <div class="actions"><button class="btn btn-ghost" id="cancelPrint">Отмена</button></div>
  `;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  modal.querySelector('#cancelPrint').onclick = () => bg.remove();

  function doPrint(printMode) {
    const html = buildPrintHtml(kind, item, printMode);
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) { alert('Браузер заблокировал окно печати. Разрешите всплывающие окна.'); return; }
    const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');
    printWindow.document.open();
    printWindow.document.write(`<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>${escapeHtml(item.title)}</title>${styles}
      <style>
        body { background:#fff !important; color:#000 !important; font-family:"Manrope",Arial,sans-serif; padding:24px; }
        .print-doc { display:block !important; max-width:800px; margin:0 auto; }
        .print-doc h1 { font-size:24px; margin:0 0 4px; }
        .print-doc .print-sub { font-size:13px; color:#555; margin-bottom:20px; }
        .print-doc .print-task { border:1px solid #ccc; border-radius:8px; padding:14px 16px; margin-bottom:12px; page-break-inside:avoid; }
        .print-doc .print-task .pt-num { font-size:12px; color:#777; margin-bottom:6px; }
        .print-doc .print-task .pt-body { font-size:15px; line-height:1.55; }
        .print-doc .print-task .pt-answer { margin-top:10px; padding-top:8px; border-top:1px dashed #999; font-size:14px; color:#1a7f4b; font-weight:700; }
        .print-doc .print-task .pt-options { margin-top:6px; font-size:13px; color:#444; }
        .print-doc sub { font-size:.65em; }
        .print-doc table { border-collapse:collapse; }
        .print-doc td, .print-doc th { border:1px solid #bbb; padding:6px 10px; }
        @media print { body { padding:0; } .print-doc { max-width:100%; } }
      </style>
      </head><body>${html}<script>setTimeout(function(){window.print();},350);<\/script></body></html>`);
    printWindow.document.close();
    bg.remove();
  }

  modal.querySelector('#printFullBtn').onclick = () => doPrint('full');
  const answersBtn = modal.querySelector('#printAnswersBtn');
  if (answersBtn) answersBtn.onclick = () => doPrint('answers');
  const noneBtn = modal.querySelector('#printNoneBtn');
  if (noneBtn) noneBtn.onclick = () => doPrint('none');
};

  const modal = document.createElement('div');
  modal.className = 'modal';

    <h3>Редактировать теорию</h3>
    <div class="field"><label>Название</label><input type="text" id="editTheoryTitle" value="${escapeAttr(theory.title)}"></div>
    <div class="field"><label>Статус</label>
      <select id="editTheoryStatus">
        <option value="published" ${!theory.isDraft && !theory.isLocked ? 'selected' : ''}>Опубликован</option>
        <option value="draft" ${theory.isDraft ? 'selected' : ''}>Черновик</option>
        <option value="locked" ${theory.isLocked ? 'selected' : ''}>Заблокирован</option>
      </select></div>
    <div class="field"><label>Отложенный выпуск (самарское время)</label>

        <div class="rrb-head"><span>Видео ${i+1}</span>${linkRows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
        <div class="builder-line"><div class="ln-label">1</div><input type="text" data-field="label" data-row="${i}" value="${escapeAttr(r.label||'')}" placeholder="Название"></div>
        <div class="builder-line"><div class="ln-label">2</div><input type="text" data-field="url" data-row="${i}" value="${escapeAttr(r.url||'')}" placeholder="Ссылка"></div>
      </div>
    `).join('');
    cont.querySelectorAll('[data-remove]').forEach(btn => { btn.onclick = () => { syncLinkRowsFromDOM(); linkRows.splice(parseInt(btn.dataset.remove), 1); renderLinkRows(); }; });
  }
  function renderFileRows() {
    const cont = modal.querySelector('#editLessonFiles');
    cont.innerHTML = fileRows.map((r, i) => `
      <div class="rxn-row-builder" data-row="${i}">
        <div class="rrb-head"><span>Файл (ссылка) ${i+1}</span>${fileRows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
        <div class="builder-line"><div class="ln-label">1</div><input type="text" data-field="label" data-row="${i}" value="${escapeAttr(r.label||'')}" placeholder="Название"></div>
        <div class="builder-line"><div class="ln-label">2</div><input type="text" data-field="url" data-row="${i}" value="${escapeAttr(r.url||'')}" placeholder="Ссылка"></div>
      </div>
    `).join('');
    cont.querySelectorAll('[data-remove]').forEach(btn => { btn.onclick = () => { syncFileRowsFromDOM(); fileRows.splice(parseInt(btn.dataset.remove), 1); renderFileRows(); }; });
  }
  function renderAttachedPreview() {
    const preview = modal.querySelector('#editLessonAttachFilePreview');
    if (!attachedFile) { preview.innerHTML = ''; return; }
    const sizeKb = Math.round((attachedFile.size || 0) / 1024);
    preview.innerHTML = `<div class="theory-file-preview"><div class="icon">📎</div><div style="flex:1;"><div class="name">${escapeHtml(attachedFile.name || attachedFile.label || 'Файл')}</div><div class="size">${sizeKb} КБ</div></div><button type="button" class="btn btn-sm btn-ghost" id="rmAttachedFile">Убрать</button></div>`;
    preview.querySelector('#rmAttachedFile').onclick = () => { attachedFile = null; modal.querySelector('#editLessonAttachFile').value = ''; renderAttachedPreview(); };
  }
  renderLinkRows(); renderFileRows(); renderAttachedPreview();
  modal.querySelector('#editAddLessonLink').onclick = () => { syncLinkRowsFromDOM(); linkRows.push({ label: '', url: '' }); renderLinkRows(); };
  modal.querySelector('#editAddLessonFile').onclick = () => { syncFileRowsFromDOM(); fileRows.push({ label: '', url: '' }); renderFileRows(); };
  modal.querySelector('#cancelEditLesson').onclick = () => bg.remove();

  const fileInput = modal.querySelector('#editLessonAttachFile');
  fileInput.onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const dataUrl = await readFileAsDataUrl(f, 900 * 1024); attachedFile = { label: f.name, name: f.name, type: f.type, size: f.size, dataUrl }; renderAttachedPreview(); }
    catch (err) { alert(err.message); fileInput.value = ''; }
  };

  modal.querySelector('#saveEditLesson').onclick = async () => {
    const title = document.getElementById('editLessonTitle').value.trim();
    const description = document.getElementById('editLessonDesc').value;
    const videoUrl = document.getElementById('editLessonVideo').value.trim();
    const status = document.getElementById('editLessonStatus').value;
    const releaseDate = document.getElementById('editLessonRelease').value;
    const assignedTo = Array.from(document.getElementById('editLessonAssign').selectedOptions).map(o => o.value).filter(v => v !== '');
    if (!title) { alert('Введите название'); return; }
    const links = [...modal.querySelectorAll('#editLessonLinks .rxn-row-builder')].map(row => ({ label: row.querySelector('[data-field="label"]').value.trim() || 'Видео', url: row.querySelector('[data-field="url"]').value.trim() })).filter(l => l.url);
    const files = [...modal.querySelectorAll('#editLessonFiles .rxn-row-builder')].map(row => ({ label: row.querySelector('[data-field="label"]').value.trim() || 'Файл', url: row.querySelector('[data-field="url"]').value.trim() })).filter(f => f.url);
    if (attachedFile) files.push(attachedFile);
    lesson.title = title;
    lesson.description = description;
    lesson.videoUrl = videoUrl;
    lesson.isDraft = status === 'draft';
    lesson.isLocked = status === 'locked';
    lesson.scheduledRelease = releaseDate ? getSamaraTimestamp(releaseDate) : null;
    lesson.assignedTo = assignedTo.length > 0 ? assignedTo : null;
    lesson.links = links;
    lesson.files = files;
    await persistLessons();
    bg.remove();
    render();
  };
}
    function openEditHomeworkModal(homeworkId) {
      const homework = HOMEWORKS.find(h => h.id === homeworkId);
      if (!homework) return;
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <h3>Редактировать домашку</h3>
        <div class="field"><label>Название</label><input type="text" id="editHomeworkTitle" value="${escapeAttr(homework.title)}"></div>
        <div class="field"><label>Режим</label>
          <select id="editHomeworkMode">
            <option value="step" ${homework.mode === 'step' ? 'selected' : ''}>Пошагово</option>
            <option value="list" ${homework.mode === 'list' || !homework.mode ? 'selected' : ''}>Список</option>
            <option value="cards" ${homework.mode === 'cards' ? 'selected' : ''}>Карты</option>
          </select></div>
        <div class="field"><label>Тип заданий</label>
          <select id="editHomeworkTaskType">
            <option value="text" ${homework.taskType === 'text' || !homework.taskType ? 'selected' : ''}>Ввод текста</option>
            <option value="radio" ${homework.taskType === 'radio' ? 'selected' : ''}>Один вариант</option>
            <option value="checkbox" ${homework.taskType === 'checkbox' ? 'selected' : ''}>Несколько вариантов</option>
          </select></div>
        <div class="field"><label style="font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;"><input type="checkbox" id="editHomeworkAllowModeChoice" ${homework.allowModeChoice ? 'checked' : ''}> Разрешить ученику выбирать режим</label></div>
        <div class="field"><label style="font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;"><input type="checkbox" id="editHomeworkRandomOrder" ${homework.randomOrder ? 'checked' : ''}> Перемешать задания в случайном порядке</label></div>
        ${fontStepperHtml('editHomeworkFontSize', homework.fontSize, DEFAULT_TASK_FONT_SIZE, 'Размер шрифта задания (общий)')}
        <div class="field"><label>Статус</label>
          <select id="editHomeworkStatus">
            <option value="published" ${!homework.isDraft && !homework.isLocked ? 'selected' : ''}>Опубликован</option>
            <option value="draft" ${homework.isDraft ? 'selected' : ''}>Черновик</option>
            <option value="locked" ${homework.isLocked ? 'selected' : ''}>Заблокирован</option>
          </select></div>
        <div class="field"><label>Отложенный выпуск (самарское время)</label><input type="datetime-local" id="editHomeworkRelease" value="${homework.scheduledRelease ? getSamaraDateString(homework.scheduledRelease) : ''}"></div>
        <div class="field"><label>Примечание</label><textarea id="editHomeworkNote" rows="2" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font-family:inherit;font-size:14px;background:var(--bg);color:var(--ink);">${escapeHtml(homework.customNote || '')}</textarea></div>
        <div class="field"><label style="font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;"><input type="checkbox" id="editHomeworkKeepNote" ${homework.keepNote ? 'checked' : ''}> Не скрывать примечание после 1-го задания</label></div>
        <div class="field"><label>Прикрепить картинку к примечанию (до 900 КБ)</label><input type="file" id="editHomeworkNoteImage" accept="image/*"></div>
        <div id="editHomeworkNoteImagePreview"></div>
        <div class="field"><label>Доступно для учеников</label>
          <select id="editHomeworkAssign" multiple style="height:80px;">
            <option value="">Все ученики</option>
            ${allStudents.map(s => `<option value="${s}" ${homework.assignedTo && homework.assignedTo.includes(s) ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
          </select></div>
        <div id="editHomeworkRows"></div>
        <button type="button" class="add-line-btn" id="editAddHomeworkBtn">+ Добавить задание</button>
        <div id="editHomeworkSrcCodeSlot"></div>
        <div class="actions">
          <button class="btn btn-ghost" id="cancelEditHomework">Отмена</button>
          <button class="btn btn-accent" id="saveEditHomework">Сохранить</button>
        </div>
      `;
      bg.appendChild(modal);
      document.body.appendChild(bg);
      bindFontSteppers(modal);
      renderSrcCodeBlock(modal.querySelector('#editHomeworkSrcCodeSlot'), 'homework', homework);

      bg.onclick = (e) => { if (e.target === bg) bg.remove(); };

      let currentNoteImage = homework.noteImage || null;
      const noteImageInput = modal.querySelector('#editHomeworkNoteImage');
      const noteImagePreview = modal.querySelector('#editHomeworkNoteImagePreview');
      function renderNoteImagePreview() {
        if (currentNoteImage) {
          noteImagePreview.innerHTML = `<div class="theory-file-preview"><img src="${currentNoteImage}" alt="" style="max-height:80px;"><button type="button" class="btn btn-sm btn-ghost" id="rmNoteImage">Убрать</button></div>`;
          noteImagePreview.querySelector('#rmNoteImage').onclick = () => { currentNoteImage = null; noteImageInput.value = ''; renderNoteImagePreview(); };
        } else { noteImagePreview.innerHTML = ''; }
      }
      renderNoteImagePreview();
      noteImageInput.onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        try { currentNoteImage = await compressTaskImageToDataUrl(f); renderNoteImagePreview(); }
        catch (err) { alert('Не удалось загрузить картинку: ' + err.message); noteImageInput.value = ''; }
      };

      let rows = homework.tasks ? homework.tasks.map(t => ({ ...t, images: getTaskImages(t), html: t.htmlContent || '', rowFontSize: t.fontSize || '' })) : [{ question: '', answer: '', explanation: '', options: [], images: [], html: '', rowFontSize: '' }];

      function syncRowsFromDOM() {
        const cont = modal.querySelector('#editHomeworkRows'); if (!cont) return;
        [...cont.querySelectorAll('.rxn-row-builder')].forEach((rowEl, i) => {
          if (!rows[i]) return;
          rows[i].question = rowEl.querySelector('[data-field="question"]').value;
          rows[i].answer = rowEl.querySelector('[data-field="answer"]').value;
          rows[i].explanation = rowEl.querySelector('[data-field="explain"]').value;
          rows[i].options = rowEl.querySelector('[data-field="options"]')?.value || '';
          rows[i].html = rowEl.querySelector('[data-field="html"]')?.value || '';
          rows[i].rowFontSize = rowEl.querySelector('[data-field="rowfont"]')?.value || '';
        });
      }
      function refreshRowImagePreview(cont, i) {
        const rowEl = cont.querySelector(`.rxn-row-builder[data-row="${i}"]`); if (!rowEl) return;
        const imgRow = rowEl.querySelector('.img-row'); if (!imgRow) return;
        let pb = imgRow.querySelector('.task-image-preview-list');
        if (!pb) { pb = document.createElement('div'); pb.className = 'task-image-preview-list'; imgRow.querySelector('div').insertBefore(pb, imgRow.querySelector('div').firstChild); }
        pb.innerHTML = buildImagePreviewHtml(rows[i].images, i, 'hw-image-remove');
        pb.querySelectorAll('.hw-image-remove').forEach(btn => {
          btn.onclick = () => { syncRowsFromDOM(); const ri = parseInt(btn.dataset.row); const imgIdx = parseInt(btn.dataset.imgidx); rows[ri].images.splice(imgIdx, 1); refreshRowImagePreview(cont, ri); };
        });
      }
      function renderRows() {
        const cont = modal.querySelector('#editHomeworkRows');
        cont.innerHTML = rows.map((r, i) => `
          <div class="rxn-row-builder" data-row="${i}">
            <div class="rrb-head"><span>Задание ${i+1}</span>${rows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
            <div class="builder-line"><div class="ln-label">1</div><textarea data-field="question" data-row="${i}" placeholder="Вопрос" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);resize:vertical;min-height:50px;">${escapeHtml(r.question||'')}</textarea></div>
            <div class="builder-line"><div class="ln-label">2</div><textarea data-field="answer" data-row="${i}" placeholder="Правильный ответ" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);resize:vertical;min-height:50px;">${escapeHtml(r.answer||'')}</textarea></div>
            <div class="builder-line"><div class="ln-label">3</div><input type="text" data-field="explain" data-row="${i}" value="${escapeAttr(r.explanation||'')}" placeholder="Пояснение"></div>
            <div class="builder-line"><div class="ln-label">4</div><input type="text" data-field="options" data-row="${i}" value="${escapeAttr(r.options ? r.options.join(',') : '')}" placeholder="Варианты"></div>
            <div class="builder-line"><div class="ln-label">HTML</div><textarea data-field="html" data-row="${i}" placeholder="HTML-код" style="flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-family:monospace;font-size:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:40px;">${escapeHtml(r.html)}</textarea></div>
            <div class="builder-line"><div class="ln-label">Aa</div><input type="number" min="8" max="96" step="1" data-field="rowfont" data-row="${i}" value="${escapeAttr(r.rowFontSize||'')}" placeholder="Размер шрифта этого задания (пусто = общий)" style="max-width:320px;"></div>
            <div class="builder-line img-row" data-row="${i}">
              <div class="ln-label">5</div>
              <div style="flex:1;"><div class="task-image-preview-list">${buildImagePreviewHtml(r.images, i, 'hw-image-remove')}</div><input type="file" accept="image/*" multiple class="hw-image-input" data-row="${i}"></div>
            </div>
          </div>
        `).join('');
        cont.querySelectorAll('[data-remove]').forEach(btn => { btn.onclick = () => { syncRowsFromDOM(); rows.splice(parseInt(btn.dataset.remove), 1); renderRows(); }; });
        cont.querySelectorAll('.hw-image-input').forEach(inp => {
          inp.onchange = async (e) => {
            const files = Array.from(e.target.files); if (!files.length) return;
            const i = parseInt(inp.dataset.row); syncRowsFromDOM();
            if (!rows[i].images) rows[i].images = [];
            for (const file of files) { try { rows[i].images.push(await compressTaskImageToDataUrl(file)); } catch (err) { alert('Не удалось загрузить "' + file.name + '": ' + err.message); } }
            refreshRowImagePreview(cont, i); inp.value = '';
          };
        });
        cont.querySelectorAll('.hw-image-remove').forEach(btn => {
          btn.onclick = () => { syncRowsFromDOM(); const i = parseInt(btn.dataset.row); const imgIdx = parseInt(btn.dataset.imgidx); rows[i].images.splice(imgIdx, 1); refreshRowImagePreview(cont, i); };
        });
      }
      renderRows();
      modal.querySelector('#editAddHomeworkBtn').onclick = () => { syncRowsFromDOM(); rows.push({ question: '', answer: '', explanation: '', options: [], images: [], html: '', rowFontSize: '' }); renderRows(); };
      modal.querySelector('#cancelEditHomework').onclick = () => bg.remove();

      modal.querySelector('#saveEditHomework').onclick = async () => {
        const title = document.getElementById('editHomeworkTitle').value.trim();
        const mode = document.getElementById('editHomeworkMode').value;
        const taskType = document.getElementById('editHomeworkTaskType').value;
        const allowModeChoice = document.getElementById('editHomeworkAllowModeChoice').checked;
        const randomOrder = document.getElementById('editHomeworkRandomOrder').checked;
        const status = document.getElementById('editHomeworkStatus').value;
        const releaseDate = document.getElementById('editHomeworkRelease').value;
        const customNote = document.getElementById('editHomeworkNote').value.trim();
        const keepNote = document.getElementById('editHomeworkKeepNote').checked;
        const assignedTo = Array.from(document.getElementById('editHomeworkAssign').selectedOptions).map(o => o.value).filter(v => v !== '');
        const fontSize = normalizeFontSize(document.getElementById('editHomeworkFontSize')?.value, DEFAULT_TASK_FONT_SIZE);
        if (!title) { alert('Введите название'); return; }
        const domRows = [...modal.querySelectorAll('#editHomeworkRows .rxn-row-builder')];
        const tasks = [];
        for (let i = 0; i < domRows.length; i++) {
          const row = domRows[i];
          const question = row.querySelector('[data-field="question"]').value;
          const answer = row.querySelector('[data-field="answer"]').value;
          const explain = row.querySelector('[data-field="explain"]').value;
          const optionsStr = row.querySelector('[data-field="options"]')?.value.trim() || '';
          const htmlContent = row.querySelector('[data-field="html"]')?.value || '';
          const rowFontRaw = row.querySelector('[data-field="rowfont"]')?.value || '';
          const rowFontSize = rowFontRaw ? normalizeFontSize(rowFontRaw, null) : null;
          const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
          const images = (rows[i] && rows[i].images) || [];
          if (!question.trim() || !answer.trim()) continue;
          tasks.push({ question, answer, explanation: explain || '', options, images, htmlContent, fontSize: rowFontSize });
        }
        if (tasks.length === 0) { alert('Добавьте хотя бы одно задание'); return; }
        homework.title = title;
        homework.mode = mode;
        homework.taskType = taskType;
        homework.allowModeChoice = allowModeChoice;
        homework.randomOrder = randomOrder;
        homework.randomOrderMap = randomOrder ? shuffleArray(tasks.map((_, i) => i)) : null;
        homework.fontSize = fontSize;
        homework.isDraft = status === 'draft';
        homework.isLocked = status === 'locked';
        homework.scheduledRelease = releaseDate ? getSamaraTimestamp(releaseDate) : null;
        homework.customNote = customNote || '';
        homework.keepNote = keepNote;
        homework.noteImage = currentNoteImage;
        homework.assignedTo = assignedTo.length > 0 ? assignedTo : null;
        homework.tasks = tasks;
        await persistHomeworks();
        bg.remove();
        render();
      };
    }

    // ============================================================
    // 25. ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') window.handleLogin(); });
    document.getElementById('loginName').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });

    (async function init() {
      await loadPlatforms();
      loadActivePlatform();
      const restored = tryRestoreSession();
      if (restored) {
        if (CURRENT_USER && !CURRENT_USER.isTeacher) {
          const reg = await loadRegistry();
          if (!reg[CURRENT_USER.key]) { handleLogout(); return; }
        }
        renderPlatformsBar();
        await startApp();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        renderPlatformsBar();
      }
    })();

    console.log('Платформа успешно загружена!');
  </script>
</body>
</html>
