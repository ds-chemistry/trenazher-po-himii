<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Химия. Тренажёры</title>

  <!-- Подключаем Firebase SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js"
      }
    }
  </script>

  <style>
    /* ===== ТВОЙ ДИЗАЙН ===== */
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #14181f;
      --ink-soft: #5b6472;
      --line: #e4e7ec;
      --accent: #2955ff;
      --accent-ink: #ffffff;
      --ok: #1a9f6c;
      --ok-bg: #e7f8f1;
      --bad: #e0473a;
      --bad-bg: #fdeceb;
      --shadow: 0 1px 2px rgba(20,24,31,.04), 0 8px 24px rgba(20,24,31,.06);
      --radius: 16px;
      --radius-sm: 10px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .hidden {
      display: none !important;
    }
    .eqx sub {
      font-size: .64em;
      position: relative;
      bottom: -0.15em;
    }
    .eqx {
      white-space: normal;
      word-break: break-word;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -.01em;
      cursor: pointer;
    }
    .brand .mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }
    .mode-banner {
      background: #fff3d6;
      border-bottom: 1px solid #f0d998;
      color: #7a5c10;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .userbox {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .userbox .who {
      font-weight: 600;
      color: var(--ink);
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease, background .15s ease;
      font-family: inherit;
    }
    .btn:active {
      transform: scale(.97);
    }
    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--ink);
      color: #fff;
    }
    .btn-primary:hover {
      background: #000;
    }
    .btn-accent {
      background: var(--accent);
      color: #fff;
    }
    .btn-accent:hover {
      opacity: .92;
    }
    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover {
      background: var(--bg);
    }
    .btn-danger {
      background: var(--bad-bg);
      color: var(--bad);
    }
    .btn-danger:hover {
      opacity: .85;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12.5px;
      border-radius: 8px;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }
    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .icon-btn.danger:hover {
      border-color: var(--bad);
      color: var(--bad);
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }
    .login-card .mark-lg {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .login-card h1 {
      font-size: 21px;
      margin: 0 0 6px;
      letter-spacing: -.02em;
    }
    .login-card p.sub {
      margin: 0 0 26px;
      color: var(--ink-soft);
      font-size: 13.5px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .field input,
    .field select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 14.5px;
      font-family: inherit;
      background: #fbfbfc;
      transition: border .15s;
    }
    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }
    .login-card .btn {
      width: 100%;
      padding: 12px;
      font-size: 14.5px;
      margin-top: 6px;
    }
    .login-err {
      color: var(--bad);
      font-size: 12.5px;
      margin-top: 10px;
      min-height: 16px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 22px 80px;
    }
    .page-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: 0 0 4px;
    }
    .page-sub {
      color: var(--ink-soft);
      font-size: 14px;
      margin: 0 0 28px;
    }

    .maintabs {
      display: flex;
      gap: 8px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }
    .maintab {
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-soft);
      border: 1px solid transparent;
    }
    .maintab.active {
      background: var(--ink);
      color: #fff;
    }
    .maintab:not(.active):hover {
      background: var(--surface);
      border-color: var(--line);
    }

    .topic-block {
      margin-bottom: 8px;
    }
    .topic-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 26px 0 12px;
    }
    .topic-block-head .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topic-block-head h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 0;
    }
    .topic-edit-controls {
      display: flex;
      gap: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 20px;
      cursor: pointer;
      transition: box-shadow .15s ease, transform .1s ease, border-color .15s;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      box-shadow: var(--shadow);
      border-color: transparent;
      transform: translateY(-1px);
    }
    .card .kind {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .card .kind.lesson {
      color: #a06b1f;
    }
    .card .kind.homework {
      color: #b35a9e;
    }
    .card h3 {
      font-size: 16px;
      margin: 0 0 8px;
      letter-spacing: -.01em;
      line-height: 1.3;
    }
    .card .meta {
      font-size: 12.5px;
      color: var(--ink-soft);
    }
    .card .progress-bar {
      height: 5px;
      border-radius: 3px;
      background: var(--line);
      margin-top: 14px;
      overflow: hidden;
    }
    .card .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .3s;
    }
    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-edit-row {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .card-edit-row .icon-btn {
      flex: 1;
      width: auto;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-soft);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 8px 4px;
    }
    .back-btn:hover {
      color: var(--ink);
    }
    .trainer-head {
      margin-bottom: 22px;
    }
    .trainer-head h2 {
      font-size: 23px;
      margin: 0 0 8px;
      letter-spacing: -.02em;
    }
    .trainer-note {
      background: #fff8e8;
      border: 1px solid #f0dfa8;
      color: #7a5c10;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .trainer-summary {
      display: flex;
      gap: 18px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--ink-soft);
      flex-wrap: wrap;
    }
    .trainer-summary b {
      color: var(--ink);
    }

    .rxn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rxn-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 22px;
    }
    .rxn-card.state-correct {
      border-color: #bfe8d5;
    }
    .rxn-card.state-wrong {
      border-color: #f3c6c1;
    }
    .rxn-num {
      font-size: 11.5px;
      color: var(--ink-soft);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .rxn-eq {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.01em;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .rxn-input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .rxn-input {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      font-size: 15px;
      font-family: inherit;
      background: #fbfbfc;
    }
    .rxn-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }
    .rxn-card.state-correct .rxn-input {
      border-color: var(--ok);
      background: var(--ok-bg);
    }
    .rxn-card.state-wrong .rxn-input {
      border-color: var(--bad);
      background: var(--bad-bg);
    }
    .rxn-feedback {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rxn-feedback.ok {
      color: var(--ok);
    }
    .rxn-feedback.bad {
      color: var(--bad);
    }
    .rxn-explain {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.6;
    }
    .rxn-explain b {
      color: var(--ink);
      font-weight: 700;
    }
    .rxn-explain .full-eq {
      font-size: 16px;
      color: var(--ink);
      font-weight: 600;
      margin-top: 4px;
    }
    .rxn-explain .user-given {
      font-size: 12.5px;
      margin-top: 6px;
      color: var(--ink-soft);
    }

    .trainer-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-top: 28px;
    }
    .finish-hint {
      font-size: 12.5px;
      color: var(--ink-soft);
      text-align: center;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .student-row {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .student-row:hover {
      border-color: var(--accent);
    }
    .student-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .student-name {
      font-weight: 700;
      font-size: 15px;
    }
    .student-meta {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 3px;
    }
    .student-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .student-detail {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
    }
    .topic-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      gap: 16px;
    }
    .topic-row:last-child {
      border-bottom: none;
    }
    .topic-name {
      font-size: 14px;
      font-weight: 600;
    }
    .topic-stats {
      font-size: 12.5px;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .mini-bar {
      width: 120px;
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      background: var(--accent);
    }

    .add-student-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }
    .add-student-box h3 {
      margin: 0 0 14px;
      font-size: 15px;
    }
    .add-student-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .add-student-row input {
      flex: 1;
      min-width: 160px;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 14px;
    }
    .add-student-row input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .add-err {
      color: var(--bad);
      font-size: 12.5px;
      margin-top: 8px;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 31, .45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 26px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow);
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal h3 {
      margin: 0 0 14px;
      font-size: 17px;
    }
    .modal .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .modal p.warn {
      color: var(--ink-soft);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .lesson-video-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lesson-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
      transition: border-color .15s;
    }
    .lesson-link:hover {
      border-color: var(--accent);
    }
    .empty-note {
      color: var(--ink-soft);
      font-size: 13.5px;
      padding: 20px 0;
      text-align: center;
    }

    .builder-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .builder-box h3 {
      margin: 0 0 14px;
      font-size: 15px;
    }
    .builder-box .field-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .builder-box .field-row input,
    .builder-box .field-row select {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 13.5px;
    }
    .builder-box .field-row textarea {
      flex: 1;
      min-width: 300px;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 13.5px;
      resize: vertical;
      min-height: 100px;
    }
    .builder-box .field-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .ai-builder-box {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .ai-builder-box h3 {
      margin: 0 0 14px;
      font-size: 15px;
      color: var(--accent);
    }
    .ai-builder-box .field-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .ai-builder-box .field-row input,
    .ai-builder-box .field-row select {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 13.5px;
    }
    .ai-builder-box .field-row textarea {
      flex: 1;
      min-width: 300px;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 13.5px;
      resize: vertical;
      min-height: 120px;
    }
    .ai-builder-box .field-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .builder-line {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .builder-line .ln-label {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      flex-shrink: 0;
    }
    .builder-line input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 13.5px;
      min-width: 0;
    }
    .builder-line input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .rxn-row-builder {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fbfbfc;
    }
    .rxn-row-builder .rrb-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .rxn-row-builder .rrb-head span {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
    }
    small.help {
      color: var(--ink-soft);
      font-size: 12px;
      display: block;
      margin: 4px 0 12px;
      line-height: 1.5;
    }
    .add-line-btn {
      background: none;
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 9px 14px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }
    .add-line-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 14px 60px;
      }
      .rxn-eq {
        font-size: 17px;
      }
      .login-card {
        padding: 30px 24px;
      }
      .topic-block-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .student-row-top {
        flex-direction: column;
        align-items: stretch;
      }
      .student-actions {

  <script type="module">
    // ============================================================

    import { initializeApp } from "firebase/app";

    // ТВОЙ КОНФИГ (вставь свои данные)
    const firebaseConfig = {

    // ============================================================
    // 2. ИМПОРТ ВСЕХ ФУНКЦИЙ ИЗ СТАРОГО КОДА В ГЛОБАЛЬНУЮ ОБЛАСТЬ
    //    (чтобы они были доступны из onclick)

    // Сохраним ссылку на db в window, чтобы использовать в старых функциях
    window.__db = db;
    window.__ref = ref;
    window.__set = set;
    window.__get = get;
    window.__update = update;
    window.__remove = remove;

    window.__onValue = onValue;

    // Также импортируем все старые функции и данные
    // Вместо localStorage будем использовать Firebase.

    // 3. ОСНОВНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================

    const TEACHER_LOGIN = 'admin';

    let CURRENT_USER = null;
    let TEACH_MODE = false;

    // --- Вспомогательные функции ---
    function getDataRef(path) {
      return ref(db, path);
    }

    async function loadFromFirebase(path, defaultValue) {
      try {
        const snapshot = await get(ref(db, path));
        if (snapshot.exists()) {
          return snapshot.val();
        } else {
          // Если данных нет, сохраняем дефолт
          await set(ref(db, path), defaultValue);
          return defaultValue;
        }
      } catch (e) {
        console.error('Ошибка загрузки из Firebase:', e);
        return defaultValue;
      }
    }

    async function saveToFirebase(path, data) {
      try {
        await set(ref(db, path), data);
        return true;
      } catch (e) {
        console.error('Ошибка сохранения в Firebase:', e);
        return false;
      }
    }

    // --- Регистрация учеников ---
    async function loadRegistry() {
      const reg = await loadFromFirebase('registry', {
        'anna': { name: 'Анна', password: 'anna123', createdAt: Date.now() },
        'maxim': { name: 'Максим', password: 'maxim123', createdAt: Date.now() + 1 },
        'elena': { name: 'Елена', password: 'elena123', createdAt: Date.now() + 2 }
      });
      return reg;
    }

    async function saveRegistry(reg) {
      return await saveToFirebase('registry', reg);
    }

    // --- Сессия ---
    async function loadSession() {
      const session = await loadFromFirebase('session', null);
      return session;
    }

    async function saveSession(s) {
      if (s === null) {
        await remove(ref(db, 'session'));
      } else {
        await saveToFirebase('session', s);
      }
    }

    // --- Прогресс ученика ---
    function getProgressPath(studentKey) {
      return `progress/${studentKey}`;
    }

    async function getProgress(studentKey) {
      const data = await loadFromFirebase(getProgressPath(studentKey), {});
      return data;
    }

    async function persistFullProgress(studentKey, progress) {
      await saveToFirebase(getProgressPath(studentKey), progress);
    }

    // --- Контент ---
    function getContentPath(type) {
      return `content/${type}`;
    }

    // Загрузка контента
    async function loadContent() {
      TOPICS = await loadFromFirebase(getContentPath('topics'), defaultTopics());
      TRAINERS = await loadFromFirebase(getContentPath('trainers'), defaultTrainers());
      LESSONS = await loadFromFirebase(getContentPath('lessons'), defaultLessons());
      HOMEWORKS = await loadFromFirebase(getContentPath('homeworks'), defaultHomeworks());

      // Нормализация order
      TOPICS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
      TRAINERS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
      LESSONS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
      HOMEWORKS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
    }

    async function persistTopics() { await saveToFirebase(getContentPath('topics'), TOPICS); }
    async function persistTrainers() { await saveToFirebase(getContentPath('trainers'), TRAINERS); }
    async function persistLessons() { await saveToFirebase(getContentPath('lessons'), LESSONS); }
    async function persistHomeworks() { await saveToFirebase(getContentPath('homeworks'), HOMEWORKS); }

    // ============================================================
    // 5. ДЕФОЛТНЫЙ КОНТЕНТ
    // ============================================================

    function defaultTopics() {

    }

    function defaultTrainers() {

            ], explanation: 'Основный оксид реагирует с кислотным оксидом с образованием соли.', fullEquation: 'CaO + CO2 = CaCO3' },
          { lhs: 'ZnO + C →', valid: true, correctSets: [

          { lhs: 'NaOH + HCl →', valid: true, correctSets: [

    }

    function defaultLessons() {
      return [
        { id: 'lesson_oxides_1', topicId: 'oxides', title: 'Видеоурок: Оксиды — классификация и свойства', order: 0,
          links: [] },
      ];
    }

    function defaultHomeworks() {
      return [];

    // ============================================================
    // 6. ВСЕ ОСТАЛЬНЫЕ ФУНКЦИИ (из твоего кода, но с заменой localStorage на Firebase)
    // ============================================================

    // --- Вспомогательные функции ---
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escapeAttr(s) {
      return (s || '').replace(/"/g, '&quot;');
    }

    function renderEquation(str) {
      if (!str) return '';
      let out = '';
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (/\d/.test(ch)) {
          const prev = i > 0 ? str[i - 1] : '';
          if (/[A-Za-zА-Яа-я\)\]]/.test(prev)) {
            out += '<sub>' + ch + '</sub>';
            continue;
          }
        }
        out += escapeHtmlChar(ch);
      }
      return out;
    }

    function escapeHtmlChar(ch) {
      if (ch === '<') return '&lt;';
      if (ch === '>') return '&gt;';
      if (ch === '&') return '&amp;';
      return ch;
    }

    function normalizeToken(t) {
      return t.trim().toUpperCase().replace(/\s+/g, '');
    }

    function splitProducts(str) {
      return str.split('+').map(s => normalizeToken(s)).filter(s => s.length > 0);
    }

    function arraysEqualAsSets(a, b) {
      if (a.length !== b.length) return false;
      const sa = [...a].sort();
      const sb = [...b].sort();
      return sa.every((v, i) => v === sb[i]);
    }

    function checkAnswer(reaction, userInput) {
      const raw = (userInput || '').trim();
      if (!reaction.valid) {
        const norm = raw.replace(/\s+/g, '');
        return (norm === '0' || norm === '-' || norm.toUpperCase() === 'НЕТ' || norm.toUpperCase() === 'НЕ ИДЕТ' || norm
          .toUpperCase() === 'НЕ ИДЁТ');
      }
      if (raw.length === 0) return false;
      const userProducts = splitProducts(raw);
      for (const correctSet of reaction.correctSets) {
        const normalizedCorrect = correctSet.map(normalizeToken);
        if (arraysEqualAsSets(userProducts, normalizedCorrect)) return true;
      }
      return false;
    }

    // --- Auth ---
    window.handleLogin = async function() {
      const nameInput = document.getElementById('loginName').value.trim();
      const passInput = document.getElementById('loginPass').value;
      const errBox = document.getElementById('loginErr');
      errBox.textContent = '';

      if (!nameInput || !passInput) { errBox.textContent = 'Введите имя и пароль.'; return; }

      if (nameInput.toLowerCase() === TEACHER_LOGIN && passInput === TEACHER_PASS) {
        CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true };
        TEACH_MODE = false;
        await saveSession({ key: '__teacher__', isTeacher: true, name: 'Учитель' });
        await startApp();
        return;
      }

      const reg = await loadRegistry();
      const key = nameInput.toLowerCase();

      if (!reg[key]) {
        errBox.textContent = 'Такого ученика нет. Обратитесь к учителю, чтобы вас добавили.';
        return;
      }
      if (reg[key].password !== passInput) {
        errBox.textContent = 'Неверный пароль.';
        return;
      }
      CURRENT_USER = { name: reg[key].name, key, isTeacher: false };
      await saveSession({ key, isTeacher: false, name: CURRENT_USER.name });
      await startApp();
    };

    window.handleLogout = async function() {
      await saveSession(null);
      CURRENT_USER = null;
      TEACH_MODE = false;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginName').value = '';
      document.getElementById('loginPass').value = '';
    };

    async function tryRestoreSession() {
      const s = await loadSession();
      if (!s) return false;
      if (s.isTeacher) {
        CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true };
      } else {
        const reg = await loadRegistry();
        if (!reg[s.key]) return false;
        CURRENT_USER = { name: reg[s.key].name, key: s.key, isTeacher: false };
      }
      await startApp();
      return true;
    }

    window.enterTeachMode = function() {
      TEACH_MODE = true;
      VIEW = { name: 'home' };
      render();
      updateChrome();
    };

    window.exitTeachMode = function() {
      TEACH_MODE = false;
      VIEW = { name: 'home' };
      render();
      updateChrome();
    };

    function updateChrome() {
      const banner = document.getElementById('teachModeBanner');
      const exitBtn = document.getElementById('exitTeachModeBtn');
      if (TEACH_MODE) {
        banner.classList.remove('hidden');
        exitBtn.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
        exitBtn.classList.add('hidden');
      }
    }

    function actingAsStudent() {
      return !CURRENT_USER.isTeacher || TEACH_MODE;
    }

    function isManaging() {
      return CURRENT_USER.isTeacher && !TEACH_MODE;
    }

    async function startApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('whoLabel').textContent = CURRENT_USER.name + (CURRENT_USER.isTeacher ? ' · учитель' : '');
      await loadContent();
      VIEW = { name: 'home' };
      updateChrome();
      render();
    }

    window.goHome = function() {
      VIEW = { name: 'home' };
      render();
    };

    // --- Рендеринг ---
    function render() {
      const c = document.getElementById('mainContainer');
      c.innerHTML = '';
      if (VIEW.name === 'home') renderHome(c);
      else if (VIEW.name === 'trainer') renderTrainer(c, VIEW.trainerId);
      else if (VIEW.name === 'homework') renderHomework(c, VIEW.homeworkId);
      else if (VIEW.name === 'lesson') renderLessonModal(VIEW.lessonId);
      else if (VIEW.name === 'stats') renderStats(c);
      else if (VIEW.name === 'studentDetail') renderStudentDetail(c, VIEW.studentKey);
    }

    // ДАЛЕЕ ВСТАВЛЯЕМ ВСЕ ФУНКЦИИ ИЗ ТВОЕГО КОДА

    // ----------------------------------------------

    // Основные замены:

    // - loadSession()        -> await loadFromFirebase('session', null)
