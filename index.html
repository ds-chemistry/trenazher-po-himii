<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Химия. Тренажёры</title>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js"
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #14181f;
      --ink-soft: #5b6472;
      --line: #e4e7ec;
      --accent: #14181f;
      --accent-hover: #000000;
      --accent-ink: #ffffff;
      --ok: #1a9f6c;
      --ok-bg: #e7f8f1;
      --bad: #e0473a;
      --bad-bg: #fdeceb;
      --shadow: 0 1px 2px rgba(20,24,31,.04), 0 8px 24px rgba(20,24,31,.06);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.2s ease;
      --card-flip-bg: #f0f4ff;
      font-family: "Manrope", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --ink: #b0b8c4;
      --ink-soft: #8b949e;
      --line: #30363d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      --accent: #c9d1d9;
      --accent-hover: #e6edf3;
      --card-flip-bg: #1c2333;
    }

    [data-theme="dark"] .card { background: var(--surface); }
    [data-theme="dark"] .rxn-card { background: var(--surface); }
    [data-theme="dark"] .modal { background: var(--surface); }
    [data-theme="dark"] .rxn-input { background: var(--bg); }
    [data-theme="dark"] .builder-box,
    [data-theme="dark"] .ai-builder-box { background: var(--surface); }
    [data-theme="dark"] .maintab.active { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .maintab:not(.active):hover { background: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .btn-primary { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .btn-primary:hover { background: var(--bg); }
    [data-theme="dark"] .btn-accent { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .btn-accent:hover { background: var(--bg); }
    [data-theme="dark"] .plat-btn.active { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .trainer-mode-selector .btn.active { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .flash-card { background: var(--surface); border-color: var(--line); }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }
    .hidden { display: none !important; }
    .eqx sub { font-size: .64em; position: relative; bottom: -0.15em; }
    .eqx { white-space: normal; word-break: break-word; }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      transition: background var(--transition), border-color var(--transition);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 16px; letter-spacing: -.01em;
      cursor: pointer;
      color: var(--ink);
      text-decoration: none;
    }
    .brand .mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 800;
    }
    .topbar-actions {
      display: flex; align-items: center; gap: 8px;
    }
    .theme-toggle {
      background: none; border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; cursor: pointer; color: var(--ink-soft);
      font-size: 16px; transition: all var(--transition);
    }
    .theme-toggle:hover {
      border-color: var(--accent); color: var(--accent);
    }

    .mode-banner {
      background: #fff3d6; border-bottom: 1px solid #f0d998; color: #7a5c10;
      padding: 9px 22px; font-size: 13px; font-weight: 600; text-align: center;
    }
    [data-theme="dark"] .mode-banner {
      background: #2d1f00; border-color: #4a3500; color: #e6b800;
    }

    .userbox { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
    .userbox .who { font-weight: 600; color: var(--ink); }

    .btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 13.5px; font-weight: 600; cursor: pointer;
      transition: transform .08s ease, opacity .15s ease, background .15s ease, color .15s ease;
      font-family: inherit;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--bad-bg); color: var(--bad); }
    .btn-danger:hover { opacity: .85; }
    .btn-success { background: var(--ok-bg); color: var(--ok); }
    .btn-success:hover { opacity: .85; }
    .btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 8px; }
    .btn-warning { background: #fff3cd; color: #856404; }
    .btn-warning:hover { opacity: .85; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: var(--accent); color: #fff; }

    .icon-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
      color: var(--ink-soft); flex-shrink: 0;
      transition: all var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg); }
    .icon-btn.danger:hover { border-color: var(--bad); color: var(--bad); }
    .icon-btn.success:hover { border-color: var(--ok); color: var(--ok); }

    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%; max-width: 380px;
      transition: background var(--transition);
    }
    .login-card .mark-lg {
      width: 46px; height: 46px; border-radius: 13px; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; margin-bottom: 20px;
    }
    .login-card h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.02em; }
    .login-card p.sub { margin: 0 0 26px; color: var(--ink-soft); font-size: 13.5px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
      font-size: 14.5px; font-family: inherit; background: var(--bg);
      transition: border .15s, background var(--transition);
      color: var(--ink);
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .login-card .btn { width: 100%; padding: 12px; font-size: 14.5px; margin-top: 6px; }
    .login-err { color: var(--bad); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

    .container { max-width: 1080px; margin: 0 auto; padding: 32px 22px 80px; }
    .page-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
    .page-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 28px; }

    .maintabs { display: flex; gap: 8px; margin-bottom: 26px; flex-wrap: wrap; }
    .maintab {
      padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; color: var(--ink-soft); border: 1px solid transparent;
      transition: all var(--transition);
    }
    .maintab.active { background: var(--accent); color: #fff; }
    .maintab:not(.active):hover { background: var(--surface); border-color: var(--line); }

    .topic-block { margin-bottom: 8px; }
    .topic-block-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 26px 0 12px;
    }
    .topic-block-head .title-group { display: flex; align-items: center; gap: 10px; }
    .topic-block-head h2 {
      font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase;
      letter-spacing: .05em; margin: 0;
    }
    .topic-edit-controls { display: flex; gap: 6px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 20px;
      cursor: pointer;
      transition: box-shadow .15s ease, transform .1s ease, border-color .15s, background var(--transition);
      position: relative;
      overflow: hidden;
    }
    .card:hover { box-shadow: var(--shadow); border-color: transparent; transform: translateY(-1px); }
    .card .kind {
      display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .card .kind.lesson { color: #d6641a; }
    [data-theme="dark"] .card .kind.lesson { color: #e8843f; }
    .card .kind.homework { color: #b3123f; }
    [data-theme="dark"] .card .kind.homework { color: #e2496f; }
    .card .kind.locked { color: var(--bad); }
    .card .kind.draft { color: var(--ink-soft); }
    .card h3 { font-size: 16px; margin: 0 0 8px; letter-spacing: -.01em; line-height: 1.3; }
    .card .meta { font-size: 12.5px; color: var(--ink-soft); }
    .card .progress-bar {
      height: 5px; border-radius: 3px; background: var(--line); margin-top: 14px; overflow: hidden;
    }
    .card .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
    .card .progress-fill.finished { background: var(--ok); }
    .card .card-badge {
      position: absolute; top: 12px; right: 12px;
      font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
      background: var(--bad-bg); color: var(--bad);
    }
    .card .card-badge.locked { background: var(--bad-bg); color: var(--bad); }
    .card .card-badge.draft { background: var(--line); color: var(--ink-soft); }
    .card .card-badge.scheduled { background: #fff3cd; color: #856404; }
    .card .card-badge.personal { background: var(--ok-bg); color: var(--ok); }
    .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-edit-row { display: flex; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .card-edit-row .icon-btn { flex: 1; width: auto; }

    .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .back-btn {
      display: flex; align-items: center; gap: 6px; color: var(--ink-soft);
      font-size: 13.5px; font-weight: 600; cursor: pointer; background: none; border: none;
      font-family: inherit; padding: 8px 4px;
    }
    .back-btn:hover { color: var(--ink); }

    .trainer-head { margin-bottom: 22px; }
    .trainer-head h2 { font-size: 23px; margin: 0 0 8px; letter-spacing: -.02em; }
    .trainer-note {
      background: #fff8e8; border: 1px solid #f0dfa8; color: #7a5c10;
      border-radius: 12px; padding: 13px 16px; font-size: 13px; line-height: 1.5; margin-bottom: 8px;
    }
    [data-theme="dark"] .trainer-note {
      background: #2d1f00; border-color: #4a3500; color: #e6b800;
    }
    .trainer-summary { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
    .trainer-summary b { color: var(--ink); }

    .trainer-mode-selector {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .trainer-mode-selector .btn {
      flex: 1; text-align: center;
    }
    .trainer-mode-selector .btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    .rxn-step {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 24px 26px; margin-bottom: 16px;
      transition: background var(--transition), border-color var(--transition);
    }
    .rxn-step .rxn-num { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; }
    .rxn-step .rxn-eq { font-size: 25px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 20px; line-height: 1.6; }
    .rxn-step .rxn-input-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .rxn-step .rxn-input {
      flex: 1; min-width: 180px; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line);
      font-size: 18px; font-family: inherit; background: var(--bg); color: var(--ink);
      transition: border-color .15s, background var(--transition);
    }
    .rxn-step .rxn-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .rxn-step .rxn-input.correct { border-color: var(--ok); background: var(--ok-bg); }
    .rxn-step .rxn-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
    .rxn-step .rxn-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .rxn-step .rxn-feedback { margin-top: 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .rxn-step .rxn-feedback.ok { color: var(--ok); }
    .rxn-step .rxn-feedback.bad { color: var(--bad); }
    .rxn-step .rxn-explain {
      margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
      font-size: 13.5px; color: var(--ink-soft); line-height: 1.6;
    }
    .rxn-step .rxn-explain b { color: var(--ink); font-weight: 700; }
    .rxn-step .rxn-explain .full-eq { font-size: 16px; color: var(--ink); font-weight: 600; margin-top: 4px; }
    .rxn-step .rxn-explain .user-given { font-size: 12.5px; margin-top: 6px; color: var(--ink-soft); }

    .rxn-step .step-nav {
      display: flex; gap: 12px; align-items: center; justify-content: center;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    }
    .rxn-step .step-nav .nav-info {
      font-size: 13px; color: var(--ink-soft); min-width: 44px; text-align: center;
    }
    .rxn-step .step-nav .flank-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px;
      border: 1px solid var(--line); background: var(--surface);
      font-size: 13px; cursor: pointer; color: var(--ink); font-family: inherit;
      transition: border-color .15s, opacity .15s;
    }
    .rxn-step .step-nav .flank-btn:hover { border-color: var(--ink); }
    .rxn-step .step-nav .flank-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ===== КАРТЫ (FLASH CARDS) ===== */
    .flash-card {
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 30px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      position: relative;
    }
    .flash-card .card-number {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
    }
    .flash-card .card-question {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      padding: 20px 0;
      line-height: 1.6;
    }
    .flash-card .card-question .answer-part {
      color: var(--ok);
      font-weight: 700;
    }
    .flash-card .card-question .answer-part.hidden-answer {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .flash-card .card-question .answer-part.visible-answer {
      opacity: 1;
    }
    .flash-card .card-actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .flash-card .card-nav {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .flash-card .card-nav .nav-btn {
      padding: 8px 20px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      transition: all var(--transition);
      font-family: inherit;
    }
    .flash-card .card-nav .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .flash-card .card-nav .nav-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    .flash-card .card-nav .nav-info {
      font-size: 14px;
      color: var(--ink-soft);
      min-width: 60px;
      text-align: center;
    }
    .flash-card .card-source {
      position: absolute;
      bottom: 12px;
      right: 20px;
      font-size: 11px;
      color: var(--ink-soft);
      opacity: 0.6;
    }

    .rxn-list { display: flex; flex-direction: column; gap: 12px; }
    .rxn-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px 22px;
      transition: background var(--transition), border-color var(--transition);
    }
    .rxn-card.state-correct { border-color: #bfe8d5; }
    [data-theme="dark"] .rxn-card.state-correct { border-color: #1a6b4a; }
    .rxn-card.state-wrong { border-color: #f3c6c1; }
    [data-theme="dark"] .rxn-card.state-wrong { border-color: #6b2a2a; }

    .rxn-card .rxn-num { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; }
    .rxn-card .rxn-eq { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 12px; line-height: 1.6; }
    .rxn-card .rxn-input-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .rxn-card .rxn-input {
      flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line);
      font-size: 14px; font-family: inherit; background: var(--bg); color: var(--ink);
      transition: border-color .15s, background var(--transition);
    }
    .rxn-card .rxn-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .rxn-card .rxn-input.correct { border-color: var(--ok); background: var(--ok-bg); }
    .rxn-card .rxn-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
    .rxn-card .rxn-feedback { margin-top: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .rxn-card .rxn-feedback.ok { color: var(--ok); }
    .rxn-card .rxn-feedback.bad { color: var(--bad); }
    .rxn-card .rxn-explain {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--ink-soft); line-height: 1.6;
    }
    .rxn-card .rxn-explain b { color: var(--ink); font-weight: 700; }
    .rxn-card .rxn-explain .full-eq { font-size: 15px; color: var(--ink); font-weight: 600; margin-top: 4px; }
    .rxn-card .rxn-explain .user-given { font-size: 12px; margin-top: 6px; color: var(--ink-soft); }

    .progress-rounds {
      display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .progress-round {
      flex: 1; min-width: 150px;
    }
    .progress-round .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
    .progress-round .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .progress-round .bar .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
    .progress-round .bar .fill.done { background: var(--ok); }
    .progress-round .count { font-size: 12px; font-weight: 600; margin-top: 4px; }

    .scroll-top-btn {
      position: fixed; bottom: 30px; right: 30px;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none;
      font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
      transition: all var(--transition); z-index: 40;
      display: flex; align-items: center; justify-content: center;
    }
    .scroll-top-btn:hover { transform: scale(1.05); background: var(--accent-hover); }
    .scroll-top-btn.hidden { opacity: 0; pointer-events: none; }

    .stats-table { width: 100%; border-collapse: collapse; }
    .stats-table th {

<body>

  <!-- ===== ЭКРАН ВХОДА ===== -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="mark-lg">Х</div>
      <h1>Вход на платформу</h1>
      <p class="sub">Введите имя и пароль, выданные учителем</p>
      <div class="field">
        <label>Имя</label>
        <input type="text" id="loginName" placeholder="Ваше имя" autocomplete="off">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="Пароль">
      </div>
      <button class="btn btn-accent" onclick="handleLogin()">Войти</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
  <div id="app" class="hidden">
    <div class="topbar">
      <div class="brand" onclick="goHome()">
        <div id="platformMark">Х</div>
        <span id="brandTitle">Химия</span>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Переключить тему">Тема</button>
        <div class="userbox">
          <span class="who" id="whoLabel"></span>
          <button class="btn btn-ghost btn-sm hidden" id="exitTeachModeBtn" onclick="exitTeachMode()">Выйти из режима «Обучаю»</button>
          <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Выйти</button>
        </div>
      </div>
    </div>
    <div class="mode-banner hidden" id="teachModeBanner">Режим «Обучаю» — вы видите платформу как ученик. Ответы не сохраняются в статистику.</div>

    <!-- Панель платформ (только для учителя) -->
    <div class="platforms-bar" id="platformsBar" style="display:none;">
      <span style="font-size:12px;color:var(--ink-soft);margin-right:4px;">Платформы:</span>
      <div id="platformsList" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
      <button class="plat-add" onclick="showAddPlatformModal()">+ Новая</button>
    </div>

    <div class="container" id="mainContainer"></div>
  </div>

  <!-- ===== КНОПКА НАВЕРХ ===== -->
  <button class="scroll-top-btn hidden" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script type="module">
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ FIREBASE
    // ============================================================

    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, get, update, remove, child, onValue } from "firebase/database";

    const firebaseConfig = {
      apiKey: "AIzaSyBi21gU7he9IyG6-Bvnyg4E3zQo_8N0O0Y",
      authDomain: "chemistry-b40b7.firebaseapp.com",
      projectId: "chemistry-b40b7",
      storageBucket: "chemistry-b40b7.firebasestorage.app",
      messagingSenderId: "407982061566",
      appId: "1:407982061566:web:a0ae0fc27a745adbd7f2af",
      measurementId: "G-FJ4J21CWKL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.__db = db;
    window.__ref = ref;
    window.__set = set;
    window.__get = get;
    window.__update = update;
    window.__remove = remove;
    window.__child = child;
    window.__onValue = onValue;

    // ============================================================
    // 2. ОСНОВНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================

    const TEACHER_LOGIN = 'admin';
    const TEACHER_PASS = 'admin123';
    const SESSION_KEY = 'chem_session_v1';
    const PLATFORMS_KEY = 'chem_platforms_v1';
    const ACTIVE_PLATFORM_KEY = 'chem_active_platform_v1';
    const THEME_KEY = 'chem_theme_v1';

    let CURRENT_USER = null;
    let TEACH_MODE = false;
    let TOPICS = [];
    let TRAINERS = [];
    let LESSONS = [];
    let HOMEWORKS = [];
    let VIEW = { name: 'home' };
    let isLoading = true;
    let currentPlatform = 'default';
    let platforms = {};
    let allStudents = [];

    window.__cachedProgress = null;

    // ============================================================
    // 3. НОВАЯ ЛОГИКА ПРОВЕРКИ ОТВЕТОВ (ДЛЯ ВСЕХ ТИПОВ)
    // ============================================================

    function normalizeToken(t) {
      return t.trim().toUpperCase().replace(/\s+/g, '');
    }

    function splitProducts(str) {
      return str.split('+').map(s => normalizeToken(s)).filter(s => s.length > 0);
    }

    function arraysEqualAsSets(a, b) {
      if (a.length !== b.length) return false;
      const sa = [...a].sort();
      const sb = [...b].sort();
      return sa.every((v, i) => v === sb[i]);
    }

    function parseAnswerVariants(answerStr) {
      if (!answerStr) return [];
      const variants = answerStr.split('/').map(s => s.trim()).filter(s => s.length > 0);
      if (variants.length === 0) return [[]];
      return variants.map(variant => {
        return splitProducts(variant);
      });
    }

    function parseCheckboxAnswers(answerStr) {
      if (!answerStr) return [];
      return answerStr.split(',').map(s => normalizeToken(s)).filter(s => s.length > 0);
    }

    function cleanDisplayToken(s) {
      return s.trim().replace(/\s+/g, '');
    }

    function buildCorrectSets(answerStr, taskType) {
      const answer = (answerStr || '').trim();
      if (taskType === 'checkbox') {
        const clean = answer.replace(/\s/g, '');
        const isInvalid = clean === '0' || clean === '-' || clean === '−' ||
          /НЕ ИДЁТ|НЕ ИДЕТ/i.test(answer);
        if (isInvalid) return { correctSets: [], correctSetsDisplay: [], valid: false };
        const rawTokens = answer.split(',').map(s => s.trim()).filter(s => s.length > 0);
        const set = rawTokens.map(s => normalizeToken(s));
        const setDisplay = rawTokens.map(s => cleanDisplayToken(s));
        return { correctSets: [set], correctSetsDisplay: [setDisplay], valid: true };
      }
      const variants = answer.split('/').map(s => s.trim()).filter(s => s.length > 0);
      const isInvalid = variants.some(v => {
        const clean = v.replace(/\s/g, '');
        return clean === '0' || clean === '-' || clean === '−' ||
          /НЕ ИДЁТ|НЕ ИДЕТ/i.test(v);
      });
      if (isInvalid) return { correctSets: [], correctSetsDisplay: [], valid: false };
      const correctSets = variants.map(v => v.split('+').map(s => normalizeToken(s)).filter(s => s.length > 0));
      const correctSetsDisplay = variants.map(v => v.split('+').map(s => cleanDisplayToken(s)).filter(s => s.length > 0));
      return { correctSets, correctSetsDisplay, valid: true };
    }

    function checkAnswer(reaction, userInput, taskType) {
      const raw = (userInput || '').trim();
      if (!raw) return false;

      const norm = raw.replace(/\s+/g, '');
      if (norm === '0' || norm === '-' || norm === '−' || 
          norm.toUpperCase() === 'НЕТ' || norm.toUpperCase() === 'НЕИДЕТ' || 
          norm.toUpperCase() === 'НЕИДЁТ') {
        return !reaction.valid;
      }

      if (!reaction.valid) {
        return false;
      }

      const correctSets = Array.isArray(reaction.correctSets) ? reaction.correctSets : [];

      if (taskType === 'checkbox') {
        const userAnswers = parseCheckboxAnswers(raw);
        const correctSet = correctSets.length > 0 ? correctSets[0] : [];
        return arraysEqualAsSets(userAnswers, correctSet);
      }

      const userProducts = splitProducts(raw);
      for (const correctVariant of correctSets) {
        if (arraysEqualAsSets(userProducts, correctVariant)) {
          return true;
        }
      }
      return false;
    }

    // ============================================================
    // 4-8. ПЛАТФОРМЫ, ТЕМА, СЕССИЯ, FIREBASE, ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================

    async function loadPlatforms() {
      const loaded = await loadFromFirebase('platformsList', null);
      if (loaded && Object.keys(loaded).length > 0) {
        platforms = loaded;
      } else {
        platforms = {
          default: {
            name: 'Химия',
            icon: 'Х',
            password: 'admin123',
            created: Date.now(),
            isEmpty: true
          }
        };
        await saveToFirebase('platformsList', platforms);
      }
      return platforms;
    }

    async function savePlatforms() {
      await saveToFirebase('platformsList', platforms);
    }

    function loadActivePlatform() {
      try {
        const raw = localStorage.getItem(ACTIVE_PLATFORM_KEY);
        if (raw && platforms[raw]) {
          currentPlatform = raw;
        } else {
          currentPlatform = Object.keys(platforms)[0] || 'default';
        }
      } catch (e) {
        currentPlatform = 'default';
      }
      return currentPlatform;
    }

    function saveActivePlatform(platId) {
      currentPlatform = platId;
      try {
        localStorage.setItem(ACTIVE_PLATFORM_KEY, platId);
      } catch (e) {}
    }

    function getPlatformPath(platId, path) {
      return `platforms/${platId}/${path}`;
    }

    // ============================================================
    // 9. АВТОРИЗАЦИЯ
    // ============================================================

    window.handleLogin = async function() {
      const nameInput = document.getElementById('loginName').value.trim();
      const passInput = document.getElementById('loginPass').value;
      const errBox = document.getElementById('loginErr');
      errBox.textContent = '';

      if (!nameInput || !passInput) { errBox.textContent = 'Введите имя и пароль.'; return; }

      const platKeys = Object.keys(platforms);
      for (const key of platKeys) {
        if (passInput === platforms[key].password && nameInput.toLowerCase() === 'admin') {
          CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true, platform: key };
          TEACH_MODE = false;
          saveSession({ key: '__teacher__', isTeacher: true, name: 'Учитель', platform: key });
          saveActivePlatform(key);
          await startApp();
          return;
        }
      }

      if (nameInput.toLowerCase() === TEACHER_LOGIN && passInput === TEACHER_PASS) {
        CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true, platform: currentPlatform };
        TEACH_MODE = false;
        saveSession({ key: '__teacher__', isTeacher: true, name: 'Учитель', platform: currentPlatform });
        await startApp();
        return;
      }

      const key = nameInput.toLowerCase();

      let foundPlatform = null;
      let foundStudent = null;
      for (const platId of Object.keys(platforms)) {
        const platReg = await loadFromFirebase(getPlatformPath(platId, 'registry'), {});
        if (platReg[key]) {
          foundPlatform = platId;
          foundStudent = platReg[key];
          break;
        }
      }

      if (!foundStudent) {
        errBox.textContent = 'Такого ученика нет. Обратитесь к учителю.';
        return;
      }
      if (foundStudent.password !== passInput) {
        errBox.textContent = 'Неверный пароль.';
        return;
      }

      saveActivePlatform(foundPlatform);
      allStudents = [];

      CURRENT_USER = { name: foundStudent.name, key, isTeacher: false, platform: foundPlatform };
      saveSession({ key, isTeacher: false, name: CURRENT_USER.name, platform: foundPlatform });
      await startApp();
    };

    window.handleLogout = function() {
      saveSession(null);
      CURRENT_USER = null;
      TEACH_MODE = false;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginName').value = '';
      document.getElementById('loginPass').value = '';
    };

    function tryRestoreSession() {
      const s = loadSession();
      if (!s) return false;
      if (s.isTeacher) {
        CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true };
        if (s.platform) saveActivePlatform(s.platform);
      } else {
        CURRENT_USER = { name: s.name || 'Ученик', key: s.key, isTeacher: false };
        if (s.platform) saveActivePlatform(s.platform);
      }
      return true;
    }

    window.enterTeachMode = function() {
      TEACH_MODE = true;
      VIEW = { name: 'home' };
      render();
      updateChrome();
    };

    window.exitTeachMode = function() {
      TEACH_MODE = false;
      VIEW = { name: 'home' };
      render();
      updateChrome();
    };

    function updateChrome() {
      const banner = document.getElementById('teachModeBanner');
      const exitBtn = document.getElementById('exitTeachModeBtn');
      if (TEACH_MODE) {
        banner.classList.remove('hidden');
        exitBtn.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
        exitBtn.classList.add('hidden');
      }
    }

    function isManaging() {
      return CURRENT_USER && CURRENT_USER.isTeacher && !TEACH_MODE;
    }

    async function startApp() {
      renderPlatformsBar();

      if (CURRENT_USER && !CURRENT_USER.isTeacher) {
        const reg = await loadRegistry();
        if (!reg[CURRENT_USER.key]) {
          handleLogout();
          return;
        }
        CURRENT_USER.name = reg[CURRENT_USER.key].name;

    function escapeHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escapeHtmlMultiline(s) {
      return escapeHtml(s).replace(/\n/g, '<br>');
    }

    function escapeAttr(s) {
      if (!s) return '';
      return (s || '').replace(/"/g, '&quot;');
    }

    function renderEquation(str) {
      if (!str) return '';
      let out = '';
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (/\d/.test(ch)) {
          const prev = i > 0 ? str[i - 1] : '';
          if (/[A-Za-zА-Яа-я\)\]]/.test(prev)) {
            out += '<sub>' + ch + '</sub>';
            continue;
          }
        }
        out += escapeHtmlChar(ch);
      }
      return out;
    }

    function renderEquationFull(str) {
      if (!str) return '';
      let out = '';
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (/\d/.test(ch)) {
          const prev = i > 0 ? str[i - 1] : '';
          if (/[A-Za-zА-Яа-я\)\]]/.test(prev)) {
            out += '<sub>' + ch + '</sub>';
            continue;
          }
        }
        out += escapeHtmlChar(ch);
      }
      return out;
    }

    function escapeHtmlChar(ch) {
      if (ch === '<') return '&lt;';
      if (ch === '>') return '&gt;';
      if (ch === '&') return '&amp;';
      return ch;
    }

    function getSamaraTimestamp(dateStr) {
      if (!dateStr) return null;
      const [datePart, timePart] = dateStr.split('T');
      const [year, month, day] = datePart.split('-').map(Number);
      const [hours, minutes] = timePart.split(':').map(Number);
      const samaraDate = new Date(Date.UTC(year, month - 1, day, hours - 4, minutes));
      return samaraDate.getTime();
    }

    function getSamaraDateString(date) {
      const d = new Date(date);
      const samaraOffset = 4 * 60 * 60 * 1000;
      const localOffset = d.getTimezoneOffset() * 60 * 1000;
      const samaraTime = new Date(d.getTime() + localOffset + samaraOffset);
      return samaraTime.toISOString().slice(0, 16);
    }

    function getTimeUntil(timestamp) {
      const now = Date.now();
      const diff = timestamp - now;
      if (diff <= 0) return null;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      if (days > 0) return `${days} дн. ${hours} ч.`;
      if (hours > 0) return `${hours} ч. ${minutes} мин.`;
      return `${minutes} мин.`;
    }

    function renderPlatformIconHtml(plat, sizePx) {
      const size = sizePx || 30;
      if (plat && plat.iconImage) {
        return `<img src="${plat.iconImage}" alt="" style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.3)}px;object-fit:cover;display:block;">`;
      }
      const bg = (plat && plat.iconBg) || 'var(--accent)';
      const color = (plat && plat.iconColor) || '#ffffff';
      const letter = (plat && plat.icon) || '●';
      const fontSize = Math.round(size * 0.46);
      return `<div style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.3)}px;background:${escapeAttr(bg)};color:${escapeAttr(color)};display:flex;align-items:center;justify-content:center;font-size:${fontSize}px;font-weight:800;flex-shrink:0;">${escapeHtml(letter)}</div>`;
    }

    function compressImageToDataUrl(file, maxSize) {
      return new Promise((resolve, reject) => {
        const size = maxSize || 128;
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const srcSize = Math.min(img.width, img.height);
            const srcX = (img.width - srcSize) / 2;
            const srcY = (img.height - srcSize) / 2;
            ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, size, size);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function loadFromFirebase(path, defaultValue) {
      try {
        const snapshot = await get(ref(db, path));
        if (snapshot.exists()) {
          return snapshot.val();
        } else {
          await set(ref(db, path), defaultValue);
          return defaultValue;
        }
      } catch (e) {
        console.error('Ошибка загрузки из Firebase:', e);
        return defaultValue;
      }
    }

    async function saveToFirebase(path, data) {
      try {
        await set(ref(db, path), data);
        return true;
      } catch (e) {
        console.error('Ошибка сохранения в Firebase:', e);
        return false;
      }
    }

    async function loadRegistry() {
      const reg = await loadFromFirebase(getPlatformPath(currentPlatform, 'registry'), {});
      allStudents = Object.keys(reg);
      return reg;
    }

    async function saveRegistry(reg) {
      allStudents = Object.keys(reg);
      return await saveToFirebase(getPlatformPath(currentPlatform, 'registry'), reg);
    }

      return await loadFromFirebase(getPlatformPath(currentPlatform, `progress/${studentKey}`), {});
    }

      await saveToFirebase(getPlatformPath(currentPlatform, `progress/${studentKey}`), progress);

      const platId = currentPlatform;
      TOPICS = await loadFromFirebase(getPlatformPath(platId, 'topics'), []);
      TRAINERS = await loadFromFirebase(getPlatformPath(platId, 'trainers'), []);
      LESSONS = await loadFromFirebase(getPlatformPath(platId, 'lessons'), []);
      HOMEWORKS = await loadFromFirebase(getPlatformPath(platId, 'homeworks'), []);

      if (!Array.isArray(TOPICS)) TOPICS = [];
      if (!Array.isArray(TRAINERS)) TRAINERS = [];
      if (!Array.isArray(LESSONS)) LESSONS = [];
      if (!Array.isArray(HOMEWORKS)) HOMEWORKS = [];

      TOPICS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
      TRAINERS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
      LESSONS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
      HOMEWORKS.forEach((t, i) => { if (t.order === undefined) t.order = i; });
    }

        list.appendChild(btn);

        editBtn.textContent = '✎';
        editBtn.title = 'Изменить значок платформы';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          window.showEditPlatformModal(key);
        };
        list.appendChild(editBtn);

        const settingsBtn = document.createElement('button');
        settingsBtn.className = 'plat-settings';
        settingsBtn.textContent = '⚙';
        settingsBtn.title = 'Настройки (имя, пароль)';
        settingsBtn.onclick = (e) => {
          e.stopPropagation();
          window.showPlatformSettingsModal(key);
        };
        list.appendChild(settingsBtn);

        if (key !== 'default') {
          const delBtn = document.createElement('button');
          delBtn.className = 'plat-del';
          delBtn.textContent = '✕';
          delBtn.title = 'Удалить платформу';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            window.deletePlatform(key);
          };
          list.appendChild(delBtn);
        }
      });

    // ============================================================
    // 14. ТЕМА (светлая/тёмная)
    // ============================================================

    function loadTheme() {
      try {
        const theme = localStorage.getItem(THEME_KEY);
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeToggle').textContent = 'Светлая';
        } else {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('themeToggle').textContent = 'Тёмная';
        }
      } catch (e) {}
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem(THEME_KEY, 'light');
        document.getElementById('themeToggle').textContent = 'Тёмная';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem(THEME_KEY, 'dark');
        document.getElementById('themeToggle').textContent = 'Светлая';
      }
    });
    loadTheme();

    // ============================================================
    // 15. СЕССИЯ (localStorage)
    // ============================================================

    function loadSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function saveSession(s) {
      try {
        if (s === null) {
          localStorage.removeItem(SESSION_KEY);
        } else {
          localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        }
      } catch (e) {}
    }

    // ============================================================
    // 16. РЕНДЕРИНГ
    // ============================================================

    function render() {
      if (isLoading) return;
      const c = document.getElementById('mainContainer');
      c.innerHTML = '';
      if (VIEW.name === 'home') renderHome(c);
      else if (VIEW.name === 'trainer') renderTrainer(c, VIEW.trainerId);
      else if (VIEW.name === 'homework') renderHomework(c, VIEW.homeworkId);
      else if (VIEW.name === 'lesson') renderLessonModal(VIEW.lessonId);
      else if (VIEW.name === 'stats') renderStats(c);
      else if (VIEW.name === 'studentDetail') renderStudentDetail(c, VIEW.studentKey);

      const scrollBtn = document.getElementById('scrollTopBtn');
      if (scrollBtn) {
        if (window.scrollY > 400) {
          scrollBtn.classList.remove('hidden');
        } else {
          scrollBtn.classList.add('hidden');
        }
      }
    }

    window.addEventListener('scroll', () => {
      const scrollBtn = document.getElementById('scrollTopBtn');
      if (scrollBtn) {
        if (window.scrollY > 400) {
          scrollBtn.classList.remove('hidden');
        } else {
          scrollBtn.classList.add('hidden');
        }
      }
    });

    // ============================================================
    // 17. RENDER HOME
    // ============================================================

    async function renderHome(container) {
      const wrap = document.createElement('div');

      const title = document.createElement('div');
      title.innerHTML = `<h1 class="page-title">Содержание</h1><p class="page-sub">${isManaging() ? 'Управляйте темами и материалами.' : 'Выберите тренажёр или видеоурок по теме'}</p>`;
      wrap.appendChild(title);

      if (CURRENT_USER.isTeacher && !TEACH_MODE) {
        const tabs = document.createElement('div');
        tabs.className = 'maintabs';
        tabs.innerHTML = `
          <div class="maintab active" id="tabContent">Содержание</div>
          <div class="maintab" id="tabStats">Статистика</div>
          <div class="maintab" id="tabTeach">Обучаю</div>
        `;
        tabs.querySelector('#tabContent').onclick = () => { VIEW = { name: 'home' }; render(); };
        tabs.querySelector('#tabStats').onclick = () => { VIEW = { name: 'stats' }; render(); };
        tabs.querySelector('#tabTeach').onclick = () => { window.enterTeachMode(); };
        wrap.appendChild(tabs);

        const builder = buildAdminBuilder();
        wrap.appendChild(builder);

        const aiBuilder = buildAIBuilder();
        wrap.appendChild(aiBuilder);
      }

      const sortedTopics = [...TOPICS].sort((a, b) => a.order - b.order);

      let progress = {};
      if (!CURRENT_USER.isTeacher) {
        if (window.__cachedProgress) {
          progress = window.__cachedProgress;
        } else {
          progress = await getProgress(CURRENT_USER.key);
          window.__cachedProgress = progress;
        }
      }

      function isItemAvailable(item) {
        if (!item) return true;
        if (item.isDraft && !isManaging()) return false;
        if (item.isLocked && !isManaging()) return true;
        if (item.scheduledRelease && !isManaging()) {
          const now = Date.now();
          if (now < item.scheduledRelease) return true;
        }
        if (item.assignedTo && item.assignedTo.length > 0 && !isManaging()) {
          if (!CURRENT_USER || CURRENT_USER.isTeacher) return true;
          if (!item.assignedTo.includes(CURRENT_USER.key)) return false;
        }
        return true;
      }

      function isItemClickable(item) {
        if (!item) return true;
        if (item.isDraft && !isManaging()) return false;
        if (item.isLocked && !isManaging()) return false;
        if (item.scheduledRelease && !isManaging()) {
          const now = Date.now();
          if (now < item.scheduledRelease) return false;
        }
        if (item.assignedTo && item.assignedTo.length > 0 && !isManaging()) {
          if (!CURRENT_USER || CURRENT_USER.isTeacher) return true;
          if (!item.assignedTo.includes(CURRENT_USER.key)) return false;
        }
        return true;
      }

      function getItemBadge(item) {
        if (!item) return '';
        if (item.isDraft && isManaging()) return '<span class="card-badge draft">Черновик</span>';
        if (item.isLocked) return '<span class="card-badge locked">Заблокировано</span>';
        if (item.scheduledRelease && !isManaging()) {
          const now = Date.now();
          if (now < item.scheduledRelease) {
            const timeLeft = getTimeUntil(item.scheduledRelease);
            return `<span class="card-badge scheduled">Через ${timeLeft}</span>`;
          }
        }
        if (item.assignedTo && item.assignedTo.length > 0 && isManaging()) {
          const names = item.assignedTo;
          const shortLabel = names.length > 2
            ? `${names.slice(0, 2).join(', ')} +${names.length - 2}`
            : names.join(', ');
          return `<span class="card-badge personal" title="Личное задание: ${escapeAttr(names.join(', '))}">Личное: ${escapeHtml(shortLabel)}</span>`;
        }
        return '';
      }

      for (const topic of sortedTopics) {
        const topicTrainers = (TRAINERS || []).filter(t => t.topicId === topic.id).sort((a, b) => a.order - b.order);
        const topicLessons = (LESSONS || []).filter(l => l.topicId === topic.id).sort((a, b) => a.order - b.order);
        const topicHomeworks = (HOMEWORKS || []).filter(h => h.topicId === topic.id).sort((a, b) => a.order - b.order);

        let filteredTrainers = topicTrainers;
        let filteredLessons = topicLessons;
        let filteredHomeworks = topicHomeworks;

        if (!isManaging()) {
          filteredTrainers = topicTrainers.filter(t => isItemAvailable(t));
          filteredLessons = topicLessons.filter(l => isItemAvailable(l));
          filteredHomeworks = topicHomeworks.filter(h => isItemAvailable(h));
        }

        if (filteredTrainers.length === 0 && filteredLessons.length === 0 && filteredHomeworks.length === 0 && !isManaging()) continue;

        const block = document.createElement('div');
        block.className = 'topic-block';

        const head = document.createElement('div');
        head.className = 'topic-block-head';
        const titleGroup = document.createElement('div');
        titleGroup.className = 'title-group';
        const h2 = document.createElement('h2');
        h2.textContent = topic.name;
        titleGroup.appendChild(h2);
        head.appendChild(titleGroup);

        if (isManaging()) {
          const editControls = document.createElement('div');
          editControls.className = 'topic-edit-controls';
          editControls.innerHTML = `
            <button class="icon-btn" title="Переместить вверх" data-act="up">↑</button>
            <button class="icon-btn" title="Переместить вниз" data-act="down">↓</button>
            <button class="icon-btn" title="Переименовать" data-act="rename">✎</button>
            <button class="icon-btn danger" title="Удалить тему" data-act="del">✕</button>
          `;
          editControls.querySelector('[data-act="up"]').onclick = () => moveTopic(topic.id, -1);
          editControls.querySelector('[data-act="down"]').onclick = () => moveTopic(topic.id, 1);
          editControls.querySelector('[data-act="rename"]').onclick = () => renameTopicPrompt(topic.id);
          editControls.querySelector('[data-act="del"]').onclick = () => deleteTopicConfirm(topic.id);
          head.appendChild(editControls);
        }
        block.appendChild(head);

        const grid = document.createElement('div');
        grid.className = 'grid';

        let allItems = [];
        for (const t of filteredTrainers) {
          allItems.push({ ...t, _type: 'trainer' });
        }
        for (const l of filteredLessons) {
          allItems.push({ ...l, _type: 'lesson' });
        }
        for (const h of filteredHomeworks) {
          allItems.push({ ...h, _type: 'homework' });
        }
        allItems.sort((a, b) => a.order - b.order);

        for (let ci = 0; ci < allItems.length; ci++) {
          const item = allItems[ci];
          const type = item._type;

          if (type === 'trainer') {
            const trainer = item;
            const card = document.createElement('div');
            card.className = 'card';
            let pct = 0;
            let isFinished = false;
            if (!CURRENT_USER.isTeacher) {
              const trainerData = progress[trainer.id] || {};
              const statuses = trainerData.statuses || [];
              const reactionsLength = (trainer.reactions || []).length;
              const done = statuses.filter(s => s === 'correct').length;
              pct = reactionsLength ? Math.round(done / reactionsLength * 100) : 0;
              isFinished = !!trainerData.__finished;
            }
            const isClickable = isItemClickable(trainer);
            const badge = getItemBadge(trainer);

            if (isFinished) {
              card.style.borderColor = 'var(--ok)';
              card.style.backgroundColor = 'var(--ok-bg)';
            }

            card.innerHTML = `
              <div class="card-top-row">
                <div><span class="kind">Тренажёр</span></div>
                ${badge}
              </div>
              <h3>${escapeHtml(trainer.title)}</h3>
              <div class="meta">${(trainer.reactions || []).length} реакций${isManaging() ? ` · ${trainer.mode === 'step' ? 'Пошагово' : 'Список'}` : ''}</div>
              ${(!CURRENT_USER.isTeacher) ? `<div class="progress-bar"><div class="progress-fill${isFinished ? ' finished' : ''}" style="width:${pct}%"></div></div>` : ''}
              ${isManaging() ? `<div class="card-edit-row">
                <button class="icon-btn" data-act="up" title="Вверх">↑</button>
                <button class="icon-btn" data-act="down" title="Вниз">↓</button>
                <button class="icon-btn" data-act="move" title="Переместить в тему">⇄</button>
                <button class="icon-btn" data-act="edit" title="Редактировать">✎</button>
                <button class="icon-btn" data-act="copy" title="Копировать">⧉</button>
                <button class="icon-btn danger" data-act="del" title="Удалить">✕</button>
              </div>` : ''}
            `;
            if (isManaging()) {
              card.querySelector('[data-act="up"]').onclick = (e) => { e.stopPropagation(); moveItem('trainer', trainer.id, -1); };
              card.querySelector('[data-act="down"]').onclick = (e) => { e.stopPropagation(); moveItem('trainer', trainer.id, 1); };
              card.querySelector('[data-act="move"]').onclick = (e) => { e.stopPropagation(); moveItemToTopic('trainer', trainer.id); };
              card.querySelector('[data-act="edit"]').onclick = (e) => { e.stopPropagation(); openEditTrainerModal(trainer.id); };
              card.querySelector('[data-act="copy"]').onclick = (e) => { e.stopPropagation(); copyItem('trainer', trainer.id); };
              card.querySelector('[data-act="del"]').onclick = (e) => { e.stopPropagation(); deleteItemConfirm('trainer', trainer.id); };
              card.onclick = () => { VIEW = { name: 'trainer', trainerId: trainer.id }; render(); };
            } else {
              if (isClickable) {
                card.onclick = () => { VIEW = { name: 'trainer', trainerId: trainer.id }; render(); };
              } else {
                card.style.cursor = 'default';
                card.style.opacity = '0.7';
              }
            }
            grid.appendChild(card);
          } else if (type === 'lesson') {
            const lesson = item;
            const card = document.createElement('div');
            card.className = 'card';
            const isClickable = isItemClickable(lesson);
            const badge = getItemBadge(lesson);

            let lessonFinished = false;
            if (!CURRENT_USER.isTeacher) {
              lessonFinished = !!progress['lesson:' + lesson.id];
            }

            if (lessonFinished) {
              card.style.borderColor = 'var(--ok)';
              card.style.backgroundColor = 'var(--ok-bg)';
            }

            card.innerHTML = `
              <span class="kind lesson">Урок</span>
              <h3>${escapeHtml(lesson.title)}</h3>
              <div class="meta">${(lesson.links || []).length} видео · ${(lesson.files || []).length} файлов</div>
              ${badge}
              ${isManaging() ? `<div class="card-edit-row">
                <button class="icon-btn" data-act="up" title="Вверх">↑</button>
                <button class="icon-btn" data-act="down" title="Вниз">↓</button>
                <button class="icon-btn" data-act="move" title="Переместить в тему">⇄</button>
                <button class="icon-btn" data-act="edit" title="Редактировать">✎</button>
                <button class="icon-btn" data-act="copy" title="Копировать">⧉</button>
                <button class="icon-btn danger" data-act="del" title="Удалить">✕</button>
              </div>` : ''}
            `;
            if (isManaging()) {
              card.querySelector('[data-act="up"]').onclick = (e) => { e.stopPropagation(); moveItem('lesson', lesson.id, -1); };
              card.querySelector('[data-act="down"]').onclick = (e) => { e.stopPropagation(); moveItem('lesson', lesson.id, 1); };
              card.querySelector('[data-act="move"]').onclick = (e) => { e.stopPropagation(); moveItemToTopic('lesson', lesson.id); };
              card.querySelector('[data-act="edit"]').onclick = (e) => { e.stopPropagation(); openEditLessonModal(lesson.id); };
              card.querySelector('[data-act="copy"]').onclick = (e) => { e.stopPropagation(); copyItem('lesson', lesson.id); };
              card.querySelector('[data-act="del"]').onclick = (e) => { e.stopPropagation(); deleteItemConfirm('lesson', lesson.id); };
              card.onclick = () => { VIEW = { name: 'lesson', lessonId: lesson.id }; renderLessonModal(lesson.id); };
            } else {
              if (isClickable) {
                card.onclick = () => { VIEW = { name: 'lesson', lessonId: lesson.id }; renderLessonModal(lesson.id); };
              } else {
                card.style.cursor = 'default';
                card.style.opacity = '0.7';
              }
            }
            grid.appendChild(card);
          } else if (type === 'homework') {
            const homework = item;
            const card = document.createElement('div');
            card.className = 'card';
            let hwPct = 0;
            let hwFinished = false;
            if (!CURRENT_USER.isTeacher) {
              const hwData = progress[homework.id] || {};
              const statuses = hwData.statuses || [];
              const done = statuses.filter(s => s === 'correct').length;
              const tasksLength = (homework.tasks || []).length;
              hwPct = tasksLength ? Math.round(done / tasksLength * 100) : 0;
              hwFinished = !!hwData.__finished;
            }
            const isClickable = isItemClickable(homework);
            const badge = getItemBadge(homework);

            if (hwFinished) {
              card.style.borderColor = 'var(--ok)';
              card.style.backgroundColor = 'var(--ok-bg)';
            }

            card.innerHTML = `
              <span class="kind homework">Домашка</span>
              <h3>${escapeHtml(homework.title)}</h3>
              <div class="meta">${(homework.tasks || []).length} заданий</div>
              ${(!CURRENT_USER.isTeacher) ? `<div class="progress-bar"><div class="progress-fill${hwFinished ? ' finished' : ''}" style="width:${hwPct}%"></div></div>` : ''}
              ${badge}
              ${isManaging() ? `<div class="card-edit-row">
                <button class="icon-btn" data-act="up" title="Вверх">↑</button>
                <button class="icon-btn" data-act="down" title="Вниз">↓</button>
                <button class="icon-btn" data-act="move" title="Переместить в тему">⇄</button>
                <button class="icon-btn" data-act="edit" title="Редактировать">✎</button>
                <button class="icon-btn" data-act="copy" title="Копировать">⧉</button>
                <button class="icon-btn danger" data-act="del" title="Удалить">✕</button>
              </div>` : ''}

            if (isManaging()) {

              card.querySelector('[data-act="edit"]').onclick = (e) => { e.stopPropagation(); openEditHomeworkModal(homework.id); };
              card.querySelector('[data-act="copy"]').onclick = (e) => { e.stopPropagation(); copyItem('homework', homework.id); };
              card.querySelector('[data-act="del"]').onclick = (e) => { e.stopPropagation(); deleteItemConfirm('homework', homework.id); };

            } else {
              if (isClickable) {
                card.onclick = () => { VIEW = { name: 'homework', homeworkId: homework.id }; render(); };

                card.style.cursor = 'default';
                card.style.opacity = '0.7';
              }
