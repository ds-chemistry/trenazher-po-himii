      box.querySelector('#builderSave').onclick = async () => {
        const type = typeSel.value;
        const msg = box.querySelector('#builderMsg');
        msg.textContent = '';
        msg.style.color = 'var(--ok)';

        if (type === 'topic') {
          const name = document.getElementById('fTopicName').value.trim();
          if (!name) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название темы.'; return; }
          const id = 'topic_' + Date.now();
          const maxOrder = TOPICS.length ? Math.max(...TOPICS.map(t => t.order)) : -1;
          TOPICS.push({ id, name, order: maxOrder + 1 });
          await persistTopics();
          msg.textContent = 'Тема добавлена!';
          refreshTopicOptions();
          render();
        } else if (type === 'trainer') {
          const title = document.getElementById('fTrainerTitle').value.trim();
          const mode = document.getElementById('fTrainerMode').value;
          const taskType = document.getElementById('fTaskType').value;
          const topicId = topicSel.value;
          const assignSelect = document.getElementById('fAssignTo');
          const assignedTo = Array.from(assignSelect.selectedOptions).map(opt => opt.value).filter(v => v !== '');

          if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название тренажёра.'; return; }

          const container2 = fieldsBox.querySelector('#rxnRowsContainer');
          const rows = [...container2.querySelectorAll('.rxn-row-builder')];
          const reactions = [];
          for (const row of rows) {
            const lhs = row.querySelector('[data-field="lhs"]').value.trim();
            const answer = row.querySelector('[data-field="answer"]').value.trim();
            const explain = row.querySelector('[data-field="explain"]').value.trim();
            const full = row.querySelector('[data-field="full"]').value.trim();
            const optionsStr = row.querySelector('[data-field="options"]')?.value.trim() || '';
            if (!lhs || !answer) continue;

            const { correctSets, correctSetsDisplay, valid } = buildCorrectSets(answer, taskType);
            const isInvalid = !valid;

            const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
            reactions.push({
              lhs,
              valid: !isInvalid,
              correctSets,
              correctSetsDisplay,
              explanation: explain || '',
              fullEquation: full || (isInvalid ? 'Реакция не идёт' : ''),
              options: options || []
            });
          }
          if (reactions.length === 0) { msg.style.color = 'var(--bad)'; msg.textContent = 'Добавьте хотя бы одну реакцию.'; return; }

          const id = 'trainer_' + Date.now();
          const siblingsMax = TRAINERS.filter(t => t.topicId === topicId).reduce((m, t) => Math.max(m, t.order), -1);
          TRAINERS.push({
            id, topicId, title, order: siblingsMax + 1,
            mode, taskType,
            reactions,
            assignedTo: assignedTo && assignedTo.length > 0 ? assignedTo : null,
            isDraft: false, isLocked: false, scheduledRelease: null
          });
          await persistTrainers();
          msg.textContent = 'Тренажёр добавлен!';
          render();
        } else if (type === 'lesson') {
          const title = document.getElementById('fLessonTitle').value.trim();
          const description = document.getElementById('fLessonDesc').value.trim();
          const videoUrl = document.getElementById('fLessonVideo').value.trim();
          const topicId = topicSel.value;
          const assignSelect = document.getElementById('fAssignToLesson');
          const assignedTo = Array.from(assignSelect.selectedOptions).map(opt => opt.value).filter(v => v !== '');

          if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название урока.'; return; }

          const linkContainer = fieldsBox.querySelector('#lessonLinkRowsContainer');
          const linkRows = [...linkContainer.querySelectorAll('.rxn-row-builder')];
          const links = [];
          for (const row of linkRows) {
            const label = row.querySelector('[data-field="label"]').value.trim();
            const url = row.querySelector('[data-field="url"]').value.trim();
            if (!url) continue;
            links.push({ label: label || 'Видео', url });
          }

          const fileContainer = fieldsBox.querySelector('#lessonFileRowsContainer');
          const fileRows = [...fileContainer.querySelectorAll('.rxn-row-builder')];
          const files = [];
          for (const row of fileRows) {
            const label = row.querySelector('[data-field="label"]').value.trim();
            const url = row.querySelector('[data-field="url"]').value.trim();
            if (!url) continue;
            files.push({ label: label || 'Файл', url });
          }

          const id = 'lesson_' + Date.now();
          const siblingsMax = LESSONS.filter(l => l.topicId === topicId).reduce((m, l) => Math.max(m, l.order), -1);
          LESSONS.push({
            id, topicId, title, order: siblingsMax + 1,
            description, videoUrl, links, files,
            assignedTo: assignedTo && assignedTo.length > 0 ? assignedTo : null,
            isDraft: false, isLocked: false, scheduledRelease: null
          });
          await persistLessons();
          msg.textContent = 'Урок добавлен!';
          render();
        } else if (type === 'homework') {
          const title = document.getElementById('fHomeworkTitle').value.trim();
          const topicId = topicSel.value;
          const assignSelect = document.getElementById('fAssignToHomework');
          const assignedTo = Array.from(assignSelect.selectedOptions).map(opt => opt.value).filter(v => v !== '');

          if (!title) { msg.style.color = 'var(--bad)'; msg.textContent = 'Введите название домашки.'; return; }

          const container2 = fieldsBox.querySelector('#homeworkRowsContainer');
          const rows = [...container2.querySelectorAll('.rxn-row-builder')];
          const tasks = [];
          for (const row of rows) {
            const question = row.querySelector('[data-field="question"]').value.trim();
            const answer = row.querySelector('[data-field="answer"]').value.trim();
            const explain = row.querySelector('[data-field="explain"]').value.trim();
            if (!question || !answer) continue;
            tasks.push({ question, answer, explanation: explain || '' });
          }
          if (tasks.length === 0) { msg.style.color = 'var(--bad)'; msg.textContent = 'Добавьте хотя бы одно задание.'; return; }

          const id = 'homework_' + Date.now();
          const siblingsMax = HOMEWORKS.filter(h => h.topicId === topicId).reduce((m, h) => Math.max(m, h.order), -1);
          HOMEWORKS.push({
            id, topicId, title, order: siblingsMax + 1,
            tasks,
            assignedTo: assignedTo && assignedTo.length > 0 ? assignedTo : null,
            isDraft: false, isLocked: false, scheduledRelease: null
          });
          await persistHomeworks();
          msg.textContent = 'Домашка добавлена!';
          render();
        }
      };

      return box;
    }

    function buildAIBuilder() {
      const box = document.createElement('div');
      box.className = 'ai-builder-box';
      box.innerHTML = `
        <h3>Быстрое создание с ИИ</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Вставьте готовые материалы, и ИИ сам разобьёт их по полям.</p>
        <div class="field-row">
          <select id="aiType">
            <option value="trainer">Тренажёр</option>
            <option value="lesson">Урок</option>
            <option value="homework">Домашка</option>
          </select>
          <select id="aiTopic"></select>
        </div>
        <div class="field-row" id="aiTrainerOptionsRow">
          <select id="aiMode">
            <option value="step">Пошагово</option>
            <option value="list">Список</option>
            <option value="cards">Карты</option>
          </select>
          <select id="aiTaskType">
            <option value="text">Ввод текста</option>
            <option value="radio">Один вариант</option>
            <option value="checkbox">Несколько вариантов</option>
          </select>
        </div>
        <div class="field-row">
          <input type="text" id="aiTitle" placeholder="Название материала" style="flex:1;">
        </div>
        <div class="field-row">
          <textarea id="aiInput" placeholder="Вставьте ваши материалы. Например:&#10;N2O5 + H2O → HNO3 / HNO3 | Кислотный оксид реагирует с водой | N2O5 + H2O = 2HNO3&#10;CaO + CO2 → CaCO3 / CaCO3 | Основный оксид реагирует с кислотным оксидом | CaO + CO2 = CaCO3"></textarea>
        </div>
        <div class="field-row" id="aiSyntaxHint">
          <span style="font-size:12px;color:var(--ink-soft);">Разделитель: каждая строка — одно задание. Используйте <b>|</b> для разделения полей: задание | ответ | пояснение | полное уравнение.</span>
        </div>
        <div class="field-row">
          <label style="font-size:12px;color:var(--ink-soft);width:100%;">Доступно для учеников</label>
          <select id="aiAssignTo" multiple style="height:80px;width:100%;">
            <option value="">Все ученики</option>
          </select>
        </div>
        <button class="btn btn-accent btn-sm" id="aiGenerateBtn">Создать</button>
        <div id="aiMsg" style="margin-top:8px;font-size:12.5px;color:var(--ok);"></div>
      `;

      const typeSel = box.querySelector('#aiType');
      const topicSel = box.querySelector('#aiTopic');
      const modeSel = box.querySelector('#aiMode');
      const taskTypeSel = box.querySelector('#aiTaskType');
      const trainerOptionsRow = box.querySelector('#aiTrainerOptionsRow');
      const syntaxHint = box.querySelector('#aiSyntaxHint');
      const assignSel = box.querySelector('#aiAssignTo');
      const inputArea = box.querySelector('#aiInput');

      function refreshTopicOptions() {
        const sorted = [...TOPICS].sort((a, b) => a.order - b.order);
        topicSel.innerHTML = sorted.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
      }
      refreshTopicOptions();

      const studentsSorted = [...allStudents].sort();
      assignSel.innerHTML = '<option value="">Все ученики</option>' +
        studentsSorted.map(s => `<option value="${s}">${escapeHtml(s)}</option>`).join('');

      function updateFieldsVisibility() {
        const isTrainer = typeSel.value === 'trainer';
        trainerOptionsRow.style.display = isTrainer ? 'flex' : 'none';
        if (isTrainer && taskTypeSel.value !== 'text') {
          syntaxHint.innerHTML = `<span style="font-size:12px;color:var(--ink-soft);">Каждая строка: задание | ответ${taskTypeSel.value === 'checkbox' ? ' (через запятую, если верно несколько сразу)' : ''} | пояснение | полное уравнение | варианты (через запятую).</span>`;
        } else {
          syntaxHint.innerHTML = `<span style="font-size:12px;color:var(--ink-soft);">Разделитель: каждая строка — одно задание. Используйте <b>|</b> для разделения полей: задание | ответ | пояснение | полное уравнение.</span>`;
        }
        if (typeSel.value === 'lesson') {
          inputArea.placeholder = 'Например:\nОписание: Разбираем классификацию оксидов\nВидео: https://www.youtube.com/embed/XXXXX\nКонспект: https://drive.google.com/...';
        } else if (typeSel.value === 'homework') {
          inputArea.placeholder = 'Каждая строка: вопрос | ответ | пояснение\nНапример:\nСколько электронов у кислорода? | 8 | Порядковый номер кислорода — 8';
        } else {
          inputArea.placeholder = 'Вставьте ваши материалы. Например:\nN2O5 + H2O → HNO3 / HNO3 | Кислотный оксид реагирует с водой | N2O5 + H2O = 2HNO3\nCaO + CO2 → CaCO3 / CaCO3 | Основный оксид реагирует с кислотным оксидом | CaO + CO2 = CaCO3';
        }
      }
      typeSel.addEventListener('change', updateFieldsVisibility);
      taskTypeSel.addEventListener('change', updateFieldsVisibility);
      updateFieldsVisibility();

      box.querySelector('#aiGenerateBtn').onclick = async () => {
        const type = typeSel.value;
        const topicId = topicSel.value;
        const title = box.querySelector('#aiTitle').value.trim();
        const rawText = box.querySelector('#aiInput').value;
        const msgDiv = box.querySelector('#aiMsg');
        const mode = modeSel.value;
        const taskType = taskTypeSel.value;
        const assignedTo = Array.from(assignSel.selectedOptions).map(o => o.value).filter(v => v);

        msgDiv.textContent = '';
        msgDiv.style.color = 'var(--bad)';

        if (!title) { msgDiv.textContent = 'Введите название.'; return; }
        if (!rawText) { msgDiv.textContent = 'Вставьте материалы.'; return; }

        const lines = rawText.split('\n').filter(l => l.trim().length > 0);

        if (type === 'trainer') {
          const reactions = [];
          for (const line of lines) {
            const parts = line.split('|').map(p => p.trim());
            if (parts.length < 2) continue;
            const lhs = parts[0] || '';
            const answer = parts[1] || '';
            const explain = parts[2] || '';
            const full = parts[3] || '';
            const optionsStr = parts[4] || '';
            if (!lhs || !answer) continue;

            const { correctSets, correctSetsDisplay, valid } = buildCorrectSets(answer, taskType);
            const isInvalid = !valid;
            const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
            reactions.push({
              lhs,
              valid: !isInvalid,
              correctSets,
              correctSetsDisplay,
              explanation: explain || '',
              fullEquation: full || (isInvalid ? 'Реакция не идёт' : ''),
              options
            });
          }
          if (reactions.length === 0) { msgDiv.textContent = 'Не удалось распознать реакции.'; msgDiv.style.color = 'var(--bad)'; return; }

          const id = 'trainer_' + Date.now();
          const siblingsMax = TRAINERS.filter(t => t.topicId === topicId).reduce((m, t) => Math.max(m, t.order), -1);
          TRAINERS.push({
            id, topicId, title, order: siblingsMax + 1,
            mode, taskType,
            reactions,
            assignedTo: assignedTo.length > 0 ? assignedTo : null,
            isDraft: false, isLocked: false, scheduledRelease: null
          });
          await persistTrainers();
          msgDiv.textContent = `Тренажёр "${title}" создан с ${reactions.length} реакциями!`;
          msgDiv.style.color = 'var(--ok)';

        } else if (type === 'lesson') {
          let description = '';
          let videoUrl = '';
          const links = [];
          const files = [];

          for (const line of lines) {
            const lower = line.toLowerCase();
            if (lower.includes('описание:')) {
              description = line.split(':').slice(1).join(':').trim();
            } else if (lower.includes('видео:') || lower.includes('ссылка видео:')) {
              videoUrl = line.split(':').slice(1).join(':').trim();
            } else if (lower.includes('файл:') || lower.includes('конспект:')) {
              const parts = line.split(':');
              const label = parts[0].trim();
              const url = parts.slice(1).join(':').trim();
              files.push({ label: label || 'Файл', url });
            } else if (line.includes('http') && !lower.includes('описание:') && !lower.includes('видео:') && !lower.includes('ссылка видео:') && !lower.includes('файл:') && !lower.includes('конспект:')) {
              links.push({ label: 'Видео', url: line.trim() });
            }
          }

          if (!videoUrl && links.length === 0 && files.length === 0) {
            msgDiv.textContent = 'Добавьте хотя бы одну ссылку на видео или файл.';
            msgDiv.style.color = 'var(--bad)';
            return;
          }

          const id = 'lesson_' + Date.now();
          const siblingsMax = LESSONS.filter(l => l.topicId === topicId).reduce((m, l) => Math.max(m, l.order), -1);
          LESSONS.push({
            id, topicId, title, order: siblingsMax + 1,
            description, videoUrl, links, files,
            assignedTo: assignedTo.length > 0 ? assignedTo : null,
            isDraft: false, isLocked: false, scheduledRelease: null
          });
          await persistLessons();
          msgDiv.textContent = `Урок "${title}" создан!`;
          msgDiv.style.color = 'var(--ok)';

        } else if (type === 'homework') {
          const tasks = [];
          for (const line of lines) {
            const parts = line.split('|').map(p => p.trim());
            if (parts.length < 2) continue;
            const question = parts[0] || '';
            const answer = parts[1] || '';
            const explain = parts[2] || '';
            if (!question || !answer) continue;
            tasks.push({ question, answer, explanation: explain || '' });
          }
          if (tasks.length === 0) { msgDiv.textContent = 'Не удалось распознать задания.'; msgDiv.style.color = 'var(--bad)'; return; }

          const id = 'homework_' + Date.now();
          const siblingsMax = HOMEWORKS.filter(h => h.topicId === topicId).reduce((m, h) => Math.max(m, h.order), -1);
          HOMEWORKS.push({
            id, topicId, title, order: siblingsMax + 1,
            tasks,
            assignedTo: assignedTo.length > 0 ? assignedTo : null,
            isDraft: false, isLocked: false, scheduledRelease: null
          });
          await persistHomeworks();
          msgDiv.textContent = `Домашка "${title}" создана с ${tasks.length} заданиями!`;
          msgDiv.style.color = 'var(--ok)';
        }

        box.querySelector('#aiInput').value = '';
        box.querySelector('#aiTitle').value = '';
        render();
      };

      return box;
    }

          </select>
        </div>
        <div class="field">
          <label>Статус</label>
          <select id="editTrainerStatus">
            <option value="published" ${!trainer.isDraft && !trainer.isLocked ? 'selected' : ''}>Опубликован</option>
            <option value="draft" ${trainer.isDraft ? 'selected' : ''}>Черновик</option>
            <option value="locked" ${trainer.isLocked ? 'selected' : ''}>Заблокирован</option>
          </select>
        </div>
        <div class="field">
          <label>Отложенный выпуск (самарское время)</label>
          <input type="datetime-local" id="editTrainerRelease" value="${trainer.scheduledRelease ? getSamaraDateString(trainer.scheduledRelease) : ''}">
        </div>
        <div class="field">
          <label>Примечание для учеников (необязательно)</label>
          <textarea id="editTrainerNote" rows="2" placeholder="Например: округляйте коэффициенты..." style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical;">${escapeHtml(trainer.customNote || '')}</textarea>
        </div>
        <div class="field">
          <label>Доступно для учеников</label>
          <select id="editTrainerAssign" multiple style="height:80px;">
            <option value="">Все ученики</option>
            ${allStudents.map(s => `<option value="${s}" ${trainer.assignedTo && trainer.assignedTo.includes(s) ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
          </select>
        </div>
        <div id="editRxnRows"></div>
        <button type="button" class="add-line-btn" id="editAddRxnBtn">+ Добавить реакцию</button>
        <div class="actions">
          <button class="btn btn-ghost" id="cancelEditTrainer">Отмена</button>
          <button class="btn btn-accent" id="saveEditTrainer">Сохранить</button>
        </div>
      `;
      bg.appendChild(modal);
      document.body.appendChild(bg);
      bg.onclick = (e) => { if (e.target === bg) bg.remove(); };

      let rows = trainer.reactions.map(r => {
        let answerStr = '';
        if (r.valid && r.correctSets && r.correctSets.length > 0) {
          const displaySets = (r.correctSetsDisplay && r.correctSetsDisplay.length > 0) ? r.correctSetsDisplay : r.correctSets;
          if (trainer.taskType === 'checkbox') {
            answerStr = (displaySets[0] || []).join(',');
          } else {
            answerStr = displaySets.map(set => set.join(' + ')).join(' / ');
          }
        } else if (!r.valid) {
          answerStr = '0';
        }
        return {
          lhs: r.lhs || '',
          answer: answerStr,
          explain: r.explanation || '',
          full: r.fullEquation || '',
          options: r.options ? r.options.join(',') : ''
        };
      });

      function syncRowsFromDOM() {
        const cont = modal.querySelector('#editRxnRows');
        if (!cont) return;
        const domRows = [...cont.querySelectorAll('.rxn-row-builder')];
        domRows.forEach((rowEl, i) => {
          if (!rows[i]) return;
          rows[i] = {
            lhs: rowEl.querySelector('[data-field="lhs"]').value,
            answer: rowEl.querySelector('[data-field="answer"]').value,
            explain: rowEl.querySelector('[data-field="explain"]').value,
            full: rowEl.querySelector('[data-field="full"]').value,
            options: rowEl.querySelector('[data-field="options"]')?.value || ''
          };
        });
      }

      function renderRows() {
        const cont = modal.querySelector('#editRxnRows');
        cont.innerHTML = rows.map((r, i) => `
          <div class="rxn-row-builder" data-row="${i}">
            <div class="rrb-head"><span>Реакция ${i+1}</span>${rows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
            <div class="builder-line"><div class="ln-label">1</div><input type="text" data-field="lhs" data-row="${i}" value="${escapeAttr(r.lhs)}" placeholder="Задание"></div>
            <div class="builder-line"><div class="ln-label">2</div><input type="text" data-field="answer" data-row="${i}" value="${escapeAttr(r.answer)}" placeholder="Ответ (варианты через /)"></div>
            <div class="builder-line"><div class="ln-label">3</div><input type="text" data-field="explain" data-row="${i}" value="${escapeAttr(r.explain)}" placeholder="Пояснение"></div>
            <div class="builder-line"><div class="ln-label">4</div><input type="text" data-field="full" data-row="${i}" value="${escapeAttr(r.full)}" placeholder="Полное уравнение"></div>
            <div class="builder-line"><div class="ln-label">5</div><input type="text" data-field="options" data-row="${i}" value="${escapeAttr(r.options)}" placeholder="Варианты (через запятую)"></div>
          </div>
        `).join('');
        cont.querySelectorAll('[data-remove]').forEach(btn => {
          btn.onclick = () => {
            syncRowsFromDOM();
            const i = parseInt(btn.dataset.remove);
            rows.splice(i, 1);
            renderRows();
          };
        });
      }
      renderRows();

      modal.querySelector('#editAddRxnBtn').onclick = () => {
        syncRowsFromDOM();
        rows.push({ lhs: '', answer: '', explain: '', full: '', options: '' });
        renderRows();
      };
      modal.querySelector('#cancelEditTrainer').onclick = () => bg.remove();

      modal.querySelector('#saveEditTrainer').onclick = async () => {
        const title = document.getElementById('editTrainerTitle').value.trim();
        const mode = document.getElementById('editTrainerMode').value;
        const taskType = document.getElementById('editTaskType').value;
        const status = document.getElementById('editTrainerStatus').value;
        const releaseDate = document.getElementById('editTrainerRelease').value;
        const customNote = document.getElementById('editTrainerNote').value.trim();
        const assignSelect = document.getElementById('editTrainerAssign');
        const assignedTo = Array.from(assignSelect.selectedOptions).map(opt => opt.value).filter(v => v !== '');

        if (!title) { alert('Введите название'); return; }

        const cont = modal.querySelector('#editRxnRows');
        const domRows = [...cont.querySelectorAll('.rxn-row-builder')];
        const newReactions = [];
        for (const row of domRows) {
          const lhs = row.querySelector('[data-field="lhs"]').value.trim();
          const answer = row.querySelector('[data-field="answer"]').value.trim();
          const explain = row.querySelector('[data-field="explain"]').value.trim();
          const full = row.querySelector('[data-field="full"]').value.trim();
          const optionsStr = row.querySelector('[data-field="options"]')?.value.trim() || '';
          if (!lhs || !answer) continue;

          const { correctSets, correctSetsDisplay, valid } = buildCorrectSets(answer, taskType);
          const isInvalid = !valid;

          const options = optionsStr ? optionsStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];
          newReactions.push({
            lhs,
            valid: !isInvalid,
            correctSets,
            correctSetsDisplay,
            explanation: explain || '',
            fullEquation: full || (isInvalid ? 'Реакция не идёт' : ''),
            options: options || []
          });
        }
        if (newReactions.length === 0) { alert('Добавьте хотя бы одну реакцию'); return; }

        trainer.title = title;
        trainer.mode = mode;
        trainer.taskType = taskType;
        trainer.isDraft = status === 'draft';
        trainer.isLocked = status === 'locked';
        trainer.scheduledRelease = releaseDate ? getSamaraTimestamp(releaseDate) : null;
        trainer.customNote = customNote || '';
        trainer.assignedTo = assignedTo && assignedTo.length > 0 ? assignedTo : null;
        trainer.reactions = newReactions;

        await persistTrainers();
        bg.remove();
        render();
      };
    }

        [...cont.querySelectorAll('.rxn-row-builder')].forEach((rowEl, i) => {

            label: rowEl.querySelector('[data-field="label"]').value,
            url: rowEl.querySelector('[data-field="url"]').value
          };

      function syncFileRowsFromDOM() {
        const cont = modal.querySelector('#editLessonFiles');
        if (!cont) return;
        [...cont.querySelectorAll('.rxn-row-builder')].forEach((rowEl, i) => {
          if (!fileRows[i]) return;
          fileRows[i] = {
            label: rowEl.querySelector('[data-field="label"]').value,
            url: rowEl.querySelector('[data-field="url"]').value
          };
        });

      function renderLinkRows() {
        const cont = modal.querySelector('#editLessonLinks');
        cont.innerHTML = linkRows.map((r, i) => `
          <div class="rxn-row-builder" data-row="${i}">
            <div class="rrb-head"><span>Видео ${i+1}</span>${linkRows.length>1?`<button type="button" class="icon-btn danger" data-remove="${i}">✕</button>`:''}</div>
            <div class="builder-line"><div class="ln-label">1</div><input type="text" data-field="label" data-row="${i}" value="${escapeAttr(r.label||'')}" placeholder="Название"></div>
            <div class="builder-line"><div class="ln-label">2</div><input type="text" data-field="url" data-row="${i}" value="${escapeAttr(r.url||'')}" placeholder="Ссылка"></div>

            syncLinkRowsFromDOM();
            const i = parseInt(btn.dataset.remove);
            linkRows.splice(i, 1);
            renderLinkRows();
          };
        });

      function renderFileRows() {
        const cont = modal.querySelector('#editLessonFiles');
        cont.innerHTML = fileRows.map((r, i) => `
          <div class="rxn-row-builder" data-row="${i}">

      modal.querySelector('#editAddLessonFile').onclick = () => {

      modal.querySelector('#saveEditLesson').onclick = async () => {

        for (const row of fileDomRows) {
          const label = row.querySelector('[data-field="label"]').value.trim();

          files.push({ label: label || 'Файл', url });

        lesson.links = links;
        lesson.files = files;

        await persistLessons();
        bg.remove();
        render();
      };
    }

    function openEditHomeworkModal(homeworkId) {
      const homework = HOMEWORKS.find(h => h.id === homeworkId);

      const modal = document.createElement('div');

          <div class="rxn-row-builder" data-row="${i}">

        if (tasks.length === 0) { alert('Добавьте хотя бы одно задание'); return; }

    (async function init() {
      await loadPlatforms();
      loadActivePlatform();

      const restored = tryRestoreSession();
      if (restored) {
        if (CURRENT_USER && !CURRENT_USER.isTeacher) {
          const reg = await loadRegistry();
          if (!reg[CURRENT_USER.key]) {
            handleLogout();
            return;
          }
        }
        renderPlatformsBar();
        await startApp();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        renderPlatformsBar();
      }
    })();

    window.exitTeachMode = window.exitTeachMode;

    window.copyItem = window.copyItem;
    window.showConfirmModal = window.showConfirmModal;
    window.showPromptModal = window.showPromptModal;
    window.deletePlatform = window.deletePlatform;
    window.moveItemToTopic = moveItemToTopic;
    window.showPlatformSettingsModal = window.showPlatformSettingsModal;

    console.log('Платформа успешно загружена!');

    console.log(`Учеников: ${allStudents.length}`);
    console.log(`Тренажёров: ${TRAINERS.length}`);
    console.log(`Уроков: ${LESSONS.length}`);
    console.log(`Домашек: ${HOMEWORKS.length}`);
