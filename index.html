async function renderTrainer(container, trainerId) {
  const trainer = TRAINERS.find(t => t.id === trainerId);
  if (!trainer) { VIEW = { name: 'home' }; render(); return; }
  if (TEACH_MODE && isHiddenInTeach(trainer)) { VIEW = { name: 'home' }; render(); return; }
  const isRealStudent = !CURRENT_USER.isTeacher;
  let progress = isRealStudent ? await getProgress(CURRENT_USER.key) : {};
  if (!progress[trainerId]) progress[trainerId] = {};
  const trainerProgress = progress[trainerId];
  let reactions = trainer.reactions || [];
  if (trainer.randomOrderMap && trainer.randomOrderMap.length === reactions.length) {
    reactions = trainer.randomOrderMap.map(i => (trainer.reactions || [])[i]).filter(Boolean);
  }
  const mode = trainer.mode || 'step';
  const taskType = trainer.taskType || 'text';
  const allowChoice = !!trainer.allowModeChoice;

  const wrap = document.createElement('div');
  const backRow = document.createElement('div');
  backRow.className = 'back-row';
  backRow.innerHTML = `<button class="back-btn">← Назад к содержанию</button>`;
  backRow.querySelector('.back-btn').onclick = window.goHome;
  wrap.appendChild(backRow);

  const head = document.createElement('div');
  head.className = 'trainer-head';
  let noteHtml = '';
  if (trainer.customNote) noteHtml += `<div>${escapeHtmlMultiline(trainer.customNote)}</div>`;
  if (trainer.noteImage) noteHtml += `<img src="${trainer.noteImage}" alt="Примечание" onclick="openImageLightbox(this.src)">`;
  head.innerHTML = noteHtml
    ? `<h2>${escapeHtml(trainer.title)}</h2><div class="trainer-note">${noteHtml}</div>`
    : `<h2>${escapeHtml(trainer.title)}</h2>`;
  wrap.appendChild(head);

  if (isManaging() || (isRealStudent && allowChoice)) {
    const modeSelector = document.createElement('div');
    modeSelector.className = 'trainer-mode-selector';
    modeSelector.innerHTML = `
      <button class="btn btn-sm ${mode === 'step' ? 'active' : ''}" id="modeStep">Пошагово</button>
      <button class="btn btn-sm ${mode === 'list' ? 'active' : ''}" id="modeList">Список</button>
      <button class="btn btn-sm ${mode === 'cards' ? 'active' : ''}" id="modeCards">Карты</button>
    `;
    const onMode = (newMode) => {
      trainer.mode = newMode;
      if (isManaging()) persistTrainers().then(() => renderTrainer(container, trainerId));
      else { trainerProgress.__chosenMode = newMode; persistFullProgress(CURRENT_USER.key, progress).then(() => renderTrainer(container, trainerId)); }
    };
    modeSelector.querySelector('#modeStep').onclick = () => onMode('step');
    modeSelector.querySelector('#modeList').onclick = () => onMode('list');
    modeSelector.querySelector('#modeCards').onclick = () => onMode('cards');
    wrap.appendChild(modeSelector);
  }
  let effectiveMode = mode;
  if (isRealStudent && allowChoice && trainerProgress.__chosenMode) effectiveMode = trainerProgress.__chosenMode;

  const content = document.createElement('div');
  wrap.appendChild(content);
  const footer = document.createElement('div');
  footer.className = 'trainer-footer';
  wrap.appendChild(footer);
  container.appendChild(wrap);

  const trainerForRender = { ...trainer, reactions };
  if (effectiveMode === 'step') renderStepMode(content, footer, trainerForRender, trainerProgress, isRealStudent, progress, taskType);
  else if (effectiveMode === 'list') renderListMode(content, footer, trainerForRender, trainerProgress, isRealStudent, progress, taskType);
  else if (effectiveMode === 'cards') renderCardsMode(content, footer, trainerForRender, trainerProgress, isRealStudent, progress, taskType);
  else renderStepMode(content, footer, trainerForRender, trainerProgress, isRealStudent, progress, taskType);
}

function renderStepMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType) {
  const reactions = trainer.reactions || [];
  const total = reactions.length;
  let currentIndex = trainerProgress.currentIndex || 0;
  let statuses = trainerProgress.statuses || Array(total).fill('unanswered');
  let answers = trainerProgress.answers || Array(total).fill('');
  let round = trainerProgress.round || 1;

  function saveState() {
    if (isRealStudent) {
      trainerProgress.currentIndex = currentIndex;
      trainerProgress.statuses = statuses;
      trainerProgress.answers = answers;
      trainerProgress.round = round;
      persistFullProgress(CURRENT_USER.key, progress);
    }
  }
  function getPendingIndices() {
    return statuses.map((s, i) => ({ s, i })).filter(({ s }) => s === 'wrong' || s === 'skipped').map(({ i }) => i);
  }
  function isAllCorrect() { return statuses.every(s => s === 'correct'); }
  function getAvailableIndices() {
    if (round === 1) return Array.from({ length: total }, (_, i) => i);
    return getPendingIndices();
  }
  function goToNextAvailable() {
    if (round === 1) {
      if (currentIndex < total - 1) { currentIndex++; saveState(); renderStep(); return; }
      const pending = getPendingIndices();
      if (pending.length > 0) { round = 2; currentIndex = pending[0]; }
      saveState(); renderStep(); return;
    } else {
      const pending = getPendingIndices();
      if (pending.length === 0) { saveState(); renderStep(); return; }
      const nextIdx = pending.find(i => i > currentIndex);
      currentIndex = nextIdx !== undefined ? nextIdx : pending[0];
      saveState(); renderStep();
    }
  }

  function renderStep() {
    content.innerHTML = '';
    const noteEl = content.parentElement.querySelector('.trainer-note');
    if (noteEl && currentIndex > 0 && !trainer.keepNote) noteEl.style.display = 'none';
    else if (noteEl) noteEl.style.display = '';
    const progDiv = document.createElement('div');
    progDiv.className = 'progress-rounds';
    const correct = statuses.filter(s => s === 'correct').length;
    const mr = document.createElement('div');
    mr.className = 'progress-round';
    mr.innerHTML = `<div class="label">Основной раунд</div><div class="bar"><div class="fill" style="width:${total ? Math.round(correct/total*100) : 0}%"></div></div><div class="count">${correct}/${total}</div>`;
    progDiv.appendChild(mr);
    content.appendChild(progDiv);

    if (isAllCorrect()) {
      const finishDiv = document.createElement('div');
      finishDiv.className = 'rxn-step';
      finishDiv.innerHTML = `<div style="text-align:center;padding:20px 0;"><div style="width:48px;height:48px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;">✓</div><h3 style="margin:0 0 8px;">Все реакции решены правильно</h3><div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn btn-accent" id="finishTrainerBtn">Закончить тренажёр</button><button class="btn btn-ghost" id="restartTrainerBtn">Пройти заново</button></div></div>`;
      content.appendChild(finishDiv);
      finishDiv.querySelector('#finishTrainerBtn').onclick = () => { trainerProgress.__finished = true; if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress); showFinishedScreen(); };
      finishDiv.querySelector('#restartTrainerBtn').onclick = () => {
        window.showConfirmModal('Начать заново?', 'Весь прогресс по этому тренажёру будет сброшен.', async () => {
          trainerProgress.statuses = Array(total).fill('unanswered');
          trainerProgress.answers = Array(total).fill('');
          trainerProgress.currentIndex = 0; trainerProgress.round = 1; trainerProgress.__finished = false;
          statuses = trainerProgress.statuses; answers = trainerProgress.answers; currentIndex = 0; round = 1;
          saveState(); renderStep();
        }, 'Начать заново', 'btn-accent');
      };
      footer.innerHTML = '';
      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-accent';
      finishBtn.textContent = 'Закончить тренажёр';
      finishBtn.onclick = () => { trainerProgress.__finished = true; if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress); showFinishedScreen(); };
      footer.appendChild(finishBtn);
      return;
    }

    const avail = getAvailableIndices();
    if (avail.length === 0) { renderStep(); return; }
    if (!avail.includes(currentIndex)) { currentIndex = avail[0]; saveState(); }
    const rxn = reactions[currentIndex];
    const entry = { status: statuses[currentIndex], answer: answers[currentIndex] || '' };
    const card = document.createElement('div');
    card.className = 'rxn-step';
    const isCorrect = entry.status === 'correct';
    const isWrong = entry.status === 'wrong';
    const fs = stepFontSize(trainer, rxn);
    let inputHtml = '';
    if (taskType === 'text') {
      inputHtml = `<div class="rxn-input-row"><input type="text" class="rxn-input ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}" placeholder="Введите ответ" value="${escapeHtml(entry.answer || '')}" id="stepInput" ${isCorrect ? 'disabled' : ''}></div>`;
    } else if (taskType === 'radio') {
      const options = rxn.options || [];
      inputHtml = `<div class="options-group" id="stepOptions">${options.map(opt => `<label><input type="radio" name="stepRadio" value="${escapeAttr(opt)}" ${entry.answer === opt && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div>`;
    } else if (taskType === 'checkbox') {
      const options = rxn.options || [];
      const selected = entry.answer ? entry.answer.split(',') : [];
      inputHtml = `<div class="options-group" id="stepOptions">${options.map(opt => `<label><input type="checkbox" name="stepCheckbox" value="${escapeAttr(opt)}" ${selected.includes(opt) && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div>`;
    }
    card.innerHTML = `
      <div class="rxn-num">Реакция ${currentIndex+1} ${round === 2 ? '· Доработка' : ''}</div>
      <div class="rxn-eq eqx"${sizeStyle(fs)}>${renderEquation(rxn.lhs)}</div>
      ${renderTaskImagesHtml(rxn, false)}
      ${renderHtmlContent(rxn.htmlContent)}
      ${inputHtml}
      <div class="rxn-actions"><button class="btn btn-sm btn-accent" id="stepCheck" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost" id="stepRetry">Повторить</button><button class="btn btn-sm btn-ghost" id="stepSkip" ${round === 2 ? 'disabled' : ''}>Пропустить</button></div>
      <div class="feedback-slot"></div>
      <div class="step-nav"><span class="nav-info"></span></div>
    `;
    const checkBtn = card.querySelector('#stepCheck');
    const retryBtn = card.querySelector('#stepRetry');
    const skipBtn = card.querySelector('#stepSkip');
    const fbSlot = card.querySelector('.feedback-slot');
    const prevBtn = document.createElement('button'); prevBtn.className = 'flank-btn'; prevBtn.type = 'button'; prevBtn.textContent = '◀';
    const nextBtn = document.createElement('button'); nextBtn.className = 'flank-btn'; nextBtn.type = 'button'; nextBtn.textContent = '▶';

    function getInputValue() {
      if (taskType === 'text') return card.querySelector('#stepInput')?.value?.trim() || '';
      if (taskType === 'radio') { const c = card.querySelector('input[name="stepRadio"]:checked'); return c ? c.value : ''; }
      if (taskType === 'checkbox') { const c = card.querySelectorAll('input[name="stepCheckbox"]:checked'); return Array.from(c).map(el => el.value).join(','); }
      return '';
    }
    function disableInputs(d) {
      if (taskType === 'text') { const i = card.querySelector('#stepInput'); if (i) i.disabled = d; }
      else card.querySelectorAll('input').forEach(inp => inp.disabled = d);
    }
    function showFeedback(isCorrectVal) {
      fbSlot.innerHTML = '';
      const fb = document.createElement('div');
      fb.className = 'rxn-feedback ' + (isCorrectVal ? 'ok' : 'bad');
      fb.textContent = isCorrectVal ? 'Верно!' : 'Неверно. Попробуй ещё раз.';
      fbSlot.appendChild(fb);
      if (taskType === 'text') { const inp = card.querySelector('#stepInput'); if (inp) inp.className = 'rxn-input ' + (isCorrectVal ? 'correct' : 'wrong'); }
    }
    if (isCorrect) showFeedback(true);

    checkBtn.onclick = () => {
      if (isCorrect) return;
      const val = getInputValue();
      if (!val) { alert('Введите ответ'); return; }
      if (checkAnswer(rxn, val, taskType)) {
        statuses[currentIndex] = 'correct'; answers[currentIndex] = val;
        disableInputs(true); checkBtn.disabled = true; showFeedback(true);
      } else {
        statuses[currentIndex] = 'wrong'; answers[currentIndex] = val; showFeedback(false);
        if (isRealStudent && CURRENT_USER.errorsEnabled !== false) {
          recordError(progress, CURRENT_USER.key, true, {
            sourceType: 'trainer', sourceId: trainer.id, sourceTitle: trainer.title,
            topicId: trainer.topicId, taskIdx: currentIndex, question: rxn.lhs || '',
            correctAnswer: (rxn.correctSetsDisplay && rxn.correctSetsDisplay[0]) ? rxn.correctSetsDisplay[0].join(taskType === 'checkbox' ? ', ' : ' + ') : (rxn.valid ? '' : '0'),
            explanation: rxn.explanation || '', images: getTaskImages(rxn), taskType, options: rxn.options || [], htmlContent: rxn.htmlContent || ''
          });
        }
      }
      saveState(); updateNav();
    };
    retryBtn.onclick = () => {
      statuses[currentIndex] = 'unanswered'; disableInputs(false); checkBtn.disabled = false; fbSlot.innerHTML = '';
      if (taskType === 'text') { const inp = card.querySelector('#stepInput'); if (inp) inp.className = 'rxn-input'; }
      saveState(); updateNav();
    };
    skipBtn.onclick = () => {
      if (round === 2) return;
      statuses[currentIndex] = 'skipped'; answers[currentIndex] = getInputValue() || '';
      if (isRealStudent && CURRENT_USER.errorsEnabled !== false) {
        recordError(progress, CURRENT_USER.key, true, {
          sourceType: 'trainer', sourceId: trainer.id, sourceTitle: trainer.title,
          topicId: trainer.topicId, taskIdx: currentIndex, question: rxn.lhs || '',
          correctAnswer: (rxn.correctSetsDisplay && rxn.correctSetsDisplay[0]) ? rxn.correctSetsDisplay[0].join(taskType === 'checkbox' ? ', ' : ' + ') : (rxn.valid ? '' : '0'),
          explanation: rxn.explanation || '', images: getTaskImages(rxn), taskType, options: rxn.options || [], htmlContent: rxn.htmlContent || ''
        });
      }
      saveState(); goToNextAvailable();
    };
    function updateNav() {
      const availNow = getAvailableIndices();
      const currIdx = availNow.indexOf(currentIndex);
      const navInfo = card.querySelector('.nav-info');
      if (navInfo) navInfo.textContent = `${currIdx + 1} / ${availNow.length}`;
      prevBtn.disabled = currIdx <= 0; nextBtn.disabled = false;
    }
    prevBtn.onclick = () => { const a = getAvailableIndices(); const ci = a.indexOf(currentIndex); if (ci > 0) { currentIndex = a[ci - 1]; saveState(); renderStep(); } };
    nextBtn.onclick = () => goToNextAvailable();
    const navRow = card.querySelector('.step-nav');
    navRow.insertBefore(prevBtn, navRow.querySelector('.nav-info'));
    navRow.appendChild(nextBtn);
    content.appendChild(card);
    attachImageZoomHandlers(content);
    updateNav();

    footer.innerHTML = '';
    const totalBtn = document.createElement('button');
    totalBtn.className = 'btn btn-ghost btn-sm';
    totalBtn.textContent = 'Показать все реакции';
    totalBtn.onclick = () => {
      const modalBg = document.createElement('div'); modalBg.className = 'modal-bg';
      const modal = document.createElement('div'); modal.className = 'modal';
      modal.innerHTML = `<h3>Все реакции</h3><div id="allReactionsList" style="max-height:400px;overflow-y:auto;"></div><div class="actions"><button class="btn btn-ghost" id="closeAllReactions">Закрыть</button></div>`;
      modalBg.appendChild(modal); document.body.appendChild(modalBg);
      const listEl = modal.querySelector('#allReactionsList');
      const statusMap = { correct: '<span style="color:var(--ok);font-weight:700;">Верно</span>', wrong: '<span style="color:var(--bad);font-weight:700;">Неверно</span>', skipped: '<span style="color:var(--ink-soft);">Пропущено</span>', unanswered: '<span style="color:var(--ink-soft);">Без ответа</span>' };
      reactions.forEach((r, i) => {
        const row = document.createElement('div');
        row.style.cssText = 'padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;';
        row.innerHTML = `<span>${i+1}. ${renderEquation(r.lhs)}</span><span style="font-size:12px;">${statusMap[statuses[i]] || statusMap.unanswered} ${answers[i] ? escapeHtml(answers[i]) : ''}</span>`;
        listEl.appendChild(row);
      });
      modalBg.onclick = (e) => { if (e.target === modalBg) modalBg.remove(); };
      modal.querySelector('#closeAllReactions').onclick = () => modalBg.remove();
    };
    footer.appendChild(totalBtn);
  }
  function showFinishedScreen() {
    showSimpleCardsCompletion(content, footer, trainer, trainerProgress, isRealStudent, progress, async () => {
      trainerProgress.statuses = Array(reactions.length).fill('unanswered');
      trainerProgress.answers = Array(reactions.length).fill('');
      trainerProgress.currentIndex = 0; trainerProgress.round = 1;
      if (isRealStudent) await persistFullProgress(CURRENT_USER.key, progress);
      renderStepMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
    }, () => { renderStepReviewMode(content, footer, trainer, trainerProgress, taskType, showFinishedScreen); });
  }
  if (trainerProgress.__finished) showFinishedScreen();
  else renderStep();
}
function renderListMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType) {
  const reactions = trainer.reactions || [];
  const total = reactions.length;
  let statuses = trainerProgress.statuses || Array(total).fill('unanswered');
  let answers = trainerProgress.answers || Array(total).fill('');
  function saveState() {
    if (isRealStudent) { trainerProgress.statuses = statuses; trainerProgress.answers = answers; persistFullProgress(CURRENT_USER.key, progress); }
  }
  const list = document.createElement('div');
  list.className = 'rxn-list';
  content.appendChild(list);
  attachImageZoomHandlers(content);

  function renderList() {
    list.innerHTML = '';
    reactions.forEach((rxn, idx) => {
      const entry = { status: statuses[idx] || 'unanswered', answer: answers[idx] || '' };
      const isCorrect = entry.status === 'correct';
      const isWrong = entry.status === 'wrong';
      const card = document.createElement('div');
      card.className = 'rxn-card' + (isCorrect ? ' state-correct' : isWrong ? ' state-wrong' : '');
      const fs = taskFontSize(trainer, rxn);
      let inputHtml = '';
      if (taskType === 'text') {
        inputHtml = `<div class="rxn-input-row"><input type="text" class="rxn-input ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}" placeholder="Введите ответ" value="${escapeHtml(entry.answer || '')}" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}><button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button></div>`;
      } else if (taskType === 'radio') {
        const options = rxn.options || [];
        inputHtml = `<div class="options-group" data-idx="${idx}">${options.map(opt => `<label><input type="radio" name="radio_${idx}" value="${escapeAttr(opt)}" ${entry.answer === opt && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button></div>`;
      } else if (taskType === 'checkbox') {
        const options = rxn.options || [];
        const selected = entry.answer ? entry.answer.split(',') : [];
        inputHtml = `<div class="options-group" data-idx="${idx}">${options.map(opt => `<label><input type="checkbox" name="check_${idx}" value="${escapeAttr(opt)}" ${selected.includes(opt) && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button></div>`;
      }
      card.innerHTML = `
        <div class="rxn-num">Реакция ${idx+1}</div>
        <div class="rxn-eq eqx"${sizeStyle(fs)}>${renderEquation(rxn.lhs)}</div>
        ${renderTaskImagesHtml(rxn, false)}
        ${renderHtmlContent(rxn.htmlContent)}
        ${inputHtml}
        <div class="feedback-slot"></div>
      `;
      const fbSlot = card.querySelector('.feedback-slot');
      if (entry.status === 'correct') fbSlot.innerHTML = '<div class="rxn-feedback ok">Верно!</div>';
      else if (entry.status === 'wrong') fbSlot.innerHTML = '<div class="rxn-feedback bad">Неверно. Попробуй ещё раз.</div>';
      const checkBtn = card.querySelector('.check-btn');
      if (checkBtn) {
        checkBtn.onclick = () => {
          let val = '';
          if (taskType === 'text') { const inp = card.querySelector('.rxn-input'); val = inp.value.trim(); if (!val) { alert('Введите ответ'); return; } }
          else if (taskType === 'radio') { const c = card.querySelector(`input[name="radio_${idx}"]:checked`); if (!c) { alert('Выберите вариант'); return; } val = c.value; }
          else if (taskType === 'checkbox') { const c = card.querySelectorAll(`input[name="check_${idx}"]:checked`); if (c.length === 0) { alert('Выберите хотя бы один вариант'); return; } val = Array.from(c).map(el => el.value).join(','); }
          if (checkAnswer(rxn, val, taskType)) {
            statuses[idx] = 'correct'; answers[idx] = val;
            if (taskType === 'text') { const i = card.querySelector('.rxn-input'); i.className = 'rxn-input correct'; i.disabled = true; }
            else card.querySelectorAll('input').forEach(inp => inp.disabled = true);
            checkBtn.disabled = true;
            fbSlot.innerHTML = '<div class="rxn-feedback ok">Верно!</div>';
            card.className = 'rxn-card state-correct';
          } else {
            statuses[idx] = 'wrong'; answers[idx] = val;
            if (taskType === 'text') card.querySelector('.rxn-input').className = 'rxn-input wrong';
            fbSlot.innerHTML = '<div class="rxn-feedback bad">Неверно. Попробуй ещё раз.</div>';
            card.className = 'rxn-card state-wrong';
            if (isRealStudent && CURRENT_USER.errorsEnabled !== false) {
              recordError(progress, CURRENT_USER.key, true, {
                sourceType: 'trainer', sourceId: trainer.id, sourceTitle: trainer.title,
                topicId: trainer.topicId, taskIdx: idx, question: rxn.lhs || '',
                correctAnswer: (rxn.correctSetsDisplay && rxn.correctSetsDisplay[0]) ? rxn.correctSetsDisplay[0].join(taskType === 'checkbox' ? ', ' : ' + ') : (rxn.valid ? '' : '0'),
                explanation: rxn.explanation || '', images: getTaskImages(rxn), taskType, options: rxn.options || [], htmlContent: rxn.htmlContent || ''
              });
            }
          }
          saveState(); updateStats();
        };
      }
      const retryBtn = card.querySelector('.retry-btn');
      if (retryBtn) {
        retryBtn.onclick = () => {
          statuses[idx] = 'unanswered';
          if (taskType === 'text') { const i = card.querySelector('.rxn-input'); i.className = 'rxn-input'; i.disabled = false; checkBtn.disabled = false; }
          else { card.querySelectorAll('input').forEach(inp => inp.disabled = false); checkBtn.disabled = false; }
          fbSlot.innerHTML = ''; card.className = 'rxn-card';
          saveState(); updateStats();
        };
      }
      list.appendChild(card);
    });
  }
  function updateStats() {
    const correct = statuses.filter(s => s === 'correct').length;
    const wrong = statuses.filter(s => s === 'wrong').length;
    const unanswered = statuses.filter(s => s === 'unanswered' || !s).length;
    const stats = document.createElement('div');
    stats.className = 'trainer-summary';
    stats.innerHTML = `Правильно: ${correct} · Неправильно: ${wrong} · Осталось: ${unanswered}`;
    const old = footer.querySelector('.trainer-summary');
    if (old) old.remove();
    footer.prepend(stats);
  }
  function showFinishedScreen() {
    showSimpleCardsCompletion(content, footer, trainer, trainerProgress, isRealStudent, progress, async () => {
      statuses = Array(total).fill('unanswered'); answers = Array(total).fill('');
      trainerProgress.statuses = statuses; trainerProgress.answers = answers;
      if (isRealStudent) await persistFullProgress(CURRENT_USER.key, progress);
      renderListMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
    }, () => { renderListReview(content, footer, trainer, trainerProgress, taskType, showFinishedScreen); });
  }
  if (trainerProgress.__finished) { showFinishedScreen(); return; }
  renderList(); updateStats();
  const finishBtn = document.createElement('button');
  finishBtn.className = 'btn btn-accent';
  finishBtn.textContent = 'Закончить тренажёр';
  finishBtn.onclick = () => {
    const correct = statuses.filter(s => s === 'correct').length;
    if (correct === total) { trainerProgress.__finished = true; if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress); showFinishedScreen(); }
    else alert(`Вы ответили правильно на ${correct} из ${total} реакций. Доработайте остальные!`);
  };
  footer.appendChild(finishBtn);
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn btn-ghost btn-sm';
  resetBtn.textContent = 'Сбросить все ответы';
  resetBtn.onclick = () => {
    window.showConfirmModal('Начать заново?', 'Весь прогресс по этому тренажёру будет сброшен.', async () => {
      statuses = Array(total).fill('unanswered'); answers = Array(total).fill('');
      trainerProgress.statuses = statuses; trainerProgress.answers = answers; trainerProgress.__finished = false;
      saveState(); renderList(); updateStats();
    }, 'Начать заново', 'btn-accent');
  };
  footer.appendChild(resetBtn);
}

function renderListReview(content, footer, trainer, trainerProgress, taskType, exitFn) {
  const reactions = trainer.reactions || [];
  content.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'rxn-list';

        const isRight = correctSet.some(c => c.toUpperCase() === opt.trim().toUpperCase());

      ${renderHtmlContent(rxn.htmlContent)}

      <div class="rxn-explain" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);">

        <div style="font-size:15px;font-weight:600;color:var(--ok);margin-top:6px;">Правильный ответ: ${renderEquation(correctAnswerText)}</div>

  footer.innerHTML = '';
  const backBtn = document.createElement('button');

  backBtn.textContent = '← Назад к результату';

}

function showSimpleCardsCompletion(content, footer, item, itemProgress, isRealStudent, progress, reopenFn, reviewFn) {
  content.innerHTML = ''; footer.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'rxn-step'; div.style.textAlign = 'center';

  }

}

function renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType, reviewMode) {
  const reactions = trainer.reactions || [];
  const total = reactions.length;
  if (total === 0) { content.innerHTML = `<div class="empty-note">В этом тренажёре нет реакций.</div>`; return; }
  if (trainerProgress.__finished && !reviewMode) {
    showSimpleCardsCompletion(content, footer, trainer, trainerProgress, isRealStudent, progress, () => {
      renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType);
    }, () => {
      renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType, true);
    });
    return;
  }
  let currentIndex = 0;
  let showAnswer = false;
  function renderCard() {
    content.innerHTML = '';
    const noteEl = content.parentElement.querySelector('.trainer-note');
    if (noteEl && currentIndex > 0 && !trainer.keepNote) noteEl.style.display = 'none';
    else if (noteEl) noteEl.style.display = '';
    const rxn = reactions[currentIndex];
    const lhs = rxn.lhs || '';
    let fullAnswer = '';
    if (rxn.valid && rxn.correctSets && rxn.correctSets.length > 0) {
      const ds = (rxn.correctSetsDisplay && rxn.correctSetsDisplay.length > 0) ? rxn.correctSetsDisplay : rxn.correctSets;
      if (taskType === 'checkbox') fullAnswer = (ds[0] || []).join(', ');
      else { fullAnswer = (ds[0] || []).join(' + '); if (ds.length > 1) fullAnswer = ds.map(set => set.join(' + ')).join(' / '); }
    } else if (!rxn.valid) fullAnswer = '0 (не идёт)';
    else fullAnswer = 'Нет правильного ответа';
    const fs = stepFontSize(trainer, rxn);
    const card = document.createElement('div');
    card.className = 'flash-card';
    card.innerHTML = `
      <div class="card-number">${currentIndex + 1} / ${total}</div>
      <div class="card-question eqx"${sizeStyle(fs)}>${showAnswer ? renderEquation(lhs + ' ' + fullAnswer) : renderEquation(lhs)}</div>
      ${renderTaskImagesHtml(rxn, true)}
      ${renderHtmlContent(rxn.htmlContent)}
      <div class="card-actions"><button class="btn btn-accent" id="showAnswerBtn">${showAnswer ? 'Скрыть ответ' : 'Показать ответ'}</button></div>
      <div class="card-nav"><button class="nav-btn" id="prevCardBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button><span class="nav-info">${currentIndex + 1} / ${total}</span><button class="nav-btn" id="nextCardBtn" ${currentIndex === total - 1 ? 'disabled' : ''}>Вперёд ▶</button></div>
      ${showAnswer && rxn.explanation ? `<div style="margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center;padding:8px 16px;border-top:1px solid var(--line);">${escapeHtml(rxn.explanation)}</div>` : ''}
    `;
    content.appendChild(card);
    attachImageZoomHandlers(content);
    card.querySelector('#showAnswerBtn').onclick = () => { showAnswer = !showAnswer; renderCard(); };
    card.querySelector('#prevCardBtn').onclick = () => { if (currentIndex > 0) { currentIndex--; showAnswer = false; renderCard(); } };
    card.querySelector('#nextCardBtn').onclick = () => { if (currentIndex < total - 1) { currentIndex++; showAnswer = false; renderCard(); } };
    footer.innerHTML = '';
    const backToHome = document.createElement('button');
    backToHome.className = 'btn btn-ghost btn-sm';
    backToHome.textContent = reviewMode ? '← Назад к результату' : '← К содержанию';
    backToHome.onclick = reviewMode ? () => { renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType); } : window.goHome;
    footer.appendChild(backToHome);
    if (!reviewMode) {
      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-accent btn-sm';
      finishBtn.textContent = 'Закончить';
      finishBtn.onclick = () => { trainerProgress.__finished = true; if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress); renderCardsMode(content, footer, trainer, trainerProgress, isRealStudent, progress, taskType); };
      footer.appendChild(finishBtn);
    }
  }
  renderCard();
}

function renderStepReviewMode(content, footer, trainer, trainerProgress, taskType, exitFn) {
  const reactions = trainer.reactions || [];
  const total = reactions.length;
  let currentIndex = 0;
  function renderCard() {
    content.innerHTML = '';
    const rxn = reactions[currentIndex];
    const isInvalid = !rxn.valid;
    const correctAnswerText = isInvalid ? 'Реакция не идёт' : ((rxn.correctSetsDisplay && rxn.correctSetsDisplay[0]) || (rxn.correctSets && rxn.correctSets[0]) || []).join(taskType === 'checkbox' ? ', ' : ' + ');
    let optionsHtml = '';
    if (taskType === 'radio' || taskType === 'checkbox') {
      const options = rxn.options || [];
      const correctSet = isInvalid ? [] : ((rxn.correctSetsDisplay && rxn.correctSetsDisplay[0]) || (rxn.correctSets && rxn.correctSets[0]) || []);
      optionsHtml = `<div class="options-group">` + options.map(opt => {
        const isRight = correctSet.some(c => c.toUpperCase() === opt.trim().toUpperCase());
        return `<label style="${isRight ? 'color:var(--ok);font-weight:700;' : ''}"><input type="${taskType === 'radio' ? 'radio' : 'checkbox'}" disabled ${isRight ? 'checked' : ''}> ${escapeHtml(opt)}${isRight ? ' ✓' : ''}</label>`;
      }).join('') + `</div>`;
    }
    const fs = stepFontSize(trainer, rxn);
    const card = document.createElement('div');
    card.className = 'rxn-step';
    card.innerHTML = `
      <div class="rxn-num">Реакция ${currentIndex+1} / ${total}</div>
      <div class="rxn-eq eqx"${sizeStyle(fs)}>${renderEquation(rxn.lhs || '')}</div>
      ${renderTaskImagesHtml(rxn, false)}
      ${renderHtmlContent(rxn.htmlContent)}
      ${optionsHtml}
      <div class="rxn-explain" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);">
        ${rxn.explanation ? `<div style="font-size:13px;color:var(--ink-soft);">${escapeHtml(rxn.explanation)}</div>` : ''}
        <div style="font-size:15px;font-weight:600;color:var(--ok);margin-top:6px;">Правильный ответ: ${renderEquation(correctAnswerText)}</div>
        ${rxn.fullEquation ? `<div style="font-size:14px;font-weight:600;margin-top:4px;">${renderEquation(rxn.fullEquation)}</div>` : ''}
      </div>
      <div class="step-nav"></div>
    `;
    content.appendChild(card);
    attachImageZoomHandlers(content);
    const navRow = card.querySelector('.step-nav');
    const prevBtn = document.createElement('button'); prevBtn.className = 'flank-btn'; prevBtn.textContent = '◀'; prevBtn.disabled = currentIndex === 0;
    prevBtn.onclick = () => { if (currentIndex > 0) { currentIndex--; renderCard(); } };
    const navInfo = document.createElement('span'); navInfo.className = 'nav-info'; navInfo.textContent = `${currentIndex + 1} / ${total}`;
    const nextBtn = document.createElement('button'); nextBtn.className = 'flank-btn'; nextBtn.textContent = '▶'; nextBtn.disabled = currentIndex === total - 1;
    nextBtn.onclick = () => { if (currentIndex < total - 1) { currentIndex++; renderCard(); } };
    navRow.appendChild(prevBtn); navRow.appendChild(navInfo); navRow.appendChild(nextBtn);
  }
  footer.innerHTML = '';
  const backBtn = document.createElement('button');
  backBtn.className = 'btn btn-ghost';
  backBtn.textContent = '← Назад к результату';
  backBtn.onclick = exitFn;
  footer.appendChild(backBtn);
  renderCard();
}

async function renderHomework(container, homeworkId) {
  const homework = HOMEWORKS.find(h => h.id === homeworkId);
  if (!homework) { VIEW = { name: 'home' }; render(); return; }
  if (TEACH_MODE && isHiddenInTeach(homework)) { VIEW = { name: 'home' }; render(); return; }
  const isRealStudent = !CURRENT_USER.isTeacher;
  let progress = isRealStudent ? await getProgress(CURRENT_USER.key) : {};
  if (!progress[homeworkId]) progress[homeworkId] = {};
  const hwProgress = progress[homeworkId];
  let tasks = homework.tasks || [];
  if (homework.randomOrderMap && homework.randomOrderMap.length === tasks.length) {
    tasks = homework.randomOrderMap.map(i => (homework.tasks || [])[i]).filter(Boolean);
  }
  const mode = homework.mode || 'list';
  const taskType = homework.taskType || 'text';
  const allowChoice = !!homework.allowModeChoice;

  const wrap = document.createElement('div');
  const backRow = document.createElement('div');
  backRow.className = 'back-row';
  backRow.innerHTML = `<button class="back-btn">← Назад к содержанию</button>`;
  backRow.querySelector('.back-btn').onclick = window.goHome;
  wrap.appendChild(backRow);
  const head = document.createElement('div');
  head.className = 'trainer-head';
  let noteHtml = '';
  if (homework.customNote) noteHtml += `<div>${escapeHtmlMultiline(homework.customNote)}</div>`;
  if (homework.noteImage) noteHtml += `<img src="${homework.noteImage}" alt="Примечание" onclick="openImageLightbox(this.src)">`;
  head.innerHTML = noteHtml ? `<h2>${escapeHtml(homework.title)}</h2><div class="trainer-note">${noteHtml}</div>` : `<h2>${escapeHtml(homework.title)}</h2>`;
  wrap.appendChild(head);

  if (isManaging() || (isRealStudent && allowChoice)) {
    const modeSelector = document.createElement('div');
    modeSelector.className = 'trainer-mode-selector';
    modeSelector.innerHTML = `
      <button class="btn btn-sm ${mode === 'step' ? 'active' : ''}" id="hwModeStep">Пошагово</button>
      <button class="btn btn-sm ${mode === 'list' ? 'active' : ''}" id="hwModeList">Список</button>
      <button class="btn btn-sm ${mode === 'cards' ? 'active' : ''}" id="hwModeCards">Карты</button>
    `;
    const onMode = (newMode) => {
      homework.mode = newMode;
      if (isManaging()) persistHomeworks().then(() => renderHomework(container, homeworkId));
      else { hwProgress.__chosenMode = newMode; persistFullProgress(CURRENT_USER.key, progress).then(() => renderHomework(container, homeworkId)); }
    };
    modeSelector.querySelector('#hwModeStep').onclick = () => onMode('step');
    modeSelector.querySelector('#hwModeList').onclick = () => onMode('list');
    modeSelector.querySelector('#hwModeCards').onclick = () => onMode('cards');
    wrap.appendChild(modeSelector);
  }
  let effectiveMode = mode;
  if (isRealStudent && allowChoice && hwProgress.__chosenMode) effectiveMode = hwProgress.__chosenMode;

  const content = document.createElement('div');
  wrap.appendChild(content);
  const footer = document.createElement('div');
  footer.className = 'trainer-footer';
  wrap.appendChild(footer);
  container.appendChild(wrap);
  const homeworkForRender = { ...homework, tasks };

  if (effectiveMode === 'step') renderHwStepMode(content, footer, homeworkForRender, hwProgress, isRealStudent, progress, taskType);
  else if (effectiveMode === 'cards') renderHwCardsMode(content, footer, homeworkForRender, hwProgress, isRealStudent, progress, taskType);
  else renderHwListMode(content, footer, homeworkForRender, hwProgress, isRealStudent, progress, taskType);
}

function renderHwListMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType) {
  const tasks = homework.tasks || [];
  let statuses = hwProgress.statuses || Array(tasks.length).fill('unanswered');
  let answers = hwProgress.answers || Array(tasks.length).fill('');
  function saveState() {
    if (isRealStudent) { hwProgress.statuses = statuses; hwProgress.answers = answers; persistFullProgress(CURRENT_USER.key, progress); }
  }
  function renderList() {
    content.innerHTML = '';
    if (tasks.length === 0) { content.innerHTML = `<div class="empty-note">В этой домашке пока нет заданий.</div>`; return; }
    const list = document.createElement('div');
    list.className = 'rxn-list';
    tasks.forEach((task, idx) => {
      const status = statuses[idx] || 'unanswered';
      const answer = answers[idx] || '';
      const isCorrect = status === 'correct';
      const isWrong = status === 'wrong';
      const card = document.createElement('div');
      card.className = 'rxn-card' + (isCorrect ? ' state-correct' : isWrong ? ' state-wrong' : '');
      const fs = taskFontSize(homework, task);

      const sets = buildCorrectSets(taskAnswer, taskType);
      if (taskType === 'text') {
        inputHtml = `<div class="rxn-input-row"><input type="text" class="rxn-input ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}" placeholder="Введите ответ" value="${escapeHtml(answer)}" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}><button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button></div>`;
      } else if (taskType === 'radio') {
        const options = task.options || [];
        inputHtml = `<div class="options-group" data-idx="${idx}">${options.map(opt => `<label><input type="radio" name="hw_radio_${idx}" value="${escapeAttr(opt)}" ${answer === opt && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button></div>`;
      } else if (taskType === 'checkbox') {
        const options = task.options || [];
        const selected = answer ? answer.split(',') : [];
        inputHtml = `<div class="options-group" data-idx="${idx}">${options.map(opt => `<label><input type="checkbox" name="hw_check_${idx}" value="${escapeAttr(opt)}" ${selected.includes(opt) && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-sm btn-accent check-btn" data-idx="${idx}" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost retry-btn" data-idx="${idx}">Повторить</button></div>`;
      }
      card.innerHTML = `
        <div class="rxn-num">Задание ${idx+1}</div>
        <div class="rxn-eq eqx"${sizeStyle(fs)}>${renderEquation(task.question)}</div>
        ${renderTaskImagesHtml(task, false)}
        ${renderHtmlContent(task.htmlContent)}
        ${inputHtml}
        <div class="feedback-slot"></div>
      `;
      const fbSlot = card.querySelector('.feedback-slot');
      if (status === 'correct') fbSlot.innerHTML = '<div class="rxn-feedback ok">Верно!</div>';
      else if (status === 'wrong') fbSlot.innerHTML = '<div class="rxn-feedback bad">Неверно. Попробуй ещё раз.</div>';
      const checkBtn = card.querySelector('.check-btn');
      if (checkBtn) {
        checkBtn.onclick = () => {
          let val = '';
          if (taskType === 'text') { const inp = card.querySelector('.rxn-input'); val = inp.value.trim(); if (!val) { alert('Введите ответ'); return; } }
          else if (taskType === 'radio') { const c = card.querySelector(`input[name="hw_radio_${idx}"]:checked`); if (!c) { alert('Выберите вариант'); return; } val = c.value; }
          else if (taskType === 'checkbox') { const c = card.querySelectorAll(`input[name="hw_check_${idx}"]:checked`); if (c.length === 0) { alert('Выберите хотя бы один вариант'); return; } val = Array.from(c).map(el => el.value).join(','); }
          const fakeReaction = { valid: true, correctSets: sets.correctSets, correctSetsDisplay: sets.correctSetsDisplay };
          if (checkAnswer(fakeReaction, val, taskType)) {
            statuses[idx] = 'correct'; answers[idx] = val;
            if (taskType === 'text') { const i = card.querySelector('.rxn-input'); i.className = 'rxn-input correct'; i.disabled = true; }
            else card.querySelectorAll('input').forEach(inp => inp.disabled = true);
            checkBtn.disabled = true;
            fbSlot.innerHTML = '<div class="rxn-feedback ok">Верно!</div>';
            card.className = 'rxn-card state-correct';
          } else {
            statuses[idx] = 'wrong'; answers[idx] = val;
            if (taskType === 'text') card.querySelector('.rxn-input').className = 'rxn-input wrong';
            fbSlot.innerHTML = '<div class="rxn-feedback bad">Неверно. Попробуй ещё раз.</div>';
            card.className = 'rxn-card state-wrong';
            if (isRealStudent && CURRENT_USER.errorsEnabled !== false) {
              recordError(progress, CURRENT_USER.key, true, {
                sourceType: 'homework', sourceId: homework.id, sourceTitle: homework.title,
                topicId: homework.topicId, taskIdx: idx, question: task.question,
                correctAnswer: sets.correctSetsDisplay && sets.correctSetsDisplay[0] ? sets.correctSetsDisplay[0].join(taskType === 'checkbox' ? ', ' : ' + ') : taskAnswer,
                explanation: task.explanation || '', images: getTaskImages(task), taskType, options: task.options || [], htmlContent: task.htmlContent || ''
              });
            }
          }
          saveState(); updateStats();
        };
      }
      const retryBtn = card.querySelector('.retry-btn');
      if (retryBtn) {
        retryBtn.onclick = () => {
          statuses[idx] = 'unanswered';
          if (taskType === 'text') { const i = card.querySelector('.rxn-input'); i.className = 'rxn-input'; i.disabled = false; checkBtn.disabled = false; }
          else { card.querySelectorAll('input').forEach(inp => inp.disabled = false); checkBtn.disabled = false; }
          fbSlot.innerHTML = ''; card.className = 'rxn-card';
          saveState(); updateStats();
        };
      }
      list.appendChild(card);
    });
    content.appendChild(list);
    attachImageZoomHandlers(content);
    updateStats();
  }
  function updateStats() {
    const correct = statuses.filter(s => s === 'correct').length;
    const wrong = statuses.filter(s => s === 'wrong').length;
    const unanswered = statuses.filter(s => s === 'unanswered' || !s).length;
    const stats = document.createElement('div');
    stats.className = 'trainer-summary';
    stats.innerHTML = `Правильно: ${correct} · Неправильно: ${wrong} · Осталось: ${unanswered}`;
    const old = footer.querySelector('.trainer-summary'); if (old) old.remove();
    footer.prepend(stats);
  }
  function showFinishedScreen() {
    showSimpleCardsCompletion(content, footer, homework, hwProgress, isRealStudent, progress, async () => {
      statuses = Array(tasks.length).fill('unanswered'); answers = Array(tasks.length).fill('');
      hwProgress.statuses = statuses; hwProgress.answers = answers;
      if (homework.randomOrder) { const indices = (homework.tasks || []).map((_, i) => i); homework.randomOrderMap = shuffleArray(indices); await persistHomeworks(); }
      if (isRealStudent) await persistFullProgress(CURRENT_USER.key, progress);
      renderHwListMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType);
    }, () => {
      renderHwListReview(content, homework, taskType);
      footer.innerHTML = '';
      const backBtn = document.createElement('button');
      backBtn.className = 'btn btn-ghost';
      backBtn.textContent = '← Назад к результату';
      backBtn.onclick = showFinishedScreen;
      footer.appendChild(backBtn);
    });
  }
  if (hwProgress.__finished) { showFinishedScreen(); return; }
  renderList();
  const finishBtn = document.createElement('button');
  finishBtn.className = 'btn btn-accent';
  finishBtn.textContent = 'Закончить домашку';
  finishBtn.onclick = () => {
    const correct = statuses.filter(s => s === 'correct').length;
    if (correct === tasks.length) { hwProgress.__finished = true; if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress); showFinishedScreen(); }
    else alert(`Вы ответили правильно на ${correct} из ${tasks.length} заданий. Доработайте остальные!`);
  };
  footer.appendChild(finishBtn);
}

function renderHwStepMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType) {
  const tasks = homework.tasks || [];
  const total = tasks.length;
  if (total === 0) { content.innerHTML = `<div class="empty-note">В этой домашке пока нет заданий.</div>`; return; }
  let statuses = hwProgress.statuses || Array(total).fill('unanswered');
  let answers = hwProgress.answers || Array(total).fill('');
  let currentIndex = hwProgress.stepIndex || 0;
  if (currentIndex >= total || currentIndex < 0) currentIndex = 0;
  function saveState() {
    if (isRealStudent) { hwProgress.statuses = statuses; hwProgress.answers = answers; hwProgress.stepIndex = currentIndex; persistFullProgress(CURRENT_USER.key, progress); }
  }
  function isAllCorrect() { return statuses.every(s => s === 'correct'); }
  function renderStep() {
    content.innerHTML = ''; footer.innerHTML = '';
    const noteEl = content.parentElement.querySelector('.trainer-note');
    if (noteEl && currentIndex > 0 && !homework.keepNote) noteEl.style.display = 'none';
    else if (noteEl) noteEl.style.display = '';
    const task = tasks[currentIndex];
    const status = statuses[currentIndex] || 'unanswered';
    const answer = answers[currentIndex] || '';
    const isCorrect = status === 'correct';
    const isWrong = status === 'wrong';
    const card = document.createElement('div');
    card.className = 'rxn-step';
    const fs = stepFontSize(homework, task);
    const sets = buildCorrectSets(task.answer || '', taskType);
    let inputHtml = '';
    if (taskType === 'text') {
      inputHtml = `<div class="rxn-input-row"><input type="text" class="rxn-input ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}" placeholder="Введите ответ" value="${escapeHtml(answer)}" ${isCorrect ? 'disabled' : ''} id="hwStepInput"></div>`;
    } else if (taskType === 'radio') {
      const options = task.options || [];
      inputHtml = `<div class="options-group" id="hwStepOptions">${options.map(opt => `<label><input type="radio" name="hwStepRadio" value="${escapeAttr(opt)}" ${answer === opt && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div>`;
    } else if (taskType === 'checkbox') {
      const options = task.options || [];
      const selected = answer ? answer.split(',') : [];
      inputHtml = `<div class="options-group" id="hwStepOptions">${options.map(opt => `<label><input type="checkbox" name="hwStepCheckbox" value="${escapeAttr(opt)}" ${selected.includes(opt) && !isCorrect ? 'checked' : ''} ${isCorrect ? 'disabled' : ''}> ${escapeHtml(opt)}</label>`).join('')}</div>`;
    }
    card.innerHTML = `
      <div class="rxn-num">Задание ${currentIndex+1} / ${total}</div>
      <div class="rxn-eq eqx"${sizeStyle(fs)}>${renderEquation(task.question)}</div>
      ${renderTaskImagesHtml(task, false)}
      ${renderHtmlContent(task.htmlContent)}
      ${inputHtml}
      <div class="rxn-actions"><button class="btn btn-sm btn-accent" id="hwStepCheck" ${isCorrect ? 'disabled' : ''}>Проверить</button><button class="btn btn-sm btn-ghost" id="hwStepRetry">Повторить</button></div>
      <div class="feedback-slot"></div>
      <div class="step-nav"></div>
    `;
    const fbSlot = card.querySelector('.feedback-slot');
    if (status === 'correct') fbSlot.innerHTML = '<div class="rxn-feedback ok">Верно!</div>';
    else if (status === 'wrong') fbSlot.innerHTML = '<div class="rxn-feedback bad">Неверно. Попробуй ещё раз.</div>';
    content.appendChild(card);
    attachImageZoomHandlers(content);
    function getInputValue() {
      if (taskType === 'text') return card.querySelector('#hwStepInput')?.value?.trim() || '';
      if (taskType === 'radio') { const c = card.querySelector('input[name="hwStepRadio"]:checked'); return c ? c.value : ''; }
      if (taskType === 'checkbox') { const c = card.querySelectorAll('input[name="hwStepCheckbox"]:checked'); return Array.from(c).map(el => el.value).join(','); }
      return '';
    }
    function disableInputs(d) {
      if (taskType === 'text') { const i = card.querySelector('#hwStepInput'); if (i) i.disabled = d; }
      else card.querySelectorAll('input').forEach(inp => inp.disabled = d);
    }
    card.querySelector('#hwStepCheck').onclick = () => {
      if (isCorrect) return;
      const val = getInputValue();
      if (!val) { alert('Введите ответ'); return; }
      const fakeReaction = { valid: true, correctSets: sets.correctSets, correctSetsDisplay: sets.correctSetsDisplay };
      if (checkAnswer(fakeReaction, val, taskType)) {
        statuses[currentIndex] = 'correct'; answers[currentIndex] = val;
        disableInputs(true); card.querySelector('#hwStepCheck').disabled = true;
        fbSlot.innerHTML = '<div class="rxn-feedback ok">Верно!</div>';
        if (taskType === 'text') { const i = card.querySelector('#hwStepInput'); if (i) i.className = 'rxn-input correct'; }
      } else {
        statuses[currentIndex] = 'wrong'; answers[currentIndex] = val;
        fbSlot.innerHTML = '<div class="rxn-feedback bad">Неверно. Попробуй ещё раз.</div>';
        if (taskType === 'text') { const i = card.querySelector('#hwStepInput'); if (i) i.className = 'rxn-input wrong'; }
        if (isRealStudent && CURRENT_USER.errorsEnabled !== false) {
          recordError(progress, CURRENT_USER.key, true, {
            sourceType: 'homework', sourceId: homework.id, sourceTitle: homework.title,
            topicId: homework.topicId, taskIdx: currentIndex, question: task.question,
            correctAnswer: sets.correctSetsDisplay && sets.correctSetsDisplay[0]
              ? sets.correctSetsDisplay[0].join(taskType === 'checkbox' ? ', ' : ' + ')
              : task.answer,
            explanation: task.explanation || '', images: getTaskImages(task),
            taskType, options: task.options || [], htmlContent: task.htmlContent || ''
          });
        }
      }
      saveState();
    };

    card.querySelector('#hwStepRetry').onclick = () => {
      statuses[currentIndex] = 'unanswered';
      disableInputs(false);
      card.querySelector('#hwStepCheck').disabled = false;
      fbSlot.innerHTML = '';
      if (taskType === 'text') { const i = card.querySelector('#hwStepInput'); if (i) i.className = 'rxn-input'; }
      saveState();
    };

    const navRow = card.querySelector('.step-nav');
    const prevBtn = document.createElement('button'); prevBtn.className = 'flank-btn'; prevBtn.textContent = '◀';
    prevBtn.disabled = currentIndex === 0;
    prevBtn.onclick = () => { if (currentIndex > 0) { currentIndex--; saveState(); renderStep(); } };
    const navInfo = document.createElement('span'); navInfo.className = 'nav-info'; navInfo.textContent = `${currentIndex + 1} / ${total}`;
    const nextBtn = document.createElement('button'); nextBtn.className = 'flank-btn'; nextBtn.textContent = '▶';
    nextBtn.disabled = currentIndex === total - 1;
    nextBtn.onclick = () => { if (currentIndex < total - 1) { currentIndex++; saveState(); renderStep(); } };
    navRow.appendChild(prevBtn); navRow.appendChild(navInfo); navRow.appendChild(nextBtn);

    if (isAllCorrect()) {
      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-accent';
      finishBtn.textContent = 'Закончить домашку';
      finishBtn.onclick = () => {
        hwProgress.__finished = true;
        if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress);
        showFinishedScreen();
      };
      footer.appendChild(finishBtn);
    }
  }

  function showFinishedScreen() {
    showSimpleCardsCompletion(content, footer, homework, hwProgress, isRealStudent, progress, async () => {
      hwProgress.statuses = Array(total).fill('unanswered');
      hwProgress.answers = Array(total).fill('');
      hwProgress.stepIndex = 0;
      if (homework.randomOrder) {
        const indices = (homework.tasks || []).map((_, i) => i);
        homework.randomOrderMap = shuffleArray(indices);
        await persistHomeworks();
      }
      if (isRealStudent) await persistFullProgress(CURRENT_USER.key, progress);
      renderHwStepMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType);
    }, () => {
      renderHwStepReviewMode(content, footer, homework, hwProgress, taskType, showFinishedScreen);
    });
  }

  if (hwProgress.__finished) showFinishedScreen();
  else renderStep();
}

function renderHwCardsMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType, reviewMode) {
  const tasks = homework.tasks || [];

    showSimpleCardsCompletion(content, footer, homework, hwProgress, isRealStudent, progress, () => {
      renderHwCardsMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType);
    }, () => {
      renderHwCardsMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType, true);
    });
    return;
  }
  let currentIndex = hwProgress.cardsIndex || 0;
  if (currentIndex >= tasks.length || currentIndex < 0) currentIndex = 0;
  let showAnswer = false;
  function saveState() {
    if (isRealStudent) { hwProgress.cardsIndex = currentIndex; persistFullProgress(CURRENT_USER.key, progress); }
  }
  function renderCard() {
    content.innerHTML = '';
    const noteEl = content.parentElement.querySelector('.trainer-note');
    if (noteEl && currentIndex > 0 && !homework.keepNote) noteEl.style.display = 'none';
    else if (noteEl) noteEl.style.display = '';
    const task = tasks[currentIndex];
    const sets = buildCorrectSets(task.answer || '', taskType);
    const answerText = (sets.correctSetsDisplay && sets.correctSetsDisplay[0])
      ? sets.correctSetsDisplay[0].join(taskType === 'checkbox' ? ', ' : ' + ')
      : task.answer;
    const fs = stepFontSize(homework, task);
    const card = document.createElement('div');
    card.className = 'flash-card';
    card.innerHTML = `
      <div class="card-number">${currentIndex + 1} / ${tasks.length}</div>
      <div class="card-question eqx"${sizeStyle(fs)}>${renderEquation(task.question)}</div>
      ${renderTaskImagesHtml(task, true)}
      ${renderHtmlContent(task.htmlContent)}
      ${showAnswer ? `<div class="card-answer-block">${renderEquation(answerText || '')}</div>` : ''}
      ${showAnswer && task.explanation ? `<div style="margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center;padding:0 16px;">${escapeHtml(task.explanation)}</div>` : ''}
      <div class="card-actions"><button class="btn btn-accent" id="showAnswerBtn">${showAnswer ? 'Скрыть ответ' : 'Показать ответ'}</button></div>
      <div class="card-nav">
        <button class="nav-btn" id="prevCardBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
        <span class="nav-info">${currentIndex + 1} / ${tasks.length}</span>
        <button class="nav-btn" id="nextCardBtn" ${currentIndex === tasks.length - 1 ? 'disabled' : ''}>Вперёд ▶</button>
      </div>
    `;
    content.appendChild(card);
    attachImageZoomHandlers(content);
    card.querySelector('#showAnswerBtn').onclick = () => { showAnswer = !showAnswer; renderCard(); };
    card.querySelector('#prevCardBtn').onclick = () => { if (currentIndex > 0) { currentIndex--; showAnswer = false; saveState(); renderCard(); } };
    card.querySelector('#nextCardBtn').onclick = () => { if (currentIndex < tasks.length - 1) { currentIndex++; showAnswer = false; saveState(); renderCard(); } };
  }
  footer.innerHTML = '';
  const backToHome = document.createElement('button');
  backToHome.className = 'btn btn-ghost';
  backToHome.textContent = reviewMode ? '← Назад к результату' : '← К содержанию';
  backToHome.onclick = reviewMode ? () => { renderHwCardsMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType); } : window.goHome;
  footer.appendChild(backToHome);
  if (!reviewMode) {
    const finishBtn = document.createElement('button');
    finishBtn.className = 'btn btn-accent';
    finishBtn.textContent = 'Закончить';
    finishBtn.onclick = () => { hwProgress.__finished = true; if (isRealStudent) persistFullProgress(CURRENT_USER.key, progress); renderHwCardsMode(content, footer, homework, hwProgress, isRealStudent, progress, taskType); };
    footer.appendChild(finishBtn);
  }
  renderCard();
}

function renderLessonModal(lessonId) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson) return;
  if (TEACH_MODE && isHiddenInTeach(lesson)) { VIEW = { name: 'home' }; render(); return; }
  if (lesson.assignedTo && lesson.assignedTo.length > 0 && !CURRENT_USER.isTeacher && !TEACH_MODE) {
    if (!lesson.assignedTo.includes(CURRENT_USER.key)) { alert('Этот урок доступен только выбранным ученикам.'); return; }
  }
  const isRealStudent = !CURRENT_USER.isTeacher;
  let progress = {};
  let lessonFinished = false;
  if (isRealStudent) { progress = window.__cachedProgress || {}; lessonFinished = !!progress['lesson:' + lesson.id]; }
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'lessonModalBg';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = '560px';
  const links = lesson.links || [];
  const files = lesson.files || [];
  let linksHtml = '';
  if (lesson.videoUrl) {
    let videoHtml = '';
    const url = lesson.videoUrl;
    if (url.includes('youtube.com/embed') || url.includes('youtu.be')) {
      const embedUrl = url.includes('youtube.com/embed') ? url : `https://www.youtube.com/embed/${url.split('youtu.be/')[1]?.split('?')[0] || ''}`;
      videoHtml = `<div class="video-container"><iframe src="${embedUrl}" allowfullscreen></iframe></div>`;
    } else if (url.includes('rutube.ru') || url.includes('vk.com')) {
      videoHtml = `<div class="video-container"><iframe src="${url}" allowfullscreen></iframe></div>`;
    } else {
      videoHtml = `<a href="${escapeAttr(url)}" target="_blank" class="lesson-link">Смотреть видео</a>`;
    }
    linksHtml += videoHtml;
  }
  if (links.length > 0) {
    linksHtml += `<div class="lesson-video-list">` + links.map(l => `<a class="lesson-link" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label || 'Смотреть видео')}</a>`).join('') + `</div>`;
  }
  if (files.length > 0) {
    linksHtml += `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">` + files.map(f => {
      if (f.dataUrl) {
        const sizeKb = Math.round((f.size || 0) / 1024);
        return `<div class="theory-file-preview"><div class="icon">📎</div><div style="flex:1;"><div class="name">${escapeHtml(f.label || f.name || 'Файл')}</div><div class="size">${sizeKb} КБ</div></div><a class="btn btn-sm btn-accent" href="${f.dataUrl}" download="${escapeAttr(f.name || 'file')}">Скачать</a></div>`;
      }
      return `<a href="${escapeAttr(f.url)}" target="_blank" class="lesson-link">${escapeHtml(f.label || 'Скачать файл')}</a>`;
    }).join('') + `</div>`;
  }
  if (!linksHtml) linksHtml = `<div class="empty-note">Материалы пока не добавлены.</div>`;
  let finishButtonHtml = '';
  if (isRealStudent && !TEACH_MODE) {
    if (lessonFinished) finishButtonHtml = `<button class="btn btn-success" disabled style="opacity:0.7;">✅ Урок завершён</button>`;
    else finishButtonHtml = `<button class="btn btn-accent" id="finishLessonBtn">📖 Закончить урок</button>`;
  }
  modal.innerHTML = `
    <h3>${escapeHtml(lesson.title)}</h3>
    ${lesson.description ? `<p style="color:var(--ink-soft);font-size:14px;margin-bottom:16px;">${escapeHtmlMultiline(lesson.description)}</p>` : ''}
    <div class="lesson-body">${linksHtml}</div>
    <div class="actions" style="justify-content:space-between;flex-wrap:wrap;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-ghost" id="closeLessonBtn">Закрыть</button>
        ${finishButtonHtml}
      </div>
    </div>
  `;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  bg.onclick = (e) => { if (e.target === bg) closeLessonModal(); };
  modal.querySelector('#closeLessonBtn').onclick = closeLessonModal;
  const finishBtn = modal.querySelector('#finishLessonBtn');
  if (finishBtn) {
    finishBtn.onclick = async () => {
      if (confirm('Отметить урок как завершённый?')) {
        const p = await getProgress(CURRENT_USER.key);
        p['lesson:' + lesson.id] = true;
        await persistFullProgress(CURRENT_USER.key, p);
        window.__cachedProgress = p;
        bg.remove();
        render();
      }
    };
  }
}

function closeLessonModal() {
  const bg = document.getElementById('lessonModalBg');
  if (bg) bg.remove();
  VIEW = { name: 'home' };
  render();
}

async function renderStats(container) {
  container.innerHTML = '';
  const reg = await loadRegistry();
  const sortedKeys = Object.keys(reg).sort((a, b) => (reg[a].createdAt || 0) - (reg[b].createdAt || 0));
  const wrap = document.createElement('div');
  wrap.innerHTML = `<h1 class="page-title">Статистика учеников</h1><p class="page-sub">Имя, пароль и прогресс. Нажмите на имя, чтобы увидеть детали. Кнопка «Показать» в столбце «Ошибки» откроет список ошибок ученика.</p>`;
  const tabs = document.createElement('div');
  tabs.className = 'maintabs';
  tabs.innerHTML = `
    <div class="maintab" id="tabContent">Содержание</div>
    <div class="maintab active" id="tabStats">Статистика</div>
    <div class="maintab" id="tabTeach">Обучаю</div>
  `;
  tabs.querySelector('#tabContent').onclick = () => { VIEW = { name: 'home' }; render(); };
  tabs.querySelector('#tabTeach').onclick = () => { window.enterTeachMode(); };
  wrap.appendChild(tabs);
  const addBox = document.createElement('div');
  addBox.className = 'builder-box';
  addBox.innerHTML = `
    <h3>Добавить ученика</h3>
    <div class="field-row">
      <input type="text" id="newStudentName" placeholder="Имя ученика" style="flex:1;">
      <input type="text" id="newStudentPassword" placeholder="Пароль" style="flex:1;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);">
        <input type="checkbox" id="newStudentErrorsEnabled" checked>
        Ошибки включены
      </label>
      <button class="btn btn-accent" id="addStudentBtn">Добавить</button>
    </div>
    <div id="addStudentMsg" style="font-size:12.5px;margin-top:6px;"></div>
  `;
  wrap.appendChild(addBox);
  const tableWrap = document.createElement('div');
  tableWrap.style.cssText = 'overflow-x:auto;';
  const table = document.createElement('table');
  table.className = 'stats-table';
  table.innerHTML = `
    <thead><tr><th>Ученик</th><th>Пароль</th><th style="min-width:150px;">Прогресс</th><th>Ошибки</th><th>Действия</th></tr></thead>
    <tbody id="statsBody"></tbody>
  `;
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  container.appendChild(wrap);
  const tbody = table.querySelector('#statsBody');
  tbody.innerHTML = '';
  if (sortedKeys.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-note">Учеников пока нет. Добавьте первого!</td></tr>`;
  } else {
    for (const key of sortedKeys) {
      const student = reg[key];
      const progress = await getProgress(key);
      let correctCount = 0, totalCount = 0;
      function isVisibleTo(item) { return !item.assignedTo || item.assignedTo.length === 0 || item.assignedTo.includes(key); }
      for (const t of (TRAINERS || [])) {
        if (!isVisibleTo(t)) continue;
        const td = progress[t.id] || {};
        totalCount += (t.reactions || []).length;
        correctCount += (td.statuses || []).filter(s => s === 'correct').length;
      }
      for (const h of (HOMEWORKS || [])) {
        if (!isVisibleTo(h)) continue;
        const hd = progress[h.id] || {};
        totalCount += (h.tasks || []).length;
        correctCount += (hd.statuses || []).filter(s => s === 'correct').length;
      }
      for (const l of (LESSONS || [])) {
        if (!isVisibleTo(l)) continue;
        totalCount++;
        if (progress['lesson:' + l.id]) correctCount++;
      }
      const percent = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
      const errCount = countErrors(progress);
      const errorsCell = student.errorsEnabled === false
        ? '<span style="color:var(--ink-soft);">выключены</span>'
        : (errCount > 0
            ? `<button class="btn btn-sm btn-ghost show-errors-btn" data-key="${key}">Показать ${errCount}</button>`
            : '<span style="color:var(--ok);font-weight:700;">нет</span>');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><span class="student-name" data-key="${key}">${escapeHtml(student.name)}</span></td>
        <td><span style="font-family:monospace;font-size:13px;">${escapeHtml(student.password)}</span></td>
        <td><div style="display:flex;align-items:center;gap:12px;"><div class="stats-progress-bar"><div class="fill" style="width:${percent}%;${percent === 100 ? 'background:var(--ok);' : ''}"></div></div><span style="font-weight:600;font-size:14px;min-width:44px;">${percent}%</span></div></td>
        <td>${errorsCell}</td>
        <td><div class="stats-actions">
            <button class="btn btn-sm btn-ghost change-pass-btn" data-key="${key}">Сменить пароль</button>
            <button class="btn btn-sm btn-ghost toggle-errors-btn" data-key="${key}">${student.errorsEnabled === false ? 'Включить ошибки' : 'Выключить ошибки'}</button>
            <button class="btn btn-sm btn-danger delete-student-btn" data-key="${key}">Удалить</button>
          </div></td>
      `;
      row.querySelector('.student-name').onclick = (e) => { e.stopPropagation(); VIEW = { name: 'studentDetail', studentKey: key }; render(); };
      const showErrorsBtn = row.querySelector('.show-errors-btn');
      if (showErrorsBtn) showErrorsBtn.onclick = (e) => { e.stopPropagation(); showStudentErrorsModal(key, progress); };
      row.querySelector('.change-pass-btn').onclick = (e) => { e.stopPropagation(); showChangePasswordModal(key); };
      row.querySelector('.toggle-errors-btn').onclick = async (e) => {
        e.stopPropagation();
        const reg2 = await loadRegistry();
        const s = reg2[key];
        s.errorsEnabled = s.errorsEnabled === false ? true : false;
        await saveRegistry(reg2);
        renderStats(container);
      };
      row.querySelector('.delete-student-btn').onclick = (e) => { e.stopPropagation(); showDeleteStudentConfirm(key); };
      tbody.appendChild(row);
    }
  }
  addBox.querySelector('#addStudentBtn').onclick = async () => {
    const nameInput = addBox.querySelector('#newStudentName');
    const passInput = addBox.querySelector('#newStudentPassword');
    const errChk = addBox.querySelector('#newStudentErrorsEnabled');
    const msgDiv = addBox.querySelector('#addStudentMsg');
    const name = nameInput.value.trim();
    const password = passInput.value.trim();
    if (!name || !password) { msgDiv.textContent = 'Введите имя и пароль.'; msgDiv.style.color = 'var(--bad)'; return; }
    const reg = await loadRegistry();
    const key = name.toLowerCase();
    if (reg[key]) { msgDiv.textContent = 'Ученик с таким именем уже существует.'; msgDiv.style.color = 'var(--bad)'; return; }
    reg[key] = { name, password, createdAt: Date.now(), platform: currentPlatform, errorsEnabled: errChk.checked !== false };
    await saveRegistry(reg);
    nameInput.value = ''; passInput.value = '';
    msgDiv.textContent = 'Ученик добавлен!'; msgDiv.style.color = 'var(--ok)';
    renderStats(container);
  };
}

      ).join('');

async function renderStudentDetail(container, studentKey) {
  const reg = await loadRegistry();
  const student = reg[studentKey];
  if (!student) { VIEW = { name: 'stats' }; render(); return; }
  const progress = await getProgress(studentKey);
  const wrap = document.createElement('div');
  const backRow = document.createElement('div');
  backRow.className = 'back-row';
  backRow.innerHTML = `<button class="back-btn">← Назад к статистике</button>`;
  backRow.querySelector('.back-btn').onclick = () => { VIEW = { name: 'stats' }; render(); };
  wrap.appendChild(backRow);
  const title = document.createElement('h1');
  title.className = 'page-title';
  title.textContent = student.name;
  wrap.appendChild(title);
  const errCount = countErrors(progress);
  const errBlock = document.createElement('div');
  errBlock.style.cssText = 'background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:16px;padding:22px;margin:18px 0 24px;';
  if (student.errorsEnabled === false) errBlock.innerHTML = `<div class="empty-note">Ошибки у этого ученика выключены учителем.</div>`;
  else if (errCount === 0) errBlock.innerHTML = `<div class="empty-note">У этого ученика нет неотработанных ошибок.</div>`;
  else {
    errBlock.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><h3 style="margin:0;font-size:16px;">Ошибки ученика <span style="color:var(--bad);">(${errCount})</span></h3><button class="btn btn-sm btn-accent" id="openErrorsBtn">Показать все</button></div>`;
    errBlock.querySelector('#openErrorsBtn').onclick = () => { showStudentErrorsModal(studentKey, progress); };
  }
  wrap.appendChild(errBlock);
  const allItems = [];
  function isVisibleTo(item) { return !item.assignedTo || item.assignedTo.length === 0 || item.assignedTo.includes(studentKey); }
  const sortedTopics = [...TOPICS].sort((a, b) => a.order - b.order);
  for (const topic of sortedTopics) {
    const topicItems = [];
    for (const t of (TRAINERS || [])) if (t.topicId === topic.id && (t.reactions || []).length > 0 && isVisibleTo(t)) topicItems.push({ type: 'Тренажёр', title: t.title, order: t.order, _data: t, _kind: 'trainer' });
    for (const h of (HOMEWORKS || [])) if (h.topicId === topic.id && (h.tasks || []).length > 0 && isVisibleTo(h)) topicItems.push({ type: 'Домашка', title: h.title, order: h.order, _data: h, _kind: 'homework' });
    for (const l of (LESSONS || [])) if (l.topicId === topic.id && isVisibleTo(l)) topicItems.push({ type: 'Урок', title: l.title, order: l.order, _data: l, _kind: 'lesson' });
    for (const th of (THEORIES || [])) if (th.topicId === topic.id && isVisibleTo(th)) topicItems.push({ type: 'Теория', title: th.title, order: th.order, _data: th, _kind: 'theory' });
    topicItems.sort((a, b) => a.order - b.order);
    for (const item of topicItems) {
      if (item._kind === 'trainer') { const td = progress[item._data.id] || {}; const total = (item._data.reactions || []).length; const done = (td.statuses || []).filter(s => s === 'correct').length; allItems.push({ type: 'Тренажёр', title: item.title, done, total, finished: td.__finished === true }); }
      else if (item._kind === 'homework') { const hd = progress[item._data.id] || {}; const total = (item._data.tasks || []).length; const done = (hd.statuses || []).filter(s => s === 'correct').length; allItems.push({ type: 'Домашка', title: item.title, done, total, finished: hd.__finished === true }); }
      else if (item._kind === 'lesson') allItems.push({ type: 'Урок', title: item.title, done: null, total: null, finished: !!progress['lesson:' + item._data.id] });
      else if (item._kind === 'theory') allItems.push({ type: 'Теория', title: item.title, done: null, total: null, finished: null });
    }
  }
  const list = document.createElement('div');
  list.className = 'student-detail-list';
  if (allItems.length === 0) list.innerHTML = `<div class="empty-note">Материалов пока нет.</div>`;
  else {
    for (const item of allItems) {
      const row = document.createElement('div');
      row.className = 'student-detail-row';
      const pct = (item.done !== null && item.total) ? Math.round(item.done / item.total * 100) : 0;
      row.innerHTML = `
        <div style="flex:1;min-width:180px;">
          <div class="sdr-title">${escapeHtml(item.title)}</div>
          <div class="sdr-type">${item.type}</div>
          ${item.done !== null ? `<div class="sdr-bar"><div class="fill ${item.finished ? 'done' : ''}" style="width:${pct}%"></div></div>` : ''}
        </div>
        <div class="sdr-progress">
          ${item.done !== null ? `Выполнено ${item.done} из ${item.total}` : (item.finished === null ? '—' : (item.finished ? '✅ Выполнено' : 'Не выполнено'))}
        </div>
      `;
      list.appendChild(row);
    }
  }
  wrap.appendChild(list);
  container.appendChild(wrap);
}

  }

  function insertBoldToTextarea(textareaId) {
    const textarea = document.getElementById(textareaId);

    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    const selected = text.substring(start, end);
    const replacement = `<b>${selected}</b>`;
    textarea.value = text.substring(0, start) + replacement + text.substring(end);
    textarea.focus();
    textarea.setSelectionRange(start + 3, start + 3 + selected.length);
  }

  function renderFields() {
    const type = typeSel.value;
    topicSel.style.display = (type === 'topic') ? 'none' : '';
    if (type === 'theory') {
      theoryFile = null;
      fieldsBox.innerHTML = `

function refreshRowImagePreview(cont, i, removeClass) {

  pb.innerHTML = buildImagePreviewHtml(reactionRows[i].images, i, removeClass);
  pb.querySelectorAll('.' + removeClass).forEach(btn => {
    btn.onclick = () => { syncReactionRowsFromDOM(); const ri = parseInt(btn.dataset.row); const imgIdx = parseInt(btn.dataset.imgidx); reactionRows[ri].images.splice(imgIdx, 1); refreshRowImagePreview(cont, ri, removeClass); };
  });
}
function renderReactionRows() {

      <div class="builder-line"><div class="ln-label">4</div><input type="text" placeholder="Полное уравнение" data-field="full" data-row="${i}" value="${escapeAttr(row.full||'')}"></div>
      <div class="builder-line"><div class="ln-label">5</div><input type="text" placeholder="Варианты (через запятую)" data-field="options" data-row="${i}" value="${escapeAttr(row.options||'')}"></div>

      <div class="builder-line img-row" data-row="${i}">
        <div class="ln-label">6</div>
        <div style="flex:1;">

        </div>
      </div>
    </div>

  cont.querySelectorAll('.rxn-image-input').forEach(inp => {
    inp.onchange = async (e) => {

      const i = parseInt(inp.dataset.row); syncReactionRowsFromDOM();
      if (!reactionRows[i].images) reactionRows[i].images = [];
      for (const file of files) { try { reactionRows[i].images.push(await compressTaskImageToDataUrl(file)); } catch (err) { alert('Не удалось загрузить "' + file.name + '": ' + err.message); } }
      refreshRowImagePreview(cont, i, 'rxn-image-remove'); inp.value = '';

  });
  cont.querySelectorAll('.bold-btn').forEach(btn => {
    btn.onclick = () => {
      const rowEl = btn.closest('.rxn-row-builder');
      const textarea = rowEl.querySelector(`[data-field="${btn.dataset.target}"]`); if (!textarea) return;
      const start = textarea.selectionStart; const end = textarea.selectionEnd; const text = textarea.value;
      const selected = text.substring(start, end); const replacement = `<b>${selected}</b>`;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus(); textarea.setSelectionRange(start + 3, start + 3 + selected.length);
    };
  });
