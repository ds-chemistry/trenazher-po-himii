<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Химия. Тренажёры</title>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js"
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #14181f;
      --ink-soft: #5b6472;
      --line: #e4e7ec;
      --accent: #14181f;
      --accent-hover: #000000;
      --ok: #1a9f6c;
      --ok-bg: #e7f8f1;
      --bad: #e0473a;
      --bad-bg: #fdeceb;
      --shadow: 0 1px 2px rgba(20,24,31,.04), 0 8px 24px rgba(20,24,31,.06);
      --radius: 16px;
      --transition: 0.2s ease;
      font-family: "Manrope", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --ink: #b0b8c4;
      --ink-soft: #8b949e;
      --line: #30363d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      --accent: #c9d1d9;
      --accent-hover: #e6edf3;
    }

    [data-theme="dark"] .card { background: var(--surface); }
    [data-theme="dark"] .rxn-card { background: var(--surface); }
    [data-theme="dark"] .modal { background: var(--surface); }
    [data-theme="dark"] .rxn-input { background: var(--bg); }
    [data-theme="dark"] .builder-box,
    [data-theme="dark"] .ai-builder-box { background: var(--surface); }
    [data-theme="dark"] .maintab.active { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .maintab:not(.active):hover { background: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .btn-primary { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .btn-primary:hover { background: var(--bg); }
    [data-theme="dark"] .btn-accent { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .btn-accent:hover { background: var(--bg); }
    [data-theme="dark"] .plat-btn.active { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .trainer-mode-selector .btn.active { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
    [data-theme="dark"] .flash-card { background: var(--surface); border-color: var(--line); }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }
    .hidden { display: none !important; }
    .eqx sub { font-size: .64em; position: relative; bottom: -0.15em; }
    .eqx { white-space: normal; word-break: break-word; }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      transition: background var(--transition), border-color var(--transition);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 16px; letter-spacing: -.01em;
      cursor: pointer;
      color: var(--ink);
      text-decoration: none;
    }
    .brand .mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 800;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .theme-toggle {
      background: none; border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; cursor: pointer; color: var(--ink-soft);
      font-size: 16px; transition: all var(--transition);
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    .mode-banner {
      background: #fff3d6; border-bottom: 1px solid #f0d998; color: #7a5c10;
      padding: 9px 22px; font-size: 13px; font-weight: 600; text-align: center;
    }
    [data-theme="dark"] .mode-banner {
      background: #2d1f00; border-color: #4a3500; color: #e6b800;
    }

    .userbox { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
    .userbox .who { font-weight: 600; color: var(--ink); }

    .btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 13.5px; font-weight: 600; cursor: pointer;
      transition: transform .08s ease, opacity .15s ease, background .15s ease, color .15s ease;
      font-family: inherit;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--bad-bg); color: var(--bad); }
    .btn-danger:hover { opacity: .85; }
    .btn-success { background: var(--ok-bg); color: var(--ok); }
    .btn-success:hover { opacity: .85; }
    .btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 8px; }

    .icon-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
      color: var(--ink-soft); flex-shrink: 0;
      transition: all var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg); }
    .icon-btn.danger:hover { border-color: var(--bad); color: var(--bad); }

    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%; max-width: 380px;
    }
    .login-card .mark-lg {
      width: 46px; height: 46px; border-radius: 13px; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; margin-bottom: 20px;
    }
    .login-card h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.02em; }
    .login-card p.sub { margin: 0 0 26px; color: var(--ink-soft); font-size: 13.5px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
      font-size: 14.5px; font-family: inherit; background: var(--bg);
      transition: border .15s, background var(--transition);
      color: var(--ink);
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .login-card .btn { width: 100%; padding: 12px; font-size: 14.5px; margin-top: 6px; }
    .login-err { color: var(--bad); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

    .container { max-width: 1080px; margin: 0 auto; padding: 32px 22px 80px; }
    .page-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
    .page-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 28px; }
    .maintabs { display: flex; gap: 8px; margin-bottom: 26px; flex-wrap: wrap; }
.maintab {
  padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
  cursor: pointer; color: var(--ink-soft); border: 1px solid transparent;
  transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 8px;
}
.maintab.active { background: var(--accent); color: #fff; }
.maintab:not(.active):hover { background: var(--surface); border-color: var(--line); }
.maintab .badge-count {
  display: inline-block; font-size: 11px; font-weight: 700;
  background: var(--bad-bg); color: var(--bad);
  border-radius: 10px; padding: 1px 8px; min-width: 18px; text-align: center;
}
.maintab.active .badge-count { background: rgba(255,255,255,.25); color: #fff; }

.errors-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--bad);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  cursor: pointer;
  transition: all .15s ease;
}
.errors-panel:hover { box-shadow: var(--shadow); border-color: transparent; transform: translateY(-1px); }
.errors-panel__icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--bad-bg); color: var(--bad);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; flex-shrink: 0;
}
.errors-panel__icon.empty { background: var(--ok-bg); color: var(--ok); }
.errors-panel__body { flex: 1; min-width: 200px; }
.errors-panel__title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.errors-panel__sub { font-size: 13px; color: var(--ink-soft); }
.errors-panel__actions { display: flex; gap: 8px; flex-wrap: wrap; }

.topic-block { margin-bottom: 8px; }
.topic-block-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 26px 0 12px;
}
.topic-block-head .title-group { display: flex; align-items: center; gap: 10px; }
.topic-block-head h2 {
  font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase;
  letter-spacing: .05em; margin: 0;
}
.topic-edit-controls { display: flex; gap: 6px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  padding: 20px;
  cursor: pointer;
  transition: box-shadow .15s ease, transform .1s ease, border-color .15s, background var(--transition);
  position: relative;
  overflow: hidden;
}
.card:hover { box-shadow: var(--shadow); border-color: transparent; transform: translateY(-1px); }
.card .kind {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
}
.card .kind.lesson { color: #d6641a; }
[data-theme="dark"] .card .kind.lesson { color: #e8843f; }
.card .kind.homework { color: #b3123f; }
[data-theme="dark"] .card .kind.homework { color: #e2496f; }
.card .kind.theory { color: #6b21a8; }
[data-theme="dark"] .card .kind.theory { color: #c084fc; }
.card h3 { font-size: 16px; margin: 0 0 8px; letter-spacing: -.01em; line-height: 1.3; }
.card .meta { font-size: 12.5px; color: var(--ink-soft); }
.card .progress-bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 14px; overflow: hidden; }
.card .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.card .progress-fill.finished { background: var(--ok); }
.card .card-badge {
  position: absolute; top: 12px; right: 12px;
  font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
  background: var(--bad-bg); color: var(--bad);
}
.card .card-badge.personal { background: var(--ok-bg); color: var(--ok); }
.card-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-edit-row { display: flex; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.card-edit-row .icon-btn { flex: 1; width: auto; }

.back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--ink-soft);
  font-size: 13.5px; font-weight: 600; cursor: pointer; background: none; border: none;
  font-family: inherit; padding: 8px 4px;
}
.back-btn:hover { color: var(--ink); }

.trainer-head { margin-bottom: 22px; }
.trainer-head h2 { font-size: 23px; margin: 0 0 8px; letter-spacing: -.02em; }
.trainer-note {
  background: #fff8e8; border: 1px solid #f0dfa8; color: #7a5c10;
  border-radius: 12px; padding: 13px 16px; font-size: 13px; line-height: 1.5; margin-bottom: 8px;
}
[data-theme="dark"] .trainer-note {
  background: #2d1f00; border-color: #4a3500; color: #e6b800;
}
.trainer-note img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin-top: 8px;
  cursor: zoom-in;
}
.trainer-summary { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }

.trainer-mode-selector { display: flex; gap: 8px; margin-bottom: 16px; }
.trainer-mode-selector .btn { flex: 1; text-align: center; }
.trainer-mode-selector .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.rxn-step {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px 26px; margin-bottom: 16px;
}
.rxn-step .rxn-num { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; }
.rxn-step .rxn-eq { font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 20px; line-height: 1.6; white-space: normal; }
.task-image {
  max-width: 100%; max-height: 320px; border-radius: 12px; border: 1px solid var(--line);
  display: block; margin: 4px 0 16px; cursor: zoom-in;
}
.task-image-gallery { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 16px; }
.task-image-gallery .task-image { margin: 0; max-width: 220px; max-height: 220px; }
.rxn-step .rxn-input-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rxn-step .rxn-input {
  flex: 1; min-width: 180px; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line);
  font-size: 18px; font-family: inherit; background: var(--bg); color: var(--ink);
}
.rxn-step .rxn-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.rxn-step .rxn-input.correct { border-color: var(--ok); background: var(--ok-bg); }
.rxn-step .rxn-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.rxn-step .rxn-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.rxn-step .rxn-feedback { margin-top: 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.rxn-step .rxn-feedback.ok { color: var(--ok); }
.rxn-step .rxn-feedback.bad { color: var(--bad); }
.rxn-step .rxn-explain {
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
  font-size: 13.5px; color: var(--ink-soft); line-height: 1.6;
}
.rxn-step .step-nav {
  display: flex; gap: 12px; align-items: center; justify-content: center;
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
}
.rxn-step .step-nav .nav-info { font-size: 13px; color: var(--ink-soft); min-width: 44px; text-align: center; }
.rxn-step .step-nav .flank-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; cursor: pointer; color: var(--ink); font-family: inherit;
}
.rxn-step .step-nav .flank-btn:hover { border-color: var(--ink); }
.rxn-step .step-nav .flank-btn:disabled { opacity: .35; cursor: not-allowed; }
.flash-card {
  background: var(--surface); border: 2px solid var(--line);
  border-radius: var(--radius); padding: 40px 30px; min-height: 200px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
}
.flash-card .card-number { position: absolute; top: 16px; left: 20px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.flash-card .card-question { font-size: 28px; font-weight: 700; text-align: center; padding: 20px 0; line-height: 1.6; white-space: normal; }
.flash-card .card-answer-block {
  margin-top: 4px; padding-top: 20px; border-top: 1px solid var(--line);
  width: 100%; text-align: center; font-size: 22px; font-weight: 700; color: var(--ok); line-height: 1.6;
}
.flash-card .card-actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.flash-card .card-nav {
  margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; gap: 16px; align-items: center; justify-content: center; width: 100%;
}
.flash-card .card-nav .nav-btn {
  padding: 8px 20px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600;
  color: var(--ink); font-family: inherit;
}
.flash-card .card-nav .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent); color: #fff; }
.flash-card .card-nav .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
.flash-card .card-nav .nav-info { font-size: 14px; color: var(--ink-soft); min-width: 60px; text-align: center; }

.rxn-list { display: flex; flex-direction: column; gap: 12px; }
.rxn-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px;
}
.rxn-card.state-correct { border-color: #bfe8d5; }
.rxn-card.state-wrong { border-color: #f3c6c1; }
.rxn-card .rxn-num { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; }
.rxn-card .rxn-eq { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 12px; line-height: 1.6; white-space: normal; }
.rxn-card .rxn-input-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rxn-card .rxn-input {
  flex: 1; min-width: 180px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--line);
  font-size: 16px; font-family: inherit; background: var(--bg); color: var(--ink);
}
.rxn-card .rxn-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.rxn-card .rxn-input.correct { border-color: var(--ok); background: var(--ok-bg); }
.rxn-card .rxn-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.rxn-card .rxn-feedback { margin-top: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.rxn-card .rxn-feedback.ok { color: var(--ok); }
.rxn-card .rxn-feedback.bad { color: var(--bad); }

.progress-rounds { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.progress-round { flex: 1; min-width: 150px; }
.progress-round .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
.progress-round .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-round .bar .fill { height: 100%; background: var(--accent); border-radius: 3px; }
.progress-round .bar .fill.done { background: var(--ok); }
.progress-round .count { font-size: 12px; font-weight: 600; margin-top: 4px; }

.options-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.options-group label { display: flex; align-items: center; gap: 10px; font-size: 16px; cursor: pointer; }
.options-group input[type="radio"], .options-group input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }

.scroll-top-btn {
  position: fixed; bottom: 30px; right: 30px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
  z-index: 40; display: flex; align-items: center; justify-content: center;
}
.scroll-top-btn.hidden { opacity: 0; pointer-events: none; }

.stats-table { width: 100%; border-collapse: collapse; }
.stats-table th {
  text-align: left; padding: 12px 12px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft);
  border-bottom: 2px solid var(--line);
}
.stats-table td { padding: 12px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.stats-table .student-name {
  font-weight: 600; cursor: pointer; color: var(--accent);
  text-decoration: underline dotted; text-underline-offset: 3px;
}
.stats-table .student-name:hover { opacity: .75; }
.stats-progress-bar {
  width: 100%; max-width: 200px; height: 8px; border-radius: 4px;
  background: var(--line); overflow: hidden; display: inline-block;
}
.stats-progress-bar .fill { height: 100%; border-radius: 4px; background: var(--accent); }
.stats-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.student-detail-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.student-detail-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 18px; flex-wrap: wrap;
}

  return str.split('+').map(s => normalizeToken(s)).filter(s => s.length > 0);

function arraysEqualAsSets(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort();
  const sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);

  }
  const variants = answer.split('/').map(s => s.trim()).filter(s => s.length > 0);
  const isInvalid = variants.some(v => {
    const clean = v.replace(/\s/g, '');
    return clean === '0' || clean === '-' || clean === '−' ||
      /НЕ ИДЁТ|НЕ ИДЕТ/i.test(v);
  });
  if (isInvalid) return { correctSets: [], correctSetsDisplay: [], valid: false };
  const correctSets = variants.map(v => v.split('+').map(s => normalizeToken(s)).filter(s => s.length > 0));
  const correctSetsDisplay = variants.map(v => v.split('+').map(s => cleanDisplayToken(s)).filter(s => s.length > 0));
  return { correctSets, correctSetsDisplay, valid: true };
}

function checkAnswer(reaction, userInput, taskType) {
  const raw = (userInput || '').trim();
  if (!raw) return false;
  const norm = raw.replace(/\s+/g, '');
  if (norm === '0' || norm === '-' || norm === '−' ||
      norm.toUpperCase() === 'НЕТ' || norm.toUpperCase() === 'НЕИДЕТ' ||
      norm.toUpperCase() === 'НЕИДЁТ') {
    return !reaction.valid;
  }
  if (!reaction.valid) return false;
  const correctSets = Array.isArray(reaction.correctSets) ? reaction.correctSets : [];
  if (taskType === 'checkbox') {
    const userAnswers = parseCheckboxAnswers(raw);
    const correctSet = correctSets.length > 0 ? correctSets[0] : [];
    return arraysEqualAsSets(userAnswers, correctSet);
  }
  const userProducts = splitProducts(raw);
  for (const correctVariant of correctSets) {
    if (arraysEqualAsSets(userProducts, correctVariant)) return true;
  }
  return false;
}

// [+FONT]
function normalizeFontSize(v, fallback) {
  const n = parseInt(v, 10);
  if (!isFinite(n)) return fallback;
  return Math.max(8, Math.min(96, n));
}
function taskFontSize(item, row) {
  if (row && row.fontSize) return normalizeFontSize(row.fontSize, DEFAULT_TASK_FONT_SIZE);
  if (item && item.fontSize) return normalizeFontSize(item.fontSize, DEFAULT_TASK_FONT_SIZE);
  return DEFAULT_TASK_FONT_SIZE;
}
function stepFontSize(item, row) {
  if (row && row.fontSize) return normalizeFontSize(row.fontSize, DEFAULT_STEP_FONT_SIZE);
  if (item && item.fontSize) return normalizeFontSize(item.fontSize, DEFAULT_STEP_FONT_SIZE);
  return DEFAULT_STEP_FONT_SIZE;
}
function theoryFontSize(theory) {
  if (theory && theory.fontSize) return normalizeFontSize(theory.fontSize, DEFAULT_THEORY_FONT_SIZE);
  return DEFAULT_THEORY_FONT_SIZE;
}

function errorKey(sourceType, sourceId, taskIdx) {
  return `${sourceType}_${sourceId}_${taskIdx}`;
}

function getTopicNameById(topicId) {
  const t = TOPICS.find(x => x.id === topicId);
  return t ? t.name : '(без темы)';
}

function recordError(progressObj, studentKey, isRealStudent, params) {
  const { sourceType, sourceId, sourceTitle, topicId, taskIdx, question, correctAnswer, explanation, images, taskType, options, htmlContent } = params;
  const key = errorKey(sourceType, sourceId, taskIdx);
  if (!progressObj.__errors) progressObj.__errors = {};
  const existing = progressObj.__errors[key] || {};
  progressObj.__errors[key] = {
    key, sourceType, sourceId, sourceTitle, topicId,
    topicName: getTopicNameById(topicId),
    taskIdx, taskNum: taskIdx + 1,
    question, correctAnswer,
    explanation: explanation || '',
    images: images || [],
    taskType: taskType || 'text',
    options: options || [],
    htmlContent: htmlContent || '',
    mastery: existing.mastery || 0,
    lastWrongAt: Date.now(),
    createdAt: existing.createdAt || Date.now()
  };
  if (isRealStudent) persistFullProgress(studentKey, progressObj);
}

function applyErrorMastery(progressObj, studentKey, isRealStudent, errKey, correct) {
  if (!progressObj.__errors) return false;
  const err = progressObj.__errors[errKey];
  if (!err) return false;
  if (correct) {
    err.mastery = (err.mastery || 0) + 1;
    if (err.mastery >= ERROR_MASTERY_TARGET) {
      delete progressObj.__errors[errKey];
      if (isRealStudent) persistFullProgress(studentKey, progressObj);
      return true;
    }
  } else {
    err.mastery = 0;
  }
  if (isRealStudent) persistFullProgress(studentKey, progressObj);
  return false;
}

function countErrors(progress) {
  if (!progress || !progress.__errors) return 0;
  return Object.keys(progress.__errors).length;
}

function getErrorList(progress) {
  if (!progress || !progress.__errors) return [];
  return Object.values(progress.__errors).sort((a, b) => (b.lastWrongAt || 0) - (a.lastWrongAt || 0));
}

async function loadFromFirebase(path, defaultValue) {
  try {
    const snapshot = await get(ref(db, path));
    if (snapshot.exists()) return snapshot.val();
    await set(ref(db, path), defaultValue);
    return defaultValue;
  } catch (e) {
    console.error('Ошибка загрузки из Firebase:', e);
    return defaultValue;
  }
}

  } catch (e) {

  }
}

window.handleLogin = async function() {
  const nameInput = document.getElementById('loginName').value.trim();
  const passInput = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  errBox.textContent = '';
  if (!nameInput || !passInput) { errBox.textContent = 'Введите имя и пароль.'; return; }

  // 1) Вход учителя по паролю платформы
  for (const key of Object.keys(platforms)) {
    if (passInput === platforms[key].password && nameInput.toLowerCase() === 'admin') {
      CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true, platform: key };
      TEACH_MODE = false;
      saveSession({ key: '__teacher__', isTeacher: true, name: 'Учитель', platform: key });
      saveActivePlatform(key);
      await startApp();
      return;
    }
  }

  // 2) Глобальный админ
  if (nameInput.toLowerCase() === TEACHER_LOGIN && passInput === TEACHER_PASS) {
    CURRENT_USER = { name: 'Учитель', key: '__teacher__', isTeacher: true, platform: currentPlatform };
    TEACH_MODE = false;
    saveSession({ key: '__teacher__', isTeacher: true, name: 'Учитель', platform: currentPlatform });
    await startApp();
    return;
  }

  const key = nameInput.toLowerCase();

  // 3) Сначала ищем на ТЕКУЩЕЙ платформе
  const orderPlatIds = [currentPlatform, ...Object.keys(platforms).filter(p => p !== currentPlatform)];

  // Собираем все совпадения по имени на всех платформах
  const matches = [];
  for (const platId of orderPlatIds) {
    const platReg = await loadFromFirebase(getPlatformPath(platId, 'registry'), {});
    if (platReg[key]) {
      matches.push({ platId, student: platReg[key] });
    }
  }

  if (matches.length === 0) {
    errBox.textContent = 'Такого ученика нет. Обратитесь к учителю.';
    return;
  }

  // 4) Проверяем пароль среди всех совпадений. Приоритет — текущая платформа.
  let found = null;
  for (const m of matches) {
    if (m.student.password === passInput) { found = m; break; }
  }

  if (!found) {
    if (matches.length > 1) {
      errBox.textContent = 'Неверный пароль. Ученик с таким именем есть на нескольких платформах — уточните у учителя, на какой вы занимаетесь.';
    } else {
      errBox.textContent = 'Неверный пароль.';
    }
    return;
  }

  saveActivePlatform(found.platId);
  allStudents = [];
  CURRENT_USER = { name: found.student.name, key, isTeacher: false, platform: found.platId };
  saveSession({ key, isTeacher: false, name: CURRENT_USER.name, platform: found.platId });
  await startApp();
};

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapeHtmlMultiline(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }

function escapeAttr(s) {
  if (!s) return '';
  return (s || '').replace(/"/g, '&quot;');
}

function renderEquation(str) {
  if (!str) return '';
  let safe = String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  safe = safe
    .replace(/&lt;sub&gt;/g, '<sub>')
    .replace(/&lt;\/sub&gt;/g, '</sub>')
    .replace(/&lt;sup&gt;/g, '<sup>')
    .replace(/&lt;\/sup&gt;/g, '</sup>')
    .replace(/&lt;b&gt;/g, '<b>')
    .replace(/&lt;\/b&gt;/g, '</b>');
  return safe.replace(/\n/g, '<br>');
}

function getSamaraTimestamp(dateStr) {
  if (!dateStr) return null;
  const [datePart, timePart] = dateStr.split('T');
  const [year, month, day] = datePart.split('-').map(Number);
  const [hours, minutes] = timePart.split(':').map(Number);
  return new Date(Date.UTC(year, month - 1, day, hours - 4, minutes)).getTime();
}

function getSamaraDateString(date) {
  const d = new Date(date);
  const samaraOffset = 4 * 60 * 60 * 1000;
  const localOffset = d.getTimezoneOffset() * 60 * 1000;
  const samaraTime = new Date(d.getTime() + localOffset + samaraOffset);
  return samaraTime.toISOString().slice(0, 16);
}

function getTimeUntil(timestamp) {
  const now = Date.now();
  const diff = timestamp - now;
  if (diff <= 0) return null;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  if (days > 0) return `${days} дн. ${hours} ч.`;
  if (hours > 0) return `${hours} ч. ${minutes} мин.`;
  return `${minutes} мин.`;
}

function compressImageToDataUrl(file, maxSize) {
  return new Promise((resolve, reject) => {
    const size = maxSize || 128;
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const srcSize = Math.min(img.width, img.height);
        const srcX = (img.width - srcSize) / 2;
        const srcY = (img.height - srcSize) / 2;
        ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function compressTaskImageToDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('Файл не выбран')); return; }
    if (!file.type || !file.type.startsWith('image/')) {
      reject(new Error('Это не картинка. Выберите файл изображения.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Браузер не смог прочитать файл.'));
    reader.onload = () => {
      if (!reader.result || typeof reader.result !== 'string') {
        reject(new Error('Файл прочитан, но результат пустой.'));
        return;
      }
      resolve(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file, maxBytes) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('Файл не выбран')); return; }
    const limit = maxBytes || 900 * 1024;
    if (file.size > limit) {
      reject(new Error('Файл слишком большой (' + Math.round(file.size/1024) + ' КБ). Максимум — ' + Math.round(limit/1024) + ' КБ.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Не удалось прочитать файл.'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

}

const KIND_META = {
  trainer:  { coll: () => TRAINERS,  persist: () => persistTrainers(),  label: 'Тренажёр' },
  homework: { coll: () => HOMEWORKS, persist: () => persistHomeworks(), label: 'Домашка'  },
  theory:   { coll: () => THEORIES,  persist: () => persistTheories(),  label: 'Теория'   },
  lesson:   { coll: () => LESSONS,   persist: () => persistLessons(),   label: 'Урок'     }
};

function buildExportPayload(kind, item) {
  const clean = JSON.parse(JSON.stringify(item));
  delete clean.id;
  delete clean.order;
  return {
    _chem_export: 1,
    kind,
    topicIdSource: item.topicId || null,
    title: item.title || '',
    data: clean
  };
}

function exportPayloadToText(payload) {
  return JSON.stringify(payload, null, 2);
}

async function importCodeFromText(text, forcedKind, forcedTopicId) {
  let payload;
  try { payload = JSON.parse(text); }
  catch (e) { throw new Error('Это не JSON-код материала. Проверьте, что скопировали целиком.'); }

  if (!payload || !payload._chem_export) throw new Error('В коде нет метки _chem_export.');
  const kind = forcedKind || payload.kind;
  if (!KIND_META[kind]) throw new Error('Неизвестный тип материала в коде: ' + kind);

  let targetTopicId = forcedTopicId || null;
  if (!targetTopicId) {
    const same = TOPICS.find(t => t.id === payload.topicIdSource);
    targetTopicId = same ? same.id : (TOPICS[0] ? TOPICS[0].id : null);
  }
  if (!targetTopicId) throw new Error('Нет ни одной темы — сначала создайте тему.');

  const item = JSON.parse(JSON.stringify(payload.data || {}));
  item.id = kind + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  item.topicId = targetTopicId;

  const coll = KIND_META[kind].coll();
  const siblings = coll.filter(t => t.topicId === targetTopicId);
  const maxOrder = siblings.length ? Math.max(...siblings.map(t => t.order || 0)) : -1;
  item.order = maxOrder + 1;

  if (!item.title && payload.title) item.title = payload.title;

  coll.push(item);
  await KIND_META[kind].persist();
  return { kind, title: item.title, topicId: targetTopicId };
}

window.showExportModal = function(kind, id) {
  const coll = KIND_META[kind] ? KIND_META[kind].coll() : null;
  if (!coll) return;
  const item = coll.find(x => x.id === id);
  if (!item) { alert('Материал не найден.'); return; }

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = '720px';

  const payload = buildExportPayload(kind, item);

  modal.innerHTML = `
    <h3>Код материала: ${escapeHtml(item.title)}</h3>
    <div class="export-hint">Скопируйте этот текст и вставьте в «Импорт кода» на любой платформе (или в поле «Вставить код» ниже — тогда создастся копия здесь же).</div>

  modal.querySelector('#copyExportBtn').onclick = async () => {
    const ta = modal.querySelector('#exportCodeArea');
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(ta.value);
      } else {
        document.execCommand('copy');
      }
      modal.querySelector('#copyExportBtn').textContent = '✓ Скопировано';
      setTimeout(() => { modal.querySelector('#copyExportBtn').textContent = 'Скопировать код'; }, 1500);
    } catch (e) {
      alert('Не удалось скопировать автоматически. Выделите текст и нажмите Ctrl+C.');
    }
  };
};

}
function toggleTeachVisibility(id) {
  if (teachHiddenIds.has(id)) teachHiddenIds.delete(id);
  else teachHiddenIds.add(id);
  render();
}

// ============================================================
// 12. ГЛАВНАЯ
// ============================================================

async function renderHome(container) {
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.innerHTML = `<h1 class="page-title">Содержание</h1><p class="page-sub">${isManaging() ? 'Управляйте темами и материалами.' : (TEACH_MODE ? 'Выберите материал для решения с учеником' : 'Выберите тренажёр, теорию или видеоурок по теме')}</p>`;
  wrap.appendChild(title);

  // [+TEACH] панель выбора видимых материалов
  if (TEACH_MODE) {
    wrap.appendChild(buildTeachPanel());
  }

  let progress = {};
  if (!CURRENT_USER.isTeacher) {
    progress = window.__cachedProgress || await getProgress(CURRENT_USER.key);
    window.__cachedProgress = progress;
  }

  const errorsEnabled = !CURRENT_USER.isTeacher && CURRENT_USER.errorsEnabled !== false;
  if (errorsEnabled && !TEACH_MODE) {
    const errCount = countErrors(progress);
    const panel = document.createElement('div');
    panel.className = 'errors-panel';
    if (errCount === 0) {
      panel.innerHTML = `
        <div class="errors-panel__icon empty">✓</div>
        <div class="errors-panel__body">
          <div class="errors-panel__title">Мои ошибки</div>
          <div class="errors-panel__sub">Ошибок нет — так держать!</div>
        </div>
      `;
    } else {
      panel.innerHTML = `
        <div class="errors-panel__icon">!</div>
        <div class="errors-panel__body">
          <div class="errors-panel__title">Мои ошибки: ${errCount}</div>
          <div class="errors-panel__sub">Отработайте каждую ${ERROR_MASTERY_TARGET} раза правильно — и она исчезнет</div>
        </div>
        <div class="errors-panel__actions">
          <button class="btn btn-accent" id="errorsPanelPracticeAll">Отработать все</button>
          <button class="btn btn-ghost" id="errorsPanelView">Посмотреть</button>
        </div>
      `;
    }
    panel.onclick = (e) => {
      if (e.target.closest('#errorsPanelPracticeAll')) return;
      if (e.target.closest('#errorsPanelView')) return;
      VIEW = { name: 'errors' };
      render();
    };
    wrap.appendChild(panel);

    if (errCount > 0) {
      const practiceBtn = panel.querySelector('#errorsPanelPracticeAll');
      if (practiceBtn) practiceBtn.onclick = (e) => {
        e.stopPropagation();
        openErrorsPracticeModal(getErrorList(progress), progress, true, CURRENT_USER.key);
      };
      const viewBtn = panel.querySelector('#errorsPanelView');
      if (viewBtn) viewBtn.onclick = (e) => {
        e.stopPropagation();
        VIEW = { name: 'errors' };
        render();
      };
    }
  }

  if (CURRENT_USER.isTeacher && !TEACH_MODE) {
    const tabs = document.createElement('div');
    tabs.className = 'maintabs';
    tabs.innerHTML = `
      <div class="maintab active" id="tabContent">Содержание</div>
      <div class="maintab" id="tabStats">Статистика</div>
      <div class="maintab" id="tabTeach">Обучаю</div>
    `;
    tabs.querySelector('#tabContent').onclick = () => { VIEW = { name: 'home' }; render(); };
    tabs.querySelector('#tabStats').onclick = () => { VIEW = { name: 'stats' }; render(); };
    tabs.querySelector('#tabTeach').onclick = () => { window.enterTeachMode(); };
    wrap.appendChild(tabs);
    wrap.appendChild(buildAdminBuilder());
    wrap.appendChild(buildAIBuilder());
    wrap.appendChild(buildGroupsBuilder());
  }

  const sortedTopics = [...TOPICS].sort((a, b) => a.order - b.order);

  function isItemAvailable(item) {
    if (!item) return true;
    if (item.isDraft && !isManaging() && !TEACH_MODE) return false;
    if (item.isLocked && !isManaging() && !TEACH_MODE) return true;
    if (item.scheduledRelease && !isManaging() && !TEACH_MODE) {
      if (Date.now() < item.scheduledRelease) return true;
    }
    if (item.assignedTo && item.assignedTo.length > 0 && !isManaging() && !TEACH_MODE) {
      if (!CURRENT_USER || CURRENT_USER.isTeacher) return true;
      if (!item.assignedTo.includes(CURRENT_USER.key)) return false;
    }
    return true;
  }

  function isItemClickable(item) {
    if (!item) return true;
    if (item.isDraft && !isManaging() && !TEACH_MODE) return false;
    if (item.isLocked && !isManaging() && !TEACH_MODE) return false;
    if (item.scheduledRelease && !isManaging() && !TEACH_MODE) {
      if (Date.now() < item.scheduledRelease) return false;
    }
    if (item.assignedTo && item.assignedTo.length > 0 && !isManaging() && !TEACH_MODE) {
      if (!CURRENT_USER || CURRENT_USER.isTeacher) return true;
      if (!item.assignedTo.includes(CURRENT_USER.key)) return false;
    }
    return true;
  }

  function getItemBadge(item) {
    if (!item) return '';
    if (item.isDraft && (isManaging() || TEACH_MODE)) return '<span class="card-badge">Черновик</span>';
    if (item.isLocked) return '<span class="card-badge">Заблокировано</span>';
    if (item.scheduledRelease && !isManaging() && !TEACH_MODE) {
      if (Date.now() < item.scheduledRelease) {
        const timeLeft = getTimeUntil(item.scheduledRelease);
        return `<span class="card-badge">Через ${timeLeft}</span>`;
      }
    }
    if (item.assignedTo && item.assignedTo.length > 0 && (isManaging() || TEACH_MODE)) {
      const names = item.assignedTo;
      const shortLabel = names.length > 2 ? `${names.slice(0, 2).join(', ')} +${names.length - 2}` : names.join(', ');
      return `<span class="card-badge personal">Личное: ${escapeHtml(shortLabel)}</span>`;
    }
    return '';
  }

  function buildCardControls(kind, item) {
    return `<div class="card-edit-row">
      <button class="icon-btn" data-act="up" title="Вверх">↑</button>
      <button class="icon-btn" data-act="down" title="Вниз">↓</button>
      <button class="icon-btn" data-act="move" title="Переместить в тему">⇄</button>
      <button class="icon-btn" data-act="group" title="В группу">▣</button>
      <button class="icon-btn" data-act="edit" title="Редактировать">✎</button>
      <button class="icon-btn" data-act="pdf" title="Печать / PDF">🖨</button>
      <button class="icon-btn" data-act="export" title="Код материала (экспорт/копия)">⤓</button>
      <button class="icon-btn" data-act="copy" title="Дублировать внутри платформы">⧉</button>
      <button class="icon-btn danger" data-act="del" title="Удалить">✕</button>
    </div>`;
  }
  function bindCardControls(cardEl, kind, item) {
    const q = (act) => cardEl.querySelector(`[data-act="${act}"]`);
    const up = q('up'), down = q('down'), move = q('move'), group = q('group'), edit = q('edit'), pdf = q('pdf'), exp = q('export'), cp = q('copy'), del = q('del');
    if (up) up.onclick = (e) => { e.stopPropagation(); moveItem(kind, item.id, -1); };
    if (down) down.onclick = (e) => { e.stopPropagation(); moveItem(kind, item.id, 1); };
    if (move) move.onclick = (e) => { e.stopPropagation(); moveItemToTopic(kind, item.id); };
    if (group) group.onclick = (e) => { e.stopPropagation(); assignItemToGroup(kind, item.id); };
    if (edit) {
      edit.onclick = (e) => {
        e.stopPropagation();
        if (kind === 'trainer') openEditTrainerModal(item.id);
        else if (kind === 'homework') openEditHomeworkModal(item.id);
        else if (kind === 'lesson') openEditLessonModal(item.id);
        else if (kind === 'theory') openEditTheoryModal(item.id);
      };
    }
    if (pdf) pdf.onclick = (e) => { e.stopPropagation(); openPrintModal(kind, item.id); };
    if (exp) exp.onclick = (e) => { e.stopPropagation(); window.showExportModal(kind, item.id); };
    if (cp) cp.onclick = (e) => { e.stopPropagation(); copyItem(kind, item.id); };
    if (del) del.onclick = (e) => { e.stopPropagation(); deleteItemConfirm(kind, item.id); };
  }

  // [+TEACH] построение карточки с учётом скрытия
  function makeCard(item, type) {
    if (!item) return null;
    if (TEACH_MODE && isHiddenInTeach(item)) return null;
    const isClickable = isItemClickable(item);
    const badge = getItemBadge(item);
    const card = document.createElement('div');
    card.className = 'card';

    if (type === 'theory') {
      card.innerHTML = `
        <span class="kind theory">Теория</span>
        <h3>${escapeHtml(item.title)}</h3>
        <div class="meta">${item.file ? '📎 ' + escapeHtml(item.file.name || 'файл') : (item.linkUrl ? '🔗 Ссылка' : (item.description ? 'Текст' : (item.htmlContent ? 'HTML' : 'Материал')))}</div>
        ${badge}
        ${isManaging() ? buildCardControls('theory', item) : ''}
      `;
      if (isManaging()) {
        bindCardControls(card, 'theory', item);
        card.onclick = () => { VIEW = { name: 'theory', theoryId: item.id }; render(); };
      } else if (isClickable) {
        card.onclick = () => { VIEW = { name: 'theory', theoryId: item.id }; render(); };
      } else { card.style.cursor = 'default'; card.style.opacity = '0.7'; }
    } else if (type === 'trainer') {
      let pct = 0, isFinished = false;
      if (!CURRENT_USER.isTeacher) {
        const td = progress[item.id] || {};
        const st = td.statuses || [];
        const len = (item.reactions || []).length;
        const done = st.filter(s => s === 'correct').length;
        pct = len ? Math.round(done / len * 100) : 0;
        isFinished = !!td.__finished;
      }
      if (isFinished) { card.style.borderColor = 'var(--ok)'; card.style.backgroundColor = 'var(--ok-bg)'; }
      card.innerHTML = `
        <div class="card-top-row"><div><span class="kind">Тренажёр</span></div>${badge}</div>
        <h3>${escapeHtml(item.title)}</h3>
        <div class="meta">${(item.reactions || []).length} реакций${isManaging() ? ` · ${item.mode === 'step' ? 'Пошагово' : item.mode === 'cards' ? 'Карты' : 'Список'}${item.allowModeChoice ? ' · свободный режим' : ''}${item.randomOrder ? ' · рандом' : ''}` : ''}</div>
        ${(!CURRENT_USER.isTeacher) ? `<div class="progress-bar"><div class="progress-fill${isFinished ? ' finished' : ''}" style="width:${pct}%"></div></div>` : ''}
        ${isManaging() ? buildCardControls('trainer', item) : ''}
      `;
      if (isManaging()) {
        bindCardControls(card, 'trainer', item);
        card.onclick = () => { VIEW = { name: 'trainer', trainerId: item.id }; render(); };
      } else if (isClickable) {
        card.onclick = () => { VIEW = { name: 'trainer', trainerId: item.id }; render(); };
      } else { card.style.cursor = 'default'; card.style.opacity = '0.7'; }
    } else if (type === 'lesson') {
      let lessonFinished = false;
      if (!CURRENT_USER.isTeacher) lessonFinished = !!progress['lesson:' + item.id];
      if (lessonFinished) { card.style.borderColor = 'var(--ok)'; card.style.backgroundColor = 'var(--ok-bg)'; }
      card.innerHTML = `
        <span class="kind lesson">Урок</span>
        <h3>${escapeHtml(item.title)}</h3>
        <div class="meta">${(item.links || []).length} видео · ${(item.files || []).length} файлов</div>
        ${badge}
        ${isManaging() ? buildCardControls('lesson', item) : ''}
      `;
      if (isManaging()) {
        bindCardControls(card, 'lesson', item);
        card.onclick = () => { VIEW = { name: 'lesson', lessonId: item.id }; renderLessonModal(item.id); };
      } else if (isClickable) {
        card.onclick = () => { VIEW = { name: 'lesson', lessonId: item.id }; renderLessonModal(item.id); };
      } else { card.style.cursor = 'default'; card.style.opacity = '0.7'; }
    } else if (type === 'homework') {
      let hwPct = 0, hwFinished = false;
      if (!CURRENT_USER.isTeacher) {
        const hd = progress[item.id] || {};
        const st = hd.statuses || [];
        const done = st.filter(s => s === 'correct').length;
        const len = (item.tasks || []).length;
        hwPct = len ? Math.round(done / len * 100) : 0;
        hwFinished = !!hd.__finished;
      }
      if (hwFinished) { card.style.borderColor = 'var(--ok)'; card.style.backgroundColor = 'var(--ok-bg)'; }
      card.innerHTML = `
        <span class="kind homework">Домашка</span>
        <h3>${escapeHtml(item.title)}</h3>
        <div class="meta">${(item.tasks || []).length} заданий${isManaging() ? ` · ${item.mode === 'step' ? 'Пошагово' : item.mode === 'cards' ? 'Карты' : 'Список'}${item.allowModeChoice ? ' · свободный режим' : ''}${item.randomOrder ? ' · рандом' : ''}` : ''}</div>
        ${(!CURRENT_USER.isTeacher) ? `<div class="progress-bar"><div class="progress-fill${hwFinished ? ' finished' : ''}" style="width:${hwPct}%"></div></div>` : ''}
        ${badge}
        ${isManaging() ? buildCardControls('homework', item) : ''}
      `;
      if (isManaging()) {
        bindCardControls(card, 'homework', item);
        card.onclick = () => { VIEW = { name: 'homework', homeworkId: item.id }; render(); };
      } else if (isClickable) {
        card.onclick = () => { VIEW = { name: 'homework', homeworkId: item.id }; render(); };
      } else { card.style.cursor = 'default'; card.style.opacity = '0.7'; }
    }
    return card;
  }

  for (const topic of sortedTopics) {
    const topicTheories = (THEORIES || []).filter(t => t.topicId === topic.id).sort((a, b) => a.order - b.order);
    const topicTrainers = (TRAINERS || []).filter(t => t.topicId === topic.id).sort((a, b) => a.order - b.order);
    const topicLessons = (LESSONS || []).filter(l => l.topicId === topic.id).sort((a, b) => a.order - b.order);
    const topicHomeworks = (HOMEWORKS || []).filter(h => h.topicId === topic.id).sort((a, b) => a.order - b.order);
    const topicGroups = (GROUPS || []).filter(g => g.topicId === topic.id).sort((a, b) => (a.order || 0) - (b.order || 0));

    let filteredTheories = topicTheories;
    let filteredTrainers = topicTrainers;
    let filteredLessons = topicLessons;
    let filteredHomeworks = topicHomeworks;
    if (!isManaging() && !TEACH_MODE) {
      filteredTheories = topicTheories.filter(t => isItemAvailable(t));
      filteredTrainers = topicTrainers.filter(t => isItemAvailable(t));
      filteredLessons = topicLessons.filter(l => isItemAvailable(l));
      filteredHomeworks = topicHomeworks.filter(h => isItemAvailable(h));
    }
    if (TEACH_MODE) {
      filteredTheories = topicTheories.filter(t => !isHiddenInTeach(t));
      filteredTrainers = topicTrainers.filter(t => !isHiddenInTeach(t));
      filteredLessons = topicLessons.filter(l => !isHiddenInTeach(l));
      filteredHomeworks = topicHomeworks.filter(h => !isHiddenInTeach(h));
    }
    const hasGroups = topicGroups.length > 0;
    if (filteredTheories.length === 0 && filteredTrainers.length === 0 && filteredLessons.length === 0 && filteredHomeworks.length === 0 && !isManaging() && !hasGroups) continue;

    const block = document.createElement('div');
    block.className = 'topic-block';

    const head = document.createElement('div');
    head.className = 'topic-block-head';
    const titleGroup = document.createElement('div');
    titleGroup.className = 'title-group';
    const h2 = document.createElement('h2');
    h2.textContent = topic.name;
    titleGroup.appendChild(h2);
    head.appendChild(titleGroup);

    if (isManaging()) {
      const editControls = document.createElement('div');
      editControls.className = 'topic-edit-controls';
      editControls.innerHTML = `
        <button class="icon-btn" title="Вверх" data-act="up">↑</button>
        <button class="icon-btn" title="Вниз" data-act="down">↓</button>
        <button class="icon-btn" title="Переименовать" data-act="rename">✎</button>
        <button class="icon-btn" title="Новая группа в теме" data-act="newgroup">▣</button>
        <button class="icon-btn danger" title="Удалить" data-act="del">✕</button>
      `;
      editControls.querySelector('[data-act="up"]').onclick = () => moveTopic(topic.id, -1);
      editControls.querySelector('[data-act="down"]').onclick = () => moveTopic(topic.id, 1);
      editControls.querySelector('[data-act="rename"]').onclick = () => renameTopicPrompt(topic.id);
      editControls.querySelector('[data-act="newgroup"]').onclick = () => createGroupPrompt(topic.id);
      editControls.querySelector('[data-act="del"]').onclick = () => deleteTopicConfirm(topic.id);
      head.appendChild(editControls);
    }
    block.appendChild(head);

    // [+GROUP] распределение материалов по группам
    const ungrouped = { theories: [], trainers: [], lessons: [], homeworks: [] };
    const groupedMap = {};
    topicGroups.forEach(g => groupedMap[g.id] = { theories: [], trainers: [], lessons: [], homeworks: [] });

    for (const t of filteredTheories) { if (t.groupId && groupedMap[t.groupId]) groupedMap[t.groupId].theories.push(t); else ungrouped.theories.push(t); }
    for (const t of filteredTrainers) { if (t.groupId && groupedMap[t.groupId]) groupedMap[t.groupId].trainers.push(t); else ungrouped.trainers.push(t); }
    for (const l of filteredLessons) { if (l.groupId && groupedMap[l.groupId]) groupedMap[l.groupId].lessons.push(l); else ungrouped.lessons.push(l); }
    for (const h of filteredHomeworks) { if (h.groupId && groupedMap[h.groupId]) groupedMap[h.groupId].homeworks.push(h); else ungrouped.homeworks.push(h); }

    function buildGrid(items) {
      const grid = document.createElement('div');
      grid.className = 'grid';
      const allItems = [];
      for (const t of items.theories) allItems.push({ ...t, _type: 'theory' });
      for (const t of items.trainers) allItems.push({ ...t, _type: 'trainer' });
      for (const l of items.lessons) allItems.push({ ...l, _type: 'lesson' });
      for (const h of items.homeworks) allItems.push({ ...h, _type: 'homework' });
      allItems.sort((a, b) => a.order - b.order);
      for (const item of allItems) {
        const card = makeCard(item, item._type);
        if (card) grid.appendChild(card);
      }
      if (allItems.length === 0) grid.innerHTML = `<div class="empty-note">В этой группе пока нет материалов.</div>`;
      return grid;
    }

    // группы
    for (const g of topicGroups) {
      const gData = groupedMap[g.id];
      const totalInGroup = gData.theories.length + gData.trainers.length + gData.lessons.length + gData.homeworks.length;
      if (TEACH_MODE && totalInGroup === 0) continue;
      const groupEl = document.createElement('div');
      groupEl.className = 'material-group' + (g.collapsed ? ' collapsed' : '');
      const groupHead = document.createElement('div');
      groupHead.className = 'material-group-head';
      groupHead.innerHTML = `
        <div class="mg-left">
          <span class="mg-arrow">▼</span>
          <span class="mg-name">${escapeHtml(g.name)}</span>
          <span class="mg-count">${totalInGroup} материал(ов)</span>
        </div>
        ${isManaging() ? `<div class="mg-controls">
          <button class="icon-btn" data-gact="rename" title="Переименовать группу">✎</button>
          <button class="icon-btn" data-gact="up" title="Выше">↑</button>
          <button class="icon-btn" data-gact="down" title="Ниже">↓</button>
          <button class="icon-btn danger" data-gact="del" title="Удалить группу">✕</button>
        </div>` : ''}
      `;
      groupHead.onclick = async (e) => {
        if (e.target.closest('[data-gact]')) return;
        g.collapsed = !g.collapsed;
        await persistGroups();
        render();
      };
      if (isManaging()) {
        groupHead.querySelector('[data-gact="rename"]').onclick = async (e) => {
          e.stopPropagation();
          window.showPromptModal('Переименовать группу', g.name, async (val) => {
            if (!val.trim()) return;
            g.name = val.trim();
            await persistGroups();
            render();
          });
        };
        groupHead.querySelector('[data-gact="up"]').onclick = (e) => { e.stopPropagation(); moveGroup(topic.id, g.id, -1); };
        groupHead.querySelector('[data-gact="down"]').onclick = (e) => { e.stopPropagation(); moveGroup(topic.id, g.id, 1); };
        groupHead.querySelector('[data-gact="del"]').onclick = (e) => {
          e.stopPropagation();
          window.showConfirmModal('Удалить группу?', 'Материалы останутся, но выйдут из группы.', async () => {
            [...TRAINERS, ...HOMEWORKS, ...LESSONS, ...THEORIES].forEach(it => { if (it.groupId === g.id) delete it.groupId; });
            GROUPS = GROUPS.filter(x => x.id !== g.id);
            await persistGroups();
            await persistTrainers(); await persistHomeworks(); await persistLessons(); await persistTheories();
            render();
          });
        };
      }
      groupEl.appendChild(groupHead);
      const groupBody = document.createElement('div');
      groupBody.className = 'material-group-body';
      groupBody.appendChild(buildGrid(gData));
      groupEl.appendChild(groupBody);
      block.appendChild(groupEl);
    }

    // материалы без группы
    const ungroupedTotal = ungrouped.theories.length + ungrouped.trainers.length + ungrouped.lessons.length + ungrouped.homeworks.length;
    if (ungroupedTotal > 0) {
      if (hasGroups) {
        const ungroupedWrap = document.createElement('div');
        ungroupedWrap.className = 'material-group unassigned';
        const uh = document.createElement('div');
        uh.className = 'material-group-head';
        uh.innerHTML = `<div class="mg-left"><span class="mg-name" style="font-weight:600;color:var(--ink-soft);">Без группы</span><span class="mg-count">${ungroupedTotal}</span></div>`;
        ungroupedWrap.appendChild(uh);
        const ub = document.createElement('div');
        ub.className = 'material-group-body';
        ub.appendChild(buildGrid(ungrouped));
        ungroupedWrap.appendChild(ub);
        block.appendChild(ungroupedWrap);
      } else {
        block.appendChild(buildGrid(ungrouped));
      }
    } else if (!hasGroups) {
      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.innerHTML = `<div class="empty-note">В этой теме пока нет материалов.</div>`;
      block.appendChild(grid);
    }

    wrap.appendChild(block);
  }

  container.appendChild(wrap);
}

// [+TEACH] панель управления видимостью
function buildTeachPanel() {
  const panel = document.createElement('div');
  panel.className = 'teach-panel';
  const all = [
    { kind: 'trainer', label: 'Тренажёры', items: TRAINERS },
    { kind: 'homework', label: 'Домашки', items: HOMEWORKS },
    { kind: 'lesson', label: 'Уроки', items: LESSONS },
    { kind: 'theory', label: 'Теории', items: THEORIES }
  ];
  let inner = `<h3>Что показывать в режиме «Обучаю»</h3>`;
  for (const block of all) {
    if (!block.items || block.items.length === 0) continue;
    inner += `<div class="tp-row"><div class="tp-label">${block.label}</div><div class="tp-items">`;
    for (const item of block.items) {
      const visible = !isHiddenInTeach(item);
      inner += `<span class="tp-item ${visible ? 'visible' : ''}" data-id="${item.id}">${escapeHtml(item.title)}</span>`;
    }
    inner += `</div></div>`;
  }
  inner += `<div class="tp-hint">Нажмите на название, чтобы скрыть/показать. Скрытые материалы не отображаются в содержании и не открываются в этом режиме.</div>`;
  panel.innerHTML = inner;
  panel.querySelectorAll('.tp-item').forEach(el => {
    el.onclick = () => toggleTeachVisibility(el.dataset.id);
  });
  return panel;
}

async function renderErrorsPage(container) {
  const isRealStudent = !CURRENT_USER.isTeacher;
  let progress;
  if (isRealStudent) {
    progress = await getProgress(CURRENT_USER.key);
    window.__cachedProgress = progress;
  } else {
    progress = window.__cachedProgress || {};
  }

  const wrap = document.createElement('div');
  const backRow = document.createElement('div');
  backRow.className = 'back-row';
  backRow.innerHTML = `<button class="back-btn">← Назад к содержанию</button>`;
  backRow.querySelector('.back-btn').onclick = window.goHome;
  wrap.appendChild(backRow);

  const title = document.createElement('div');
  title.innerHTML = `<h1 class="page-title">Мои ошибки</h1><p class="page-sub">Введите правильный ответ и нажмите «Проверить». Отработайте каждое ${ERROR_MASTERY_TARGET} раза правильно — и оно исчезнет. Если не знаете — нажмите «Ответ».</p>`;
  wrap.appendChild(title);

  const errors = getErrorList(progress);
  if (errors.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'errors-empty';
    empty.innerHTML = `<div class="big">🎉</div><div style="font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px;">Ошибок нет!</div><div>Так держать. Все задания отработаны.</div>`;
    wrap.appendChild(empty);
    container.appendChild(wrap);
    return;
  }

  const list = document.createElement('div');
  list.className = 'rxn-list';
  for (const err of errors) {
    const card = document.createElement('div');
    card.className = 'rxn-card';
    const sourceBits = [
      escapeHtml(err.topicName || ''),
      err.sourceType === 'trainer' ? 'Тренажёр' : 'Домашка',
      escapeHtml(err.sourceTitle || ''),
      `№ ${err.taskNum}`
    ];
    const masteryDots = Array.from({ length: ERROR_MASTERY_TARGET }, (_, i) =>
      `<span class="dot ${i < (err.mastery || 0) ? 'filled' : ''}"></span>`
    ).join('');

    let inputHtml = '';
    if (err.taskType === 'radio' || err.taskType === 'checkbox') {
      inputHtml = `<div class="options-group" data-idx="${err.key}">` + (err.options || []).map(opt => `
        <label><input type="${err.taskType === 'radio' ? 'radio' : 'checkbox'}" name="err_${err.key}" value="${escapeAttr(opt)}"> ${escapeHtml(opt)}</label>
      `).join('') + `</div>`;
    } else {
      inputHtml = `<div class="rxn-input-row"><input type="text" class="rxn-input" placeholder="Введите ответ" data-input="${err.key}"></div>`;
    }

    card.innerHTML = `
      <div class="rxn-num" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="error-card__source">${sourceBits.map((b, i) => i > 0 ? `<span class="sep">·</span>${b}` : b).join(' ')}</span>
        <span class="errors-progress-round" title="Отработано ${err.mastery || 0} из ${ERROR_MASTERY_TARGET}">${masteryDots}</span>
      </div>
      <div class="rxn-eq eqx" style="margin-top:10px;">${renderEquation(err.question)}</div>
      ${renderTaskImagesHtml(err, false)}
      ${renderHtmlContent(err.htmlContent)}
      ${inputHtml}
      <div class="rxn-actions">
        <button class="btn btn-sm btn-accent check-error-btn" data-key="${err.key}">Проверить</button>
        <button class="btn btn-sm btn-ghost show-answer-btn" data-key="${err.key}">Ответ</button>
        <button class="btn btn-sm btn-ghost retry-error-btn" data-key="${err.key}">Сбросить</button>
      </div>
      <div class="feedback-slot"></div>
      <div class="answer-slot"></div>
    `;
    const fbSlot = card.querySelector('.feedback-slot');
    const answerSlot = card.querySelector('.answer-slot');
    const checkBtn = card.querySelector('.check-error-btn');
    const answerBtn = card.querySelector('.show-answer-btn');
    const retryBtn = card.querySelector('.retry-error-btn');

    function getInputValue() {
      if (err.taskType === 'radio') {
        const c = card.querySelector(`input[name="err_${err.key}"]:checked`);
        return c ? c.value : '';
      }
      if (err.taskType === 'checkbox') {
        const c = card.querySelectorAll(`input[name="err_${err.key}"]:checked`);
        return Array.from(c).map(el => el.value).join(',');
      }
      const inp = card.querySelector(`input[data-input="${err.key}"]`);
      return inp ? inp.value.trim() : '';
    }
    function disableAllInputs(d) { card.querySelectorAll('input').forEach(inp => inp.disabled = d); }

    checkBtn.onclick = () => {
      const val = getInputValue();
      if (!val) { alert('Введите ответ'); return; }
      const sets = buildCorrectSets(err.correctAnswer, err.taskType);
      const fakeReaction = { valid: true, correctSets: sets.correctSets, correctSetsDisplay: sets.correctSetsDisplay };
      const isCorrect = checkAnswer(fakeReaction, val, err.taskType);
      if (isCorrect) {
        const removed = applyErrorMastery(progress, CURRENT_USER.key, true, err.key, true);
        fbSlot.innerHTML = '';
        const fb = document.createElement('div');
        fb.className = 'rxn-feedback ok';
        if (removed) {
          fb.textContent = 'Верно! Ошибка полностью отработана и удалена из списка.';
          disableAllInputs(true);
          checkBtn.disabled = true;
          answerBtn.disabled = true;
          card.style.borderColor = 'var(--ok)';
          setTimeout(() => { renderErrorsPage(container); }, 700);
        } else {
          const cur = progress.__errors[err.key]?.mastery || 0;
          fb.textContent = `Верно! Отработано ${cur} из ${ERROR_MASTERY_TARGET}.`;
          fbSlot.appendChild(fb);
          const dotsEl = card.querySelector('.errors-progress-round');
          if (dotsEl) dotsEl.innerHTML = Array.from({ length: ERROR_MASTERY_TARGET }, (_, i) => `<span class="dot ${i < cur ? 'filled' : ''}"></span>`).join('');
          disableAllInputs(true);
          checkBtn.disabled = true;
          card.style.borderColor = 'var(--ok)';
        }
      } else {
        applyErrorMastery(progress, CURRENT_USER.key, true, err.key, false);
        fbSlot.innerHTML = '';
        const fb = document.createElement('div');
        fb.className = 'rxn-feedback bad';
        fb.textContent = 'Неверно. Счётчик отработки сброшен.';
        fbSlot.appendChild(fb);
        card.style.borderColor = 'var(--bad)';
        const dotsEl = card.querySelector('.errors-progress-round');
        if (dotsEl) dotsEl.innerHTML = Array.from({ length: ERROR_MASTERY_TARGET }, () => `<span class="dot"></span>`).join('');
      }
    };
    answerBtn.onclick = () => {
      answerSlot.innerHTML = `
        <div style="margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;border-left:3px solid var(--ok);">
          <div style="font-size:13px;color:var(--ink-soft);margin-bottom:4px;">Правильный ответ:</div>
          <div style="font-size:15px;font-weight:600;color:var(--ok);">${renderEquation(err.correctAnswer || '—')}</div>
          ${err.explanation ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">${escapeHtml(err.explanation)}</div>` : ''}
        </div>`;
    };
    retryBtn.onclick = () => {
      disableAllInputs(false);
      checkBtn.disabled = false; answerBtn.disabled = false;
      fbSlot.innerHTML = ''; answerSlot.innerHTML = '';
      card.style.borderColor = '';
      if (err.taskType === 'radio' || err.taskType === 'checkbox') card.querySelectorAll('input').forEach(inp => inp.checked = false);
      else { const inp = card.querySelector(`input[data-input="${err.key}"]`); if (inp) inp.value = ''; }
    };
    list.appendChild(card);
  }
  wrap.appendChild(list);
  container.appendChild(wrap);
  attachImageZoomHandlers(container);
}

function renderOptionsHtml(err) {
  if (!err.options || err.options.length === 0) return '';
  const correctSet = err.taskType === 'checkbox'
    ? (err.correctAnswer || '').split(',').map(s => s.trim().toUpperCase())
    : [(err.correctAnswer || '').trim().toUpperCase()];
  return `<div class="options-group">` + err.options.map(opt => {
    const isRight = correctSet.includes(opt.trim().toUpperCase());
    return `<label style="${isRight ? 'color:var(--ok);font-weight:700;' : ''}">
      <input type="${err.taskType === 'radio' ? 'radio' : 'checkbox'}" disabled ${isRight ? 'checked' : ''}>
      ${escapeHtml(opt)}${isRight ? ' ✓' : ''}
    </label>`;
  }).join('') + `</div>`;
}

async function moveTopic(topicId, dir) {
  const sorted = [...TOPICS].sort((a, b) => a.order - b.order);
  const idx = sorted.findIndex(t => t.id === topicId);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= sorted.length) return;
  const tmp = sorted[idx].order;
  sorted[idx].order = sorted[swapIdx].order;
  sorted[swapIdx].order = tmp;
  await persistTopics();
  render();
}

async function renameTopicPrompt(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  if (!topic) return;
  window.showPromptModal('Переименовать тему', topic.name, async (val) => {
    if (!val.trim()) return;
    topic.name = val.trim();
    await persistTopics();
    render();
  });
}

async function deleteTopicConfirm(topicId) {

    (THEORIES || []).some(t => t.topicId === topicId) ||

  window.showConfirmModal('Удалить тему?', hasContent ? 'В этой теме есть материалы — они тоже будут удалены.' : 'Тема будет удалена.', async () => {
    TOPICS = TOPICS.filter(t => t.id !== topicId);
    TRAINERS = TRAINERS.filter(t => t.topicId !== topicId);
    LESSONS = LESSONS.filter(l => l.topicId !== topicId);
    HOMEWORKS = HOMEWORKS.filter(h => h.topicId !== topicId);
    THEORIES = THEORIES.filter(t => t.topicId !== topicId);
    GROUPS = GROUPS.filter(g => g.topicId !== topicId);
    await persistTopics();
    await persistTrainers();
    await persistLessons();
    await persistHomeworks();
    await persistTheories();
    await persistGroups();

  });
}

async function moveItem(type, id, dir) {
  let items, persistFn;
  if (type === 'trainer') { items = TRAINERS; persistFn = persistTrainers; }
  else if (type === 'lesson') { items = LESSONS; persistFn = persistLessons; }
  else if (type === 'homework') { items = HOMEWORKS; persistFn = persistHomeworks; }
  else if (type === 'theory') { items = THEORIES; persistFn = persistTheories; }
  else return;
  const item = items.find(t => t.id === id);
  if (!item) return;
  const allInTopic = [];
  for (const t of THEORIES) if (t.topicId === item.topicId) allInTopic.push({ ...t, _type: 'theory' });
  for (const t of TRAINERS) if (t.topicId === item.topicId) allInTopic.push({ ...t, _type: 'trainer' });
  for (const l of LESSONS) if (l.topicId === item.topicId) allInTopic.push({ ...l, _type: 'lesson' });
  for (const h of HOMEWORKS) if (h.topicId === item.topicId) allInTopic.push({ ...h, _type: 'homework' });
  allInTopic.sort((a, b) => a.order - b.order);
  const idx = allInTopic.findIndex(t => t.id === id && t._type === type);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= allInTopic.length) return;
  const tmp = allInTopic[idx].order;
  allInTopic[idx].order = allInTopic[swapIdx].order;
  allInTopic[swapIdx].order = tmp;
  for (const el of allInTopic) {
    if (el._type === 'theory') { const f = THEORIES.find(t => t.id === el.id); if (f) f.order = el.order; }
    else if (el._type === 'trainer') { const f = TRAINERS.find(t => t.id === el.id); if (f) f.order = el.order; }
    else if (el._type === 'lesson') { const f = LESSONS.find(l => l.id === el.id); if (f) f.order = el.order; }
    else if (el._type === 'homework') { const f = HOMEWORKS.find(h => h.id === el.id); if (f) f.order = el.order; }
  }
  await persistTheories();
  await persistTrainers();
  await persistLessons();
  await persistHomeworks();
  render();
}

async function moveItemToTopic(type, id) {
  let item, persistFn;
  if (type === 'trainer') { item = TRAINERS.find(t => t.id === id); persistFn = persistTrainers; }
  else if (type === 'lesson') { item = LESSONS.find(l => l.id === id); persistFn = persistLessons; }
  else if (type === 'homework') { item = HOMEWORKS.find(h => h.id === id); persistFn = persistHomeworks; }
  else if (type === 'theory') { item = THEORIES.find(t => t.id === id); persistFn = persistTheories; }
  else return;
  if (!item) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <h3>Переместить в тему</h3>
    <div class="field"><label>Тема назначения</label>
      <select id="targetTopic">
        ${TOPICS.filter(t => t.id !== item.topicId).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
      </select>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="cancelMove">Отмена</button>

async function deleteItemConfirm(type, id) {
  let items, persistFn, name;
  if (type === 'trainer') { items = TRAINERS; persistFn = persistTrainers; name = 'тренажёр'; }
  else if (type === 'lesson') { items = LESSONS; persistFn = persistLessons; name = 'урок'; }

  else return;

window.copyItem = function(type, id) {
  let item, items, persistFn;
  if (type === 'trainer') { item = TRAINERS.find(t => t.id === id); items = TRAINERS; persistFn = persistTrainers; }
  else if (type === 'lesson') { item = LESSONS.find(l => l.id === id); items = LESSONS; persistFn = persistLessons; }
  else if (type === 'homework') { item = HOMEWORKS.find(h => h.id === id); items = HOMEWORKS; persistFn = persistHomeworks; }
  else if (type === 'theory') { item = THEORIES.find(t => t.id === id); items = THEORIES; persistFn = persistTheories; }
  else return;
  if (!item) return;
  const newItem = JSON.parse(JSON.stringify(item));
  newItem.id = type + '_' + Date.now() + '_copy';
  newItem.title = item.title + ' (копия)';
  newItem.isLocked = false; newItem.isDraft = false; newItem.scheduledRelease = null; newItem.assignedTo = [];
  const siblings = items.filter(t => t.topicId === item.topicId);
  const maxOrder = siblings.length ? Math.max(...siblings.map(t => t.order)) : -1;
  newItem.order = maxOrder + 1;
  items.push(newItem);
  persistFn().then(() => render());
};

function buildGroupsBuilder() {
  const box = document.createElement('div');

  box.innerHTML = `
    <h3>Группы материалов</h3>
    <small class="help">Группа объединяет несколько материалов внутри одной темы (например, «Практика по оксидам»). Создать группу можно кнопкой ▣ рядом с названием темы. Назначить материал в группу — кнопкой ▣ на карточке материала.</small>
    <div id="groupsOverview"></div>
  `;
  const overview = box.querySelector('#groupsOverview');
  if (GROUPS.length === 0) overview.innerHTML = `<div class="empty-note">Групп пока нет.</div>`;
  else {
    for (const g of GROUPS) {
      const topic = TOPICS.find(t => t.id === g.topicId);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;';
      row.innerHTML = `<span><b>${escapeHtml(g.name)}</b> <span style="font-size:12px;color:var(--ink-soft);">— ${escapeHtml(topic ? topic.name : '(без темы)')}</span></span>`;
      overview.appendChild(row);
    }
  }
  return box;
}

window.createGroupPrompt = function(topicId) {
  window.showPromptModal('Новая группа', '', async (val) => {
    if (!val.trim()) return;
    const maxOrder = GROUPS.filter(g => g.topicId === topicId).reduce((m, g) => Math.max(m, g.order || 0), -1);
    GROUPS.push({ id: 'group_' + Date.now(), topicId, name: val.trim(), order: maxOrder + 1, collapsed: false });
    await persistGroups();
    render();
  });
};

window.moveGroup = async function(topicId, groupId, dir) {
  const siblings = GROUPS.filter(g => g.topicId === topicId).sort((a, b) => (a.order || 0) - (b.order || 0));
  const idx = siblings.findIndex(g => g.id === groupId);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;
  const tmp = siblings[idx].order; siblings[idx].order = siblings[swapIdx].order; siblings[swapIdx].order = tmp;
  await persistGroups();
  render();
};

window.assignItemToGroup = async function(kind, itemId) {
  const coll = KIND_META[kind] ? KIND_META[kind].coll() : null;
  if (!coll) return;
  const item = coll.find(x => x.id === itemId);
  if (!item) return;
  const topicGroups = GROUPS.filter(g => g.topicId === item.topicId);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <h3>В группу</h3>
    <div class="field"><label>Группа (в теме «${escapeHtml(getTopicNameById(item.topicId))}»)</label>
      <select id="targetGroup">
        <option value="">— Без группы —</option>
        ${topicGroups.map(g => `<option value="${g.id}" ${item.groupId === g.id ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('')}
      </select>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="cancelGroup">Отмена</button>
      <button class="btn btn-accent" id="saveGroup">Сохранить</button>
    </div>
  `;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  modal.querySelector('#cancelGroup').onclick = () => bg.remove();
  modal.querySelector('#saveGroup').onclick = async () => {
    const gid = document.getElementById('targetGroup').value;
    if (gid) item.groupId = gid; else delete item.groupId;
    await KIND_META[kind].persist();
    bg.remove();
    render();
  };
};
